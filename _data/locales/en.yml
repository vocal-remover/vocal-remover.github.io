  perfect_for_label: "Perfect for:"
  perfect_for_text: karaoke lovers, singers, vocal coaches, teachers, content creators and anyone practicing with online videos.
  pricing_template: "After free trial: WEEKLY_PRICE, YEARLY_PRICE subscriptions or LIFETIME_PRICE."
  offer_templates:
