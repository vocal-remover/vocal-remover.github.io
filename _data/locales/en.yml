use_cases:
  title: Who uses Vocal Remover?
  items:
    - title: Singers & karaoke lovers
      body: Instantly turn any track into a karaoke version. Practice in your own key, prepare set lists and rehearse without hunting for separate instrumental versions.
    - title: Producers & DJs
      body: Extract clean instrumentals and vocals for remixes, edits and mashups. Prepare stems for your DAW or live sets in just a few clicks.
    - title: Teachers & learners
      body: Create stripped-back tracks for lessons, ear training and transcription. Isolate vocals to study phrasing or remove them to let students perform on top.
    - title: Podcasters & content creators
      body: Remove background music under speech, clean intros and outros, and prepare clear stems for editing and repurposing your content.
faq:
  title: Frequently Asked Questions
  items:
    - question: Vocal Remover extension is slow or glitchy. What can I do?
      answers:
        - On some Windows computers, especially laptops, Windows may choose the power-saving graphics chip for your browser instead of the fast one. Because Vocal Remover extension processes sound in real time, this can cause slowdowns, stuttering audio, or prevent it from working at all.
      answer_html: 'You can tell Windows to use your high-performance graphics chip for your browser. We have a step-by-step guide with screenshots here: <a href="/blog/set-high-performance-gpu-for-chrome-edge-on-windows/" class="underline">Pick the high-performance graphics chip for Chrome &amp; Edge on Windows</a>. If following the guide does not help, your computer or browser may simply be too limited for real-time processing. In that case, try using Vocal Remover on a more powerful system if you have access to one.'
    - question: What's the difference between Vocal Remover Online and Vocal Remover Offline?
      answers:
        - Vocal Remover Online is a browser extension that removes vocals directly on websites like YouTube and other audio or video platforms.
        - Vocal Remover Offline is a standalone iPhone, iPad or Mac app that works fully offline with your own audio files and lets you batch process entire folders.
    - question: Do I need to upload audio files?
      answers:
        - No uploads needed.
        - The extension processes audio right in your browser on the fly, and the iPhone, iPad or Mac app works locally with files on your computer, with no servers involved.
    - question: Which audio formats does Vocal Remover Offline support?
      answers:
        - Vocal Remover for iPhone, iPad or Mac works with common formats such as WAV, AIFF, MP3, FLAC, M4A and more, so you can split the files you already have without converting. You can also drop videos, folders or regions from your DAW, and the app will extract the sound automatically.
    - question: Will removing vocals affect audio quality?
      answers:
        - Vocal Remover uses AI separation designed to keep instrumentals clean and musical.
        - Offline version offers better quality because it sees the whole song during processing and has more resources for computations.
        - Very complicated or noisy mixes may still show artifacts, but typical songs separate very well.
    - question: Can I also change the key of songs?
      linked_answers:
        - tool_key: pitch_changer
          template: Yes, use TOOL_LINK to shift pitch and change key of songs online or offline. It works great alongside Vocal Remover.
    - question: How can I change the tempo of a song?
      answers: []
      linked_answers:
        - tool_key: bpm_extension
          template: If you want to slow down or speed up music on a website while it is already playing, use TOOL_LINK.
    - question: Is there a free trial? How does pricing work?
      answers:
        - Both the extension and the iPhone, iPad or Mac app include a free trial period. No card required.
        - After the trial, Vocal Remover Online offers weekly, yearly and one-time purchase options, and Vocal Remover Offline offers weekly and yearly subscriptions, as listed above.
        - All payments are handled securely through Paddle for the extension or Apple for the app.
    - question: How do I cancel my subscription?
      answers:
        - Just click the “Manage Subscription” button inside the app or the extension and follow the instructions.
        - This process is fully automatic, so there is no need to call or send emails.
    - question: Who is Vocal Remover for?
      answers:
        - Vocal Remover is made for singers, musicians, producers, DJs, teachers, content creators and anyone who needs to separate voice and music.
        - Whether you are preparing karaoke, teaching, editing dialogue or building remixes, it gives you clean stems fast.
