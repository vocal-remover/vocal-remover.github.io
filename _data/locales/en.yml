offline:
  title: Vocal Remover Offline
  paragraphs:
    - Lightning-fast Vocal Remover removes vocals from songs and separates voice from music in seconds. Batch-process multiple files in one click for clean instrumentals.
    - Drop a single track or a whole folder, and Vocal Remover for iPhone, iPad or Mac will split each song into vocal and instrumental stems. Built for speed, accuracy and offline privacy-friendly processing.
