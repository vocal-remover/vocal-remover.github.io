            - number: 2
              title: Add Edge to the list (only if it's missing)
              paragraphs_html:
                - "If you don't see Edge there:"
              instructions_html:
                - 'Click <span class="font-medium">Add desktop app</span>.'
                - 'At the bottom, in the <span class="font-medium">File name</span> box, <span class="font-medium">paste one of the lines</span> below.'
                - 'Press <span class="font-medium">Enter</span> or click <span class="font-medium">Add</span>.'
              note_html: If the first line shows you an error, try the next one.
              copy_paths:
