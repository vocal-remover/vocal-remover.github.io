overview:
  title: What is Vocal Remover?
  paragraphs:
    - "Vocal Remover lets you remove vocals from a song on any website and separate vocals from music on your computer without complicated audio software. It's built for real-world use: karaoke, remixes, practice, teaching and content creation."
    - "You can:"
  bullets:
    - Remove vocals from a song to get a clean instrumental version.
    - Isolate voice to study phrasing, harmonies and layers.
    - Prepare karaoke tracks, backing tracks and teaching material.
    - Clean up podcasts and videos by removing background music.
  versions_intro: "Vocal Remover comes in two versions:"
  online_link_label: Vocal Remover Online
  online_link_suffix: a browser extension, for websites, and
  offline_link_label: Vocal Remover Offline
  offline_link_suffix: an iPhone, iPad or Mac app, for files.
