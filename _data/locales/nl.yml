use_cases:
  title: Wie gebruikt Stemverwijderaar?
  items:
    - title: Zangers en karaokeliefhebbers
      body: Maak van elk nummer meteen een karaokeversie. Oefen in je eigen toonsoort, bereid setlijsten voor en repeteer zonder te zoeken naar losse instrumentals.
    - title: Producers en dj's
      body: Haal schone instrumentals en vocals uit tracks voor remixes, edits en mashups. Bereid in een paar klikken stems voor je DAW of liveset voor.
    - title: Docenten en leerlingen
      body: Maak uitgeklede tracks voor lessen, gehoortraining en transcriptie. Isoleer vocals om frasering te bestuderen of verwijder ze zodat leerlingen eroverheen kunnen spelen of zingen.
    - title: Podcasters en contentmakers
      body: Verwijder achtergrondmuziek onder spraak, maak intro's en outro's schoner en bereid duidelijke stems voor om te editen en opnieuw te gebruiken.
faq:
  title: Veelgestelde vragen
  items:
    - question: De Vocal Remover-extensie is traag of hapert. Wat kan ik doen?
      answers:
        - Op sommige Windows-computers, vooral laptops, kiest Windows soms de zuinige grafische chip voor je browser in plaats van de snelle. Omdat de Vocal Remover-extensie geluid in realtime verwerkt, kan dat vertraging, haperingen of complete uitval veroorzaken.
      answer_html: 'Je kunt Windows instellen om de krachtige grafische chip voor je browser te gebruiken. We hebben hier een stap-voor-stapgids met screenshots: <a href="/nl/blog/set-high-performance-gpu-for-chrome-edge-on-windows/" class="underline">Kies de krachtige grafische chip voor Chrome &amp; Edge op Windows</a>. Helpt dat niet, dan is je computer of browser mogelijk simpelweg te beperkt voor realtime verwerking. Probeer Vocal Remover dan op een krachtiger systeem als je dat kunt.'
    - question: Wat is het verschil tussen Stemverwijderaar Online en Stemverwijderaar Offline?
      answers:
        - Stemverwijderaar Online is een browserextensie die zang direct verwijdert op websites zoals YouTube en andere audio- of videoplatforms.
        - Stemverwijderaar Offline is een zelfstandige iPhone-, iPad- en Mac-app die volledig offline werkt met je eigen audiobestanden en hele mappen batchgewijs kan verwerken.
    - question: Moet ik audiobestanden uploaden?
      answers:
        - Uploaden is niet nodig.
        - De extensie verwerkt audio direct in je browser terwijl het afspeelt, en de iPhone-, iPad- en Mac-app werkt lokaal met bestanden op je computer, zonder servers ertussen.
    - question: Welke audioformaten ondersteunt Stemverwijderaar Offline?
      answers:
        - Vocal Remover voor iPhone, iPad of Mac werkt met gangbare formaten zoals WAV, AIFF, MP3, FLAC, M4A en meer, zodat je bestanden die je al hebt direct kunt splitsen zonder eerst te converteren. Je kunt ook video's, mappen of regio's uit je DAW slepen; de app haalt het geluid er automatisch uit.
    - question: Heeft het verwijderen van zang invloed op de audiokwaliteit?
      answers:
        - Stemverwijderaar gebruikt AI-scheiding die erop is gericht instrumentals schoon en muzikaal te houden.
        - De offline versie geeft meestal betere kwaliteit omdat die het hele nummer tegelijk ziet en meer rekenruimte heeft.
        - Zeer drukke of ruizige mixen kunnen nog artefacten laten horen, maar bij normale nummers is de scheiding meestal erg goed.
    - question: Kan ik ook de toonsoort van nummers veranderen?
      linked_answers:
        - tool_key: pitch_changer
          template: Ja, gebruik TOOL_LINK om pitch te verschuiven en de toonsoort van nummers online of offline te veranderen. Het werkt heel goed naast Vocal Remover.
    - question: Hoe kan ik het tempo van een nummer veranderen?
      answers: []
      linked_answers:
        - tool_key: bpm_extension
          template: Als je muziek op een website wilt vertragen of versnellen terwijl die al speelt, gebruik dan TOOL_LINK.
    - question: Is er een gratis proefperiode? Hoe werkt de prijs?
      answers:
        - Zowel de extensie als de iPhone-, iPad- en Mac-app hebben een gratis proefperiode waarvoor geen kaart nodig is.
        - Na de proefperiode biedt Stemverwijderaar Online wekelijkse, jaarlijkse en eenmalige aankoopopties, en Stemverwijderaar Offline wekelijkse en jaarlijkse abonnementen, zoals hierboven vermeld.
        - Alle betalingen worden veilig verwerkt via Paddle voor de extensie of Apple voor de app.
    - question: Hoe zeg ik mijn abonnement op?
      answers:
        - Klik op de knop Manage Subscription in de app of extensie en volg daar de instructies.
        - Het proces verloopt volledig automatisch, dus je hoeft niet te bellen of e-mails te sturen.
    - question: Voor wie is Stemverwijderaar bedoeld?
      answers:
        - Stemverwijderaar is gemaakt voor zangers, muzikanten, producers, dj's, docenten, contentmakers en iedereen die stem en muziek van elkaar wil scheiden.
        - Of je nu karaoke voorbereidt, lesgeeft, dialogen opschoont of remixes bouwt, je krijgt snel schone stems.
