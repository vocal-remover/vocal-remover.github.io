offline:
  title: Stemverwijderaar Offline
  paragraphs:
    - Razendsnelle Stemverwijderaar verwijdert in seconden zang uit nummers en splitst stem en muziek. Verwerk meerdere bestanden tegelijk voor schone instrumentals.
    - Sleep één track of een hele map naar binnen en Vocal Remover voor iPhone, iPad of Mac maakt van elk nummer losse vocal- en instrumental-stems. Gemaakt voor snelheid, nauwkeurigheid en prettig offline werken.
  bullets:
    - AI-stemverwijdering voor nauwkeurige scheiding, ook bij volle mixen.
    - Batchmodus om honderden nummers te verwerken terwijl jij verder werkt.
    - Werkt met WAV, AIFF, MP3, FLAC, M4A en meer.
    - Offline verwerking zonder accounts en zonder wachttijd voor uploads.
  perfect_for_label: "Perfect voor:"
