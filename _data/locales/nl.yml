pages:
  gpu_guide:
    meta:
      title: "Kies de krachtige grafische chip voor Chrome & Edge op Windows"
      description: "Als Vocal Remover op Windows traag of instabiel voelt, laat Chrome of Edge dan de krachtige grafische chip gebruiken met deze stap-voor-stapgids."
      og_title: "Kies de krachtige grafische chip voor Chrome & Edge op Windows"
      og_description: "Als Vocal Remover op Windows traag of instabiel voelt, laat Chrome of Edge dan de krachtige grafische chip gebruiken met deze stap-voor-stapgids."
      og_type: article
      og_image: /blog/set-high-performance-gpu-for-chrome-edge-on-windows/graphics-settings-chrome-3.png
    guide:
      extension_link_label: Vocal Remover-extensie
      page_title: Laat Windows de snelle grafische chip gebruiken voor je browser
      intro_html:
        - EXTENSION_LINK voert in realtime zware berekeningen uit en heeft daarom een snelle grafische chip nodig om soepel te werken. Ook al gaat het om audio, moderne browsers gebruiken de grafische chip op de achtergrond om veel rekenwerk te versnellen, en Vocal Remover heeft die kracht ook nodig.
        - Op sommige computers, vooral laptops, kiest Windows voor je browser de zuinige grafische chip. Dat kan vertraging, haperend geluid of complete uitval van de Vocal Remover-extensie veroorzaken. Deze gids laat Windows de krachtige grafische chip voor je browser gebruiken.
      detected_browser_label: Gedetecteerde browser
      unknown_browser_label: Onbekend
      back_home_label: Terug naar de homepagina
      copy_button:
        idle: Kopiëren
        success: Gekopieerd!
      browsers:
        chrome:
          tab_label: Google Chrome
          detected_label: Google Chrome
          tab_accent: blue
          title: Laat Chrome de krachtige grafische chip gebruiken
          steps:
            - number: 1
              title: Open Graphics-instellingen
              paragraphs_html:
                - 'Open de instellingen door <a href="ms-settings:display-advancedgraphics" class="underline">hier te klikken</a>, of ga naar <span class="font-medium">Settings → System → Display → Graphics</span>.'
                - 'Zoek in de lijst naar <span class="font-medium">Google Chrome</span> (mogelijk moet je scrollen). Zie je het al staan, ga dan meteen naar <a href="#step3-chrome" class="underline">stap 3</a>.'
              images:
                - src: graphics-settings.png
                  alt: Scherm Settings → System → Display → Graphics
            - number: 2
              title: Voeg Chrome toe aan de lijst (alleen als het ontbreekt)
              paragraphs_html:
                - "Als je Chrome daar niet ziet:"
              instructions_html:
                - 'Klik op <span class="font-medium">Add desktop app</span>.'
                - 'Plak onderaan in het vak <span class="font-medium">File name</span> een van de onderstaande regels.'
                - 'Druk op <span class="font-medium">Enter</span> of klik op <span class="font-medium">Add</span>.'
              note_html: Geeft de eerste regel een fout, probeer dan de volgende.
              copy_paths:
                - '%LocalAppData%\Google\Chrome\Application\chrome.exe'
                - 'C:\Program Files (x86)\Google\Chrome\Application\chrome.exe'
                - 'C:\Program Files\Google\Chrome\Application\chrome.exe'
              images:
                - src: graphics-settings-2.png
                  alt: Scherm Settings → System → Display → Graphics met gemarkeerde Add desktop app-knop
                - src: file-picker-2.png
                  alt: Bestandskiezer met gemarkeerd veld voor bestandsnaam en knop
            - number: 3
              anchor_id: step3-chrome
              title_html: Kies <em>High Performance</em> voor Chrome
              paragraphs_html:
                - 'Zoek <span class="font-medium">Google Chrome</span> in de lijst (mogelijk moet je scrollen). Klik erop en zet <span class="font-medium whitespace-nowrap">GPU preference</span> op <span class="font-medium whitespace-nowrap">High Performance</span>.'
              images:
                - src: graphics-settings-chrome-3.png
                  alt: Scherm Settings → System → Display → Graphics met Chrome gemarkeerd
            - number: 4
              title: Start de browser opnieuw en zo nodig ook je computer
              paragraphs_html:
                - Sluit Chrome en open het opnieuw. Helpt dat niet, probeer dan je computer opnieuw op te starten.
              images: []
          troubleshooting:
            title: Als je geen verschil ziet
            items:
              - label: Laptop op batterij?
                body_html: Sommige laptops geven op batterij alsnog voorrang aan de zuinige grafische chip. Probeer de stroomadapter aan te sluiten.
              - label: Update grafische drivers
                body_html: via de app van de maker van je grafische chip (NVIDIA / AMD / Intel) of via Windows Update.
              - label: Reset
                body_html: 'Zet Chrome in Graphics-instellingen terug op <em>Let Windows decide</em> en doorloop daarna de stappen opnieuw.'
        edge:
          tab_label: Microsoft Edge
          detected_label: Microsoft Edge
          tab_accent: violet
          title: Laat Edge de krachtige grafische chip gebruiken
          steps:
            - number: 1
              title: Open Graphics-instellingen
              paragraphs_html:
                - 'Open de instellingen door <a href="ms-settings:display-advancedgraphics" class="underline">hier te klikken</a>, of ga naar <span class="font-medium">Settings → System → Display → Graphics</span>.'
                - 'Zoek in de lijst naar <span class="font-medium">Microsoft Edge</span> (mogelijk moet je scrollen). Zie je het al staan, ga dan meteen naar <a href="#step3-edge" class="underline">stap 3</a>.'
              images:
                - src: graphics-settings.png
                  alt: Scherm Settings → System → Display → Graphics
            - number: 2
              title: Voeg Edge toe aan de lijst (alleen als het ontbreekt)
              paragraphs_html:
                - "Als je Edge daar niet ziet:"
              instructions_html:
                - 'Klik op <span class="font-medium">Add desktop app</span>.'
                - 'Plak onderaan in het vak <span class="font-medium">File name</span> een van de onderstaande regels.'
                - 'Druk op <span class="font-medium">Enter</span> of klik op <span class="font-medium">Add</span>.'
              note_html: Geeft de eerste regel een fout, probeer dan de volgende.
              copy_paths:
                - 'C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe'
                - 'C:\Program Files\Microsoft\Edge\Application\msedge.exe'
              images:
                - src: graphics-settings-2.png
                  alt: Scherm Settings → System → Display → Graphics met gemarkeerde Add desktop app-knop
                - src: file-picker-2.png
                  alt: Bestandskiezer met gemarkeerd veld voor bestandsnaam en knop
            - number: 3
              anchor_id: step3-edge
              title_html: Kies <em>High Performance</em> voor Edge
              paragraphs_html:
                - 'Zoek <span class="font-medium">Microsoft Edge</span> in de lijst (mogelijk moet je scrollen). Klik erop en zet <span class="font-medium whitespace-nowrap">GPU preference</span> op <span class="font-medium whitespace-nowrap">High Performance</span>.'
              images:
                - src: graphics-settings-edge-3.png
                  alt: Scherm Settings → System → Display → Graphics met Edge gemarkeerd
            - number: 4
              title: Start de browser opnieuw en zo nodig ook je computer
              paragraphs_html:
                - Sluit Edge en open het opnieuw. Helpt dat niet, probeer dan je computer opnieuw op te starten.
              images: []
          troubleshooting:
            title: Als je geen verschil ziet
            items:
