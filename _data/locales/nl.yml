overview:
  title: Wat is Stemverwijderaar?
  paragraphs:
    - Met Stemverwijderaar kun je op elke website zang uit een nummer halen en op je computer stem en muziek scheiden zonder ingewikkelde audiosoftware. Het is gemaakt voor echte taken zoals karaoke, remixes, oefenen, lesgeven en content maken.
    - "Je kunt:"
  bullets:
    - Zang uit een nummer halen om een schone instrumentale versie te krijgen.
    - Alleen de stem beluisteren om frasering, harmonieën en lagen te bestuderen.
    - Karaoketracks, backingtracks en lesmateriaal voorbereiden.
    - Podcasts en video's opschonen door achtergrondmuziek te verwijderen.
  versions_intro: "Stemverwijderaar is beschikbaar in twee versies:"
  online_link_label: Stemverwijderaar Online
  online_link_suffix: een browserextensie voor websites, en
  offline_link_label: Stemverwijderaar Offline
  offline_link_suffix: een iPhone-, iPad- en Mac-app voor bestanden.
online:
  title: Stemverwijderaar Online
  paragraphs:
    - Gebruik Stemverwijderaar om je track online op te schonen en met AI zang uit een nummer te verwijderen.
    - Met Stemverwijderaar Online voeg je een slimme stemverwijderings-extensie direct toe aan je browser. Verwijder zang uit YouTube-video's en veel andere audiosites in maar een paar klikken.
  bullets:
    - Zang online direct verwijderen op elke website.
    - Werkt als YouTube-zangverwijderaar en ook op andere muziekplatforms.
    - Krijg schone instrumentals zonder bestanden te downloaden of uploaden.
    - AI-stemscheiding voor resultaten met hoge kwaliteit.
    - Handig voor karaoke, covers, remixes en backingtracks.
  perfect_for_label: "Perfect voor:"
  perfect_for_text: karaokeliefhebbers, zangers, zangcoaches, docenten, contentmakers en iedereen die oefent met online video's.
  pricing_template: "Na de gratis proefperiode: WEEKLY_PRICE, YEARLY_PRICE abonnementen of LIFETIME_PRICE."
  offer_templates:
