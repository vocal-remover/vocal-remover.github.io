overview:
  title: Vocal Remover nedir?
  paragraphs:
    - Vocal Remover ile herhangi bir sitede bir şarkıdan vokali kaldırabilir ve bilgisayarınızda vokali müzikten karmaşık ses yazılımlarına gerek kalmadan ayırabilirsiniz. Karaoke, remix, çalışma, öğretim ve içerik üretimi gibi gerçek müzikal ihtiyaçlar için tasarlanmıştır.
    - "Şunları yapabilirsiniz:"
  bullets:
    - Bir şarkıdan vokali kaldırıp temiz bir enstrümantal sürüm elde etmek.
    - Fraseleme, armoni ve katmanları incelemek için vokali izole etmek.
    - Karaoke parçaları, backing track'ler ve ders materyalleri hazırlamak.
    - Arka plan müziğini kaldırarak podcast ve videoları temizlemek.
  versions_intro: "Vocal Remover iki sürümle sunulur:"
  online_link_label: Vocal Remover Online
  online_link_suffix: siteler için bir tarayıcı uzantısıdır, ve
  offline_link_label: Vocal Remover Offline
  offline_link_suffix: dosyalar için bir iPhone, iPad ve Mac uygulamasıdır.
online:
  title: Vocal Remover Online
  paragraphs:
    - Vocal Remover'ı kullanarak parçanızı online temizleyin ve AI destekli ses ayrımıyla bir şarkıdan vokali kaldırın.
    - Vocal Remover Online akıllı aracı doğrudan tarayıcınıza ekler. YouTube videolarından ve diğer birçok ses sitesinden sadece birkaç tıklamayla vokal kaldırın.
  bullets:
    - Herhangi bir sitede doğrudan online vokal kaldırın.
    - YouTube vokal kaldırıcı olarak ve diğer müzik platformlarında çalışır.
    - Dosya indirmeden veya yüklemeden temiz enstrümantaller elde edin.
    - Yüksek kaliteli ayrım için AI vokal ayırma teknolojisi.
    - Karaoke, cover, remix ve backing track hazırlığı için idealdir.
  perfect_for_label: "Şunlar için ideal:"
  perfect_for_text: karaoke sevenler, şarkıcılar, vokal koçları, öğretmenler, içerik üreticileri ve online videolarla çalışan herkes.
  pricing_template: "Ücretsiz denemeden sonra: WEEKLY_PRICE, YEARLY_PRICE veya LIFETIME_PRICE."
  offer_templates:
    weekly: "haftalık US$PRICE_VALUE"
    yearly: "yıllık US$PRICE_VALUE"
    lifetime: "tek seferlik US$PRICE_VALUE ödeme"
  cta: Vocal Remover'ı tarayıcınıza ekleyin
  image_alt: Vocal Remover uzantısını yükleyin ve saniyeler içinde Chrome tarayıcınıza ekleyin.
offline:
  title: Vocal Remover Offline
  paragraphs:
    - Hızlı Vocal Remover, şarkılardan vokali kaldırır ve vokali müzikten saniyeler içinde ayırır. Tek tıklamayla birden fazla dosyayı toplu işleyin ve temiz enstrümantaller elde edin.
    - Tek bir parçayı ya da tüm klasörü bırakın, iPhone, iPad ve Mac için Vocal Remover her şarkıyı vokal ve enstrümantal stem'lere ayırsın. Hız, doğruluk ve rahat bir offline iş akışı için tasarlanmıştır.
  bullets:
    - Yoğun mikslerde bile hassas ayrım için AI vokal kaldırma.
    - Siz çalışmaya devam ederken yüzlerce şarkıyı işleyen toplu mod.
    - WAV, AIFF, MP3, FLAC, M4A ve daha fazlasıyla çalışır.
    - Hesap gerektirmeyen ve yükleme bekletmeyen offline işleme.
  perfect_for_label: "Şunlar için ideal:"
  perfect_for_text: yerel ses dosyalarıyla çalışan prodüktörler, DJ'ler, podcaster'lar, öğretmenler ve müzisyenler.
  pricing_template: "Ücretsiz denemeden sonra: WEEKLY_PRICE veya YEARLY_PRICE."
  offer_templates:
    weekly: "haftalık US$PRICE_VALUE"
    yearly: "yıllık US$PRICE_VALUE"
  cta: Vocal Remover'ı iPhone, iPad veya Mac'inize ekleyin
  image_alt: Hemen indirin ve neden bu kadar çok müzisyenin ihtiyaç duyduğu stem'ler için Vocal Remover'a güvendiğini görün.
use_cases:
  title: Vocal Remover'ı kimler kullanıyor?
  items:
    - title: Şarkıcılar ve karaoke severler
      body: Herhangi bir parçayı anında karaoke sürümüne dönüştürün. Kendi tonunuzda çalışın, repertuvar hazırlayın ve ayrı enstrümantal sürüm aramadan prova yapın.
    - title: Prodüktörler ve DJ'ler
      body: Remix, edit ve mashup için temiz enstrümantal ve vokal çıkarın. DAW'ınız veya canlı setiniz için stem'leri birkaç tıklamayla hazırlayın.
    - title: Öğretmenler ve öğrenciler
      body: Ders, kulak eğitimi ve transkripsiyon için sadeleştirilmiş parçalar oluşturun. Fraselemeyi incelemek için vokali izole edin ya da öğrencilerin üstüne çalabilmesi veya söyleyebilmesi için kaldırın.
    - title: Podcaster'lar ve içerik üreticileri
      body: Konuşma altındaki müziği kaldırın, intro ve outro'ları temizleyin ve düzenleme ile yeniden kullanım için net stem'ler hazırlayın.
faq:
  title: Sık sorulan sorular
  items:
    - question: Vocal Remover uzantısı yavaş veya takılıyor. Ne yapabilirim?
      answers:
        - Bazı Windows bilgisayarlarda, özellikle dizüstülerde, Windows tarayıcınız için hızlı olan yerine güç tasarruflu grafik çipini seçebilir. Vocal Remover uzantısı sesi gerçek zamanlı işlediği için bu durum yavaşlamaya, takılan sese veya hiç çalışmamasına neden olabilir.
      answer_html: 'Windows''a tarayıcınız için yüksek performanslı grafik çipini kullanmasını söyleyebilirsiniz. Burada ekran görüntülü adım adım bir rehberimiz var: <a href="/tr/blog/set-high-performance-gpu-for-chrome-edge-on-windows/" class="underline">Windows''ta Chrome ve Edge için yüksek performanslı grafik çipini seçin</a>. Bu da işe yaramazsa bilgisayarınız veya tarayıcınız gerçek zamanlı işleme için fazla sınırlı olabilir. Böyle bir durumda imkanınız varsa Vocal Remover''ı daha güçlü bir sistemde deneyin.'
    - question: Vocal Remover Online ile Vocal Remover Offline arasındaki fark nedir?
      answers:
        - Vocal Remover Online, YouTube gibi sitelerde ve diğer ses ya da video platformlarında vokali doğrudan kaldıran bir tarayıcı uzantısıdır.
        - Vocal Remover Offline, kendi ses dosyalarınızla tamamen offline çalışan ve tüm klasörleri toplu işleyebilen bağımsız bir iPhone, iPad ve Mac uygulamasıdır.
    - question: Ses dosyalarını yüklemem gerekir mi?
      answers:
        - Hayır, dosya yüklemeniz gerekmez.
        - Uzantı sesi çalarken doğrudan tarayıcıda işler; iPhone, iPad ve Mac uygulaması ise dosyalarınızla yerel olarak çalışır ve hiçbir sunucu kullanmaz.
    - question: Vocal Remover Offline hangi ses formatlarını destekler?
      answers:
        - iPhone, iPad ve Mac için Vocal Remover; WAV, AIFF, MP3, FLAC, M4A ve diğer yaygın formatlarla çalışır, böylece elinizdeki dosyaları dönüştürmeden ayırabilirsiniz. Videoları, klasörleri veya DAW bölgelerini de bırakabilirsiniz; uygulama sesi otomatik olarak çıkarır.
    - question: Vokal kaldırmak ses kalitesini etkiler mi?
      answers:
        - Vocal Remover, enstrümantalleri temiz ve müzikal tutmak için tasarlanmış AI ayrımı kullanır.
        - Offline sürüm çoğu zaman daha iyi kalite sunar çünkü işlem sırasında şarkının tamamını görür ve daha fazla kaynağa sahiptir.
        - Çok karmaşık veya gürültülü mikslerde artefaktlar oluşabilir, ancak tipik şarkılar genelde oldukça iyi ayrılır.
    - question: Şarkıların tonunu da değiştirebilir miyim?
      linked_answers:
        - tool_key: pitch_changer
          template: Evet, online veya offline şarkıların pitch'ini kaydırmak ve tonunu değiştirmek için TOOL_LINK kullanın. Vocal Remover ile çok iyi çalışır.
    - question: Bir şarkının temposunu nasıl değiştirebilirim?
      answers: []
      linked_answers:
        - tool_key: bpm_extension
          template: Bir sitede zaten çalan müziği yavaşlatmak ya da hızlandırmak istiyorsanız TOOL_LINK kullanın.
        - tool_key: speed_tool
          template: Kendi dosyanızın temposunu değiştirip pitch'i sabit tutmak istiyorsanız TOOL_LINK kullanın.
    - question: Ücretsiz deneme var mı? Fiyatlandırma nasıl çalışıyor?
      answers:
        - Hem uzantı hem de iPhone, iPad ve Mac uygulaması kart gerektirmeyen ücretsiz deneme süresi içerir.
        - Denemeden sonra Vocal Remover Online haftalık, yıllık ve tek seferlik satın alma seçenekleri sunar; Vocal Remover Offline ise haftalık ve yıllık abonelikler sunar.
        - Tüm ödemeler uzantı için Paddle, uygulama için Apple üzerinden güvenli şekilde işlenir.
    - question: Aboneliğimi nasıl iptal ederim?
      answers:
        - Uygulama veya uzantı içindeki Manage Subscription düğmesine tıklayın ve oradaki adımları izleyin.
        - Süreç tamamen otomatiktir, bu yüzden aramanız ya da e-posta göndermeniz gerekmez.
    - question: Vocal Remover kimler için yapıldı?
      answers:
        - Vocal Remover; şarkıcılar, müzisyenler, prodüktörler, DJ'ler, öğretmenler, içerik üreticileri ve vokali müzikten ayırması gereken herkes için yapılmıştır.
        - İster karaoke hazırlayın, ister ders verin, ister diyaloğu temizleyin ya da remix yapın; size temiz stem'leri hızlıca sunar.
