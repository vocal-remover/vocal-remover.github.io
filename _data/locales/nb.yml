overview:
  title: Hva er Vocal Remover?
  paragraphs:
    - Med Vocal Remover kan du fjerne vokal fra en sang på hvilken som helst nettside og skille stemme fra musikk på datamaskinen uten komplisert lydprogramvare. Det er laget for reelle behov som karaoke, remikser, øving, undervisning og innholdsproduksjon.
    - "Du kan:"
  bullets:
    - Fjerne vokal fra en sang for å få en ren instrumentalversjon.
    - Isolere stemmen for å studere frasering, harmonier og lag.
    - Forberede karaokespor, backing tracks og undervisningsmateriell.
    - Rydde opp i podkaster og videoer ved å fjerne bakgrunnsmusikk.
  versions_intro: "Vocal Remover finnes i to versjoner:"
  online_link_label: Vocal Remover Online
  online_link_suffix: en nettleserutvidelse for nettsider, og
  offline_link_label: Vocal Remover Offline
  offline_link_suffix: en iPhone-, iPad- og Mac-app for filer.
online:
  title: Vocal Remover Online
  paragraphs:
    - Bruk Vocal Remover til å rydde opp i sporet ditt på nett og fjerne vokal fra en sang med AI-basert stemmeseparasjon.
    - Med Vocal Remover Online legger du til en smart utvidelse direkte i nettleseren. Fjern vokal fra YouTube-videoer og mange andre lydnettsider med bare noen få klikk.
  bullets:
    - Fjern vokal på nett direkte på hvilken som helst nettside.
    - Fungerer som YouTube-vokalfjerner og på andre musikkplattformer.
    - Få rene instrumentaler uten å laste ned eller laste opp filer.
    - AI-teknologi for høykvalitets separasjon.
    - Perfekt til karaoke, coverlåter, remikser og backing tracks.
  perfect_for_label: "Perfekt for:"
  perfect_for_text: karaokeelskere, sangere, vokalpedagoger, lærere, innholdsskapere og alle som øver med videoer på nett.
  pricing_template: "Etter gratisperioden: WEEKLY_PRICE, YEARLY_PRICE abonnementer eller LIFETIME_PRICE."
  offer_templates:
    weekly: "US$PRICE_VALUE per uke"
    yearly: "US$PRICE_VALUE per år"
    lifetime: "engangsbetaling på US$PRICE_VALUE"
  cta: Legg til Vocal Remover i nettleseren
  image_alt: Installer Vocal Remover-utvidelsen og legg den til i Chrome på noen sekunder.
offline:
  title: Vocal Remover Offline
  paragraphs:
    - Lynrask Vocal Remover fjerner vokal fra sanger og skiller stemme fra musikk på sekunder. Batchbehandle flere filer med ett klikk og få rene instrumentaler.
    - Slipp inn ett spor eller en hel mappe, så deler Vocal Remover for iPhone, iPad og Mac hver sang i vokal- og instrumentalstems. Bygget for fart, presisjon og et smidig offline arbeidsflyt.
  bullets:
    - AI-vokalfjerning for presis separasjon, selv i tette mikser.
    - Batchmodus for å behandle hundrevis av sanger mens du jobber videre.
    - Fungerer med WAV, AIFF, MP3, FLAC, M4A og flere formater.
    - Offlinebehandling uten kontoer og uten ventetid på opplastinger.
  perfect_for_label: "Perfekt for:"
  perfect_for_text: produsenter, DJ-er, podkastere, lærere og musikere som arbeider med lokale lydfiler.
  pricing_template: "Etter gratisperioden: WEEKLY_PRICE eller YEARLY_PRICE abonnementer."
  offer_templates:
