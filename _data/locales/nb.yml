    yearly: "US$PRICE_VALUE per år"
  cta: Legg til Vocal Remover på iPhone, iPad eller Mac
  image_alt: Last ned i dag og se hvorfor så mange musikere bruker Vocal Remover for å få fram riktige stems raskt.
use_cases:
  title: Hvem bruker Vocal Remover?
  items:
    - title: Sangere og karaokeelskere
      body: Gjør hvilken som helst låt om til en karaokeversjon med én gang. Øv i din egen toneart, sett opp settlister og repeter uten å lete etter separate instrumentaler.
    - title: Produsenter og DJ-er
      body: Trekk ut rene instrumentaler og vokaler til remikser, edits og mashups. Klargjør stems til DAW eller livesett med bare noen få klikk.
    - title: Lærere og elever
      body: Lag nedstrippede spor til undervisning, gehørtrening og transkripsjon. Isoler vokalen for å studere frasering, eller fjern den så elevene kan synge eller spille over.
    - title: Podkastere og innholdsskapere
      body: Fjern bakgrunnsmusikk under tale, rydd opp i intro og outro og klargjør tydelige stems for redigering og gjenbruk.
faq:
  title: Ofte stilte spørsmål
  items:
    - question: Vocal Remover-utvidelsen er treg eller hakker. Hva kan jeg gjøre?
      answers:
        - På noen Windows-maskiner, spesielt bærbare, kan Windows velge det strømsparende grafikkortet for nettleseren i stedet for det raske. Siden Vocal Remover-utvidelsen behandler lyd i sanntid, kan det føre til treghet, hakking eller at den ikke fungerer i det hele tatt.
      answer_html: 'Du kan be Windows bruke det høyytelses grafikkortet for nettleseren. Vi har en steg-for-steg-guide med skjermbilder her: <a href="/nb/blog/set-high-performance-gpu-for-chrome-edge-on-windows/" class="underline">Velg det høyytelses grafikkortet for Chrome &amp; Edge på Windows</a>. Hvis det fortsatt ikke hjelper, kan datamaskinen eller nettleseren være for begrenset for sanntidsbehandling. Prøv i så fall Vocal Remover på et kraftigere system hvis du har tilgang til det.'
    - question: Hva er forskjellen mellom Vocal Remover Online og Vocal Remover Offline?
      answers:
        - Vocal Remover Online er en nettleserutvidelse som fjerner vokal direkte på nettsider som YouTube og andre lyd- eller videoplattformer.
        - Vocal Remover Offline er en frittstående app for iPhone, iPad og Mac som fungerer helt offline med dine egne lydfiler og kan batchbehandle hele mapper.
    - question: Må jeg laste opp lydfiler?
      answers:
        - Nei, ingen opplasting er nødvendig.
        - Utvidelsen behandler lyd direkte i nettleseren mens den spiller, og appen for iPhone, iPad og Mac arbeider lokalt med filene dine uten at noen servere er involvert.
    - question: Hvilke lydformater støtter Vocal Remover Offline?
      answers:
        - Vocal Remover for iPhone, iPad og Mac fungerer med vanlige formater som WAV, AIFF, MP3, FLAC, M4A og flere, så du kan splitte filer du allerede har uten å konvertere dem først. Du kan også slippe inn videoer, mapper eller regioner fra DAW-en din, så trekker appen ut lyden automatisk.
    - question: Påvirker det lydkvaliteten å fjerne vokal?
      answers:
        - Vocal Remover bruker AI-separasjon som er laget for å holde instrumentalene rene og musikalske.
        - Offlineversjonen gir som regel bedre kvalitet fordi den ser hele sangen under behandlingen og har mer regnekraft tilgjengelig.
        - Svært kompliserte eller støyende mikser kan fortsatt gi artefakter, men vanlige sanger separeres som oftest veldig bra.
    - question: Kan jeg også endre tonearten på sanger?
      linked_answers:
        - tool_key: pitch_changer
          template: Ja, bruk TOOL_LINK for å flytte pitch og endre toneart på sanger online eller offline. Det fungerer veldig godt sammen med Vocal Remover.
    - question: Hvordan kan jeg endre tempoet på en sang?
      answers: []
      linked_answers:
        - tool_key: bpm_extension
          template: Hvis du vil gjøre musikk på en nettside langsommere eller raskere mens den allerede spiller, bruk TOOL_LINK.
        - tool_key: speed_tool
          template: Hvis du vil endre tempoet på din egen fil og beholde pitch, bruk TOOL_LINK.
    - question: Finnes det en gratis prøveperiode? Hvordan fungerer prisene?
      answers:
        - Både utvidelsen og appen for iPhone, iPad og Mac har en gratis prøveperiode uten kort.
        - Etter prøveperioden tilbyr Vocal Remover Online ukentlige, årlige og engangskjøp, mens Vocal Remover Offline tilbyr ukentlige og årlige abonnementer, som vist over.
        - Alle betalinger håndteres trygt via Paddle for utvidelsen eller Apple for appen.
    - question: Hvordan sier jeg opp abonnementet mitt?
      answers:
        - Klikk på knappen Manage Subscription i appen eller utvidelsen og følg stegene der.
        - Prosessen er helt automatisk, så du trenger ikke å ringe eller sende e-post.
    - question: Hvem er Vocal Remover laget for?
      answers:
        - Vocal Remover er laget for sangere, musikere, produsenter, DJ-er, lærere, innholdsskapere og alle som trenger å skille stemme og musikk.
        - Enten du forbereder karaoke, underviser, rydder dialog eller bygger remikser, får du raskt fram rene stems.
