pages:
  gpu_guide:
    meta:
      title: "Velg det høyytelses grafikkortet for Chrome & Edge på Windows"
      description: "Hvis Vocal Remover føles treg eller ustabil på Windows, kan du la Chrome eller Edge bruke det høyytelses grafikkortet med denne steg-for-steg-guiden."
      og_title: "Velg det høyytelses grafikkortet for Chrome & Edge på Windows"
      og_description: "Hvis Vocal Remover føles treg eller ustabil på Windows, kan du la Chrome eller Edge bruke det høyytelses grafikkortet med denne steg-for-steg-guiden."
      og_type: article
      og_image: /blog/set-high-performance-gpu-for-chrome-edge-on-windows/graphics-settings-chrome-3.png
    guide:
      extension_link_label: Vocal Remover-utvidelsen
      page_title: Få Windows til å bruke det raske grafikkortet for nettleseren
      intro_html:
        - EXTENSION_LINK gjør tunge beregninger i sanntid og trenger derfor et raskt grafikkort for å fungere jevnt. Selv om dette handler om lyd, bruker moderne nettlesere grafikkortet i bakgrunnen for å gjøre tungt regnearbeid raskere, og Vocal Remover trenger også den ytelsen.
        - På noen datamaskiner, særlig bærbare, kan Windows velge det strømsparende grafikkortet for nettleseren. Det kan føre til treghet, hakkete lyd eller at Vocal Remover-utvidelsen slutter å fungere helt. Denne guiden får Windows til å bruke det høyytelses grafikkortet for nettleseren.
      detected_browser_label: Oppdaget nettleser
      unknown_browser_label: Ukjent
      back_home_label: Tilbake til startsiden
      copy_button:
        idle: Kopier
        success: Kopiert!
      browsers:
        chrome:
          tab_label: Google Chrome
          detected_label: Google Chrome
          tab_accent: blue
          title: La Chrome bruke det høyytelses grafikkortet
          steps:
            - number: 1
              title: Åpne Graphics-innstillinger
              paragraphs_html:
                - 'Åpne innstillingene ved å <a href="ms-settings:display-advancedgraphics" class="underline">klikke her</a>, eller gå til <span class="font-medium">Settings → System → Display → Graphics</span>.'
                - 'Se etter <span class="font-medium">Google Chrome</span> i listen (du må kanskje scrolle). Hvis du ser den, kan du gå rett til <a href="#step3-chrome" class="underline">trinn 3</a>.'
              images:
                - src: graphics-settings.png
                  alt: Skjermen Settings → System → Display → Graphics
            - number: 2
              title: Legg til Chrome i listen (bare hvis den mangler)
              paragraphs_html:
                - "Hvis du ikke ser Chrome der:"
              instructions_html:
                - 'Klikk på <span class="font-medium">Add desktop app</span>.'
                - 'Lim inn en av linjene nedenfor i feltet <span class="font-medium">File name</span> nederst.'
                - 'Trykk <span class="font-medium">Enter</span> eller klikk <span class="font-medium">Add</span>.'
              note_html: Hvis første linje gir en feil, prøv den neste.
              copy_paths:
                - '%LocalAppData%\Google\Chrome\Application\chrome.exe'
                - 'C:\Program Files (x86)\Google\Chrome\Application\chrome.exe'
                - 'C:\Program Files\Google\Chrome\Application\chrome.exe'
              images:
                - src: graphics-settings-2.png
                  alt: Skjermen Settings → System → Display → Graphics med uthevet Add desktop app-knapp
                - src: file-picker-2.png
                  alt: Filvelger med uthevet filnavnfelt og knapp
            - number: 3
              anchor_id: step3-chrome
              title_html: Velg <em>High Performance</em> for Chrome
              paragraphs_html:
                - 'Finn <span class="font-medium">Google Chrome</span> i listen (du må kanskje scrolle). Klikk på den og sett <span class="font-medium whitespace-nowrap">GPU preference</span> til <span class="font-medium whitespace-nowrap">High Performance</span>.'
              images:
                - src: graphics-settings-chrome-3.png
                  alt: Skjermen Settings → System → Display → Graphics med Chrome uthevet
            - number: 4
              title: Start nettleseren på nytt, og om nødvendig også datamaskinen
              paragraphs_html:
                - Lukk Chrome og åpne den igjen. Hvis det ikke hjelper, prøv å starte datamaskinen på nytt.
              images: []
          troubleshooting:
            title: Hvis du ikke merker noen forskjell
            items:
              - label: Bærbar på batteri?
                body_html: Noen bærbare maskiner prioriterer fortsatt det strømsparende grafikkortet på batteri. Prøv å koble til laderen.
              - label: Oppdater grafikkdrivere
                body_html: via appen fra produsenten av grafikkortet (NVIDIA / AMD / Intel) eller gjennom Windows Update.
              - label: Tilbakestill
                body_html: 'Sett Chrome tilbake til <em>Let Windows decide</em> i Graphics-innstillinger, og gjør deretter stegene på nytt.'
        edge:
          tab_label: Microsoft Edge
          detected_label: Microsoft Edge
          tab_accent: violet
          title: La Edge bruke det høyytelses grafikkortet
          steps:
