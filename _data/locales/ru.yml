  image_alt: Установите расширение Vocal Remover и добавьте его в Chrome за несколько секунд.
offline:
  title: Vocal Remover Offline
  paragraphs:
    - Vocal Remover быстро разделяет голос и музыку в песнях и помогает за секунды готовить чистые инструменталы. Можно обрабатывать сразу несколько файлов и не выбиваться из рабочего ритма.
    - Добавьте один трек или целую папку, и Vocal Remover для iPhone, iPad или Mac разложит каждый файл на вокальный и инструментальный стем. Это удобно для репетиций, ремиксов, преподавания и каталогов с большими пачками музыки.
  bullets:
    - AI-разделение для аккуратной работы даже с плотными аранжировками.
    - Пакетный режим для обработки десятков и сотен треков подряд.
    - Поддержка WAV, AIFF, MP3, FLAC, M4A и других популярных форматов.
    - Удобный офлайн-режим для работы со своей музыкальной библиотекой.
  perfect_for_label: "Отлично подходит для:"
  perfect_for_text: продюсеров, диджеев, подкастеров, преподавателей и музыкантов, которые работают с локальными аудиофайлами.
  pricing_template: "После бесплатного пробного периода: WEEKLY_PRICE или YEARLY_PRICE."
  offer_templates:
    weekly: "$PRICE_VALUE в неделю"
    yearly: "$PRICE_VALUE в год"
