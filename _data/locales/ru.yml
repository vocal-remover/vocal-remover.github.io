overview:
  title: Что такое Vocal Remover?
  paragraphs:
    - Vocal Remover помогает убирать вокал из песни на любом сайте и отделять голос от музыки в файлах без сложных аудиоредакторов. Он создан для реальных музыкальных задач: караоке, ремиксов, репетиций, занятий и контент-продакшена.
    - "С его помощью можно:"
  bullets:
    - Убирать вокал из песни и получать чистый инструментал.
    - Изолировать голос, чтобы разбирать фразировку, гармонии и слои.
    - Готовить караоке-версии, минусовки и материалы для занятий.
    - Убирать фоновую музыку из подкастов и видео, когда нужен более чистый голос.
  versions_intro: "Vocal Remover доступен в двух версиях:"
  online_link_label: Vocal Remover Online
  online_link_suffix: расширение для сайтов, и
  offline_link_label: Vocal Remover Offline
  offline_link_suffix: приложение для iPhone, iPad и Mac для работы с файлами.
online:
  title: Vocal Remover Online
  paragraphs:
    - Используйте Vocal Remover, чтобы быстро убрать вокал из песни онлайн и получить чистый инструментал. Это удобный AI-инструмент, который помогает разделять голос и музыку прямо во время прослушивания.
    - Vocal Remover Online добавляется прямо в браузер. Убирайте вокал из видео на YouTube и на других аудио- и видеосайтах всего за несколько кликов.
  bullets:
    - Убирайте вокал из песни онлайн прямо на любом сайте.
    - Работает как расширение для удаления вокала на YouTube и на других музыкальных платформах.
    - Помогает быстро получать чистые инструменталы без лишней подготовки.
    - AI-разделение голоса и музыки для аккуратного результата.
    - Отлично подходит для караоке, каверов, ремиксов и фонограмм.
  perfect_for_label: "Отлично подходит для:"
  perfect_for_text: любителей караоке, певцов, вокальных педагогов, преподавателей, контент-мейкеров и всех, кто занимается под онлайн-видео.
  pricing_template: "После бесплатного пробного периода: WEEKLY_PRICE, YEARLY_PRICE или LIFETIME_PRICE."
  offer_templates:
    weekly: "$PRICE_VALUE в неделю"
