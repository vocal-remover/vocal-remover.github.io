use_cases:
  title: Кто использует Vocal Remover?
  items:
    - title: Певцы и любители караоке
      body: Быстро превращайте любой трек в караоке-версию. Репетируйте в удобной тональности, собирайте сет-листы и готовьтесь к выступлениям без долгих поисков минусовок.
    - title: Продюсеры и диджеи
      body: Доставайте чистые инструменталы и вокалы для ремиксов, эдитов и мэшапов. Готовьте стемы для DAW и лайв-сетов за несколько кликов.
    - title: Преподаватели и учащиеся
      body: Делайте облегчённые версии треков для уроков, тренировки слуха и расшифровки. Можно отдельно послушать голос или убрать его, чтобы ученик пел поверх.
    - title: Подкастеры и контент-мейкеры
      body: Убирайте музыку под речью, очищайте заставки и аутро, а затем готовьте понятные стемы для монтажа и переработки материала.
faq:
  title: Часто задаваемые вопросы
  items:
    - question: Расширение Vocal Remover тормозит или работает с перебоями. Что делать?
      answers:
        - На некоторых компьютерах с Windows, особенно на ноутбуках, браузер может запускаться на энергосберегающем графическом процессоре вместо более быстрого. Так как расширение Vocal Remover обрабатывает звук в реальном времени, из-за этого появляются торможения, заикания или расширение вообще перестаёт нормально работать.
      answer_html: 'Можно назначить браузеру высокопроизводительный графический процессор. Вот пошаговая инструкция со скриншотами: <a href="/ru/blog/выбрать-высокопроизводительный-графический-процессор-для-chrome-edge-на-windows/" class="underline">как выбрать быстрый графический процессор для Chrome и Edge в Windows</a>. Если после этого лучше не стало, значит мощности компьютера или браузера может просто не хватать для такой обработки в реальном времени. Если есть возможность, попробуйте более производительную систему.'
    - question: В чем разница между Vocal Remover Online и Vocal Remover Offline?
      answers:
        - Vocal Remover Online — это расширение для браузера, которое убирает вокал прямо на сайтах вроде YouTube и других аудио- или видеоплатформ.
        - Vocal Remover Offline — отдельное приложение для iPhone, iPad и Mac. Оно работает с вашими файлами и умеет пакетно обрабатывать целые папки.
    - question: Нужно ли загружать аудиофайлы?
      answers:
        - Нет, загрузка не нужна.
        - Расширение обрабатывает звук прямо во время воспроизведения в браузере, а приложение для iPhone, iPad и Mac работает с вашими файлами на устройстве.
    - question: Какие аудиоформаты поддерживает Vocal Remover Offline?
      answers:
        - Vocal Remover для iPhone, iPad и Mac работает с популярными форматами вроде WAV, AIFF, MP3, FLAC, M4A и другими, поэтому можно сразу разбирать уже готовые файлы без предварительной конвертации. Также можно добавлять видео, папки и регионы из DAW, а приложение само извлечёт звук.
    - question: Повлияет ли удаление вокала на качество звука?
      answers:
        - Vocal Remover использует AI-разделение, которое старается сохранять инструментал чистым и музыкальным.
        - Офлайн-версия обычно даёт более точный результат, потому что видит трек целиком и может обработать его глубже.
        - В очень сложных или шумных миксах артефакты возможны, но в большинстве обычных песен разделение звучит аккуратно.
    - question: Можно ли ещё и менять тональность песен?
      linked_answers:
        - tool_key: pitch_changer
          template: Да, используйте TOOL_LINK, чтобы менять высоту и тональность песен онлайн или офлайн. Он отлично дополняет Vocal Remover.
    - question: Как изменить темп песни?
      answers: []
      linked_answers:
        - tool_key: bpm_extension
          template: Если нужно замедлить или ускорить музыку прямо на сайте, пока трек уже играет, используйте TOOL_LINK.
        - tool_key: speed_tool
          template: Если нужно изменить темп собственного файла и сохранить прежнюю тональность, используйте TOOL_LINK.
    - question: Есть ли бесплатный пробный период? Как устроена оплата?
      answers:
        - И расширение, и приложение для iPhone, iPad и Mac предлагают бесплатный пробный период без привязки карты.
        - После пробного периода Vocal Remover Online предлагает недельную, годовую и разовую покупку, а Vocal Remover Offline — недельную и годовую подписку, как указано выше.
        - Все платежи безопасно обрабатываются через Paddle для расширения или через Apple для приложения.
    - question: Как отменить подписку?
      answers:
        - Нажмите кнопку Manage Subscription внутри приложения или расширения и следуйте подсказкам.
        - Процесс полностью автоматический, поэтому не нужно звонить или писать письма.
    - question: Для кого создан Vocal Remover?
      answers:
        - Vocal Remover создан для певцов, музыкантов, продюсеров, диджеев, преподавателей, контент-мейкеров и всех, кому нужно отделять голос от музыки.
        - Если вы готовите караоке, учебные материалы, диалоги для монтажа или ремиксы, он помогает быстро получить нужные стемы.
