pages:
  gpu_guide:
    meta:
      title: "Vælg den højtydende grafikchip til Chrome & Edge på Windows"
      description: "Hvis Vocal Remover føles langsom eller ustabil på Windows, kan du lade Chrome eller Edge bruge den højtydende grafikchip med denne trin-for-trin-guide."
      og_title: "Vælg den højtydende grafikchip til Chrome & Edge på Windows"
      og_description: "Hvis Vocal Remover føles langsom eller ustabil på Windows, kan du lade Chrome eller Edge bruge den højtydende grafikchip med denne trin-for-trin-guide."
      og_type: article
      og_image: /blog/set-high-performance-gpu-for-chrome-edge-on-windows/graphics-settings-chrome-3.png
    guide:
      extension_link_label: Vocal Remover-udvidelsen
      page_title: Få Windows til at bruge den hurtige grafikchip til din browser
      intro_html:
        - EXTENSION_LINK udfører tunge beregninger i realtid og har derfor brug for en hurtig grafikchip for at fungere glat. Selvom det handler om lyd, bruger moderne browsere grafikchippen i baggrunden til at gøre tungt regnearbejde hurtigere, og Vocal Remover har også brug for den ydelse.
        - På nogle computere, især bærbare, kan Windows vælge den strømbesparende grafikchip til din browser. Det kan give forsinkelser, hakkende lyd eller få Vocal Remover-udvidelsen til at stoppe med at virke helt. Denne guide får Windows til at bruge den højtydende grafikchip til browseren.
      detected_browser_label: Registreret browser
      unknown_browser_label: Ukendt
      back_home_label: Tilbage til startsiden
      copy_button:
        idle: Kopiér
        success: Kopieret!
      browsers:
        chrome:
          tab_label: Google Chrome
          detected_label: Google Chrome
          tab_accent: blue
          title: Lad Chrome bruge den højtydende grafikchip
          steps:
            - number: 1
              title: Åbn Graphics-indstillinger
              paragraphs_html:
                - 'Åbn indstillingerne ved at <a href="ms-settings:display-advancedgraphics" class="underline">klikke her</a>, eller gå til <span class="font-medium">Settings → System → Display → Graphics</span>.'
                - 'Se efter <span class="font-medium">Google Chrome</span> i listen (du skal måske scrolle). Hvis du ser den, så gå direkte til <a href="#step3-chrome" class="underline">trin 3</a>.'
              images:
                - src: graphics-settings.png
                  alt: Skærmen Settings → System → Display → Graphics
            - number: 2
              title: Tilføj Chrome til listen (kun hvis den mangler)
              paragraphs_html:
                - "Hvis du ikke ser Chrome der:"
              instructions_html:
                - 'Klik på <span class="font-medium">Add desktop app</span>.'
                - 'Indsæt en af linjerne nedenfor i feltet <span class="font-medium">File name</span> nederst.'
                - 'Tryk på <span class="font-medium">Enter</span> eller klik på <span class="font-medium">Add</span>.'
              note_html: Hvis første linje giver en fejl, så prøv den næste.
              copy_paths:
                - '%LocalAppData%\Google\Chrome\Application\chrome.exe'
                - 'C:\Program Files (x86)\Google\Chrome\Application\chrome.exe'
                - 'C:\Program Files\Google\Chrome\Application\chrome.exe'
              images:
                - src: graphics-settings-2.png
                  alt: Skærmen Settings → System → Display → Graphics med markeret Add desktop app-knap
                - src: file-picker-2.png
                  alt: Filvælger med markeret filnavnsfelt og knap
            - number: 3
              anchor_id: step3-chrome
              title_html: Vælg <em>High Performance</em> til Chrome
              paragraphs_html:
                - 'Find <span class="font-medium">Google Chrome</span> i listen (du skal måske scrolle). Klik på den og sæt <span class="font-medium whitespace-nowrap">GPU preference</span> til <span class="font-medium whitespace-nowrap">High Performance</span>.'
              images:
                - src: graphics-settings-chrome-3.png
                  alt: Skærmen Settings → System → Display → Graphics med Chrome fremhævet
            - number: 4
              title: Genstart browseren og om nødvendigt også computeren
              paragraphs_html:
                - Luk Chrome og åbn den igen. Hjælper det ikke, så prøv at genstarte computeren.
              images: []
          troubleshooting:
            title: Hvis du ikke mærker nogen forskel
            items:
              - label: Bærbar på batteri?
                body_html: Nogle bærbare prioriterer stadig den strømbesparende grafikchip på batteri. Prøv at tilslutte strøm.
              - label: Opdatér grafikdrivere
                body_html: via appen fra producenten af din grafikchip (NVIDIA / AMD / Intel) eller gennem Windows Update.
              - label: Nulstil
                body_html: 'Sæt Chrome tilbage til <em>Let Windows decide</em> i Graphics-indstillinger, og gennemgå derefter trinene igen.'
        edge:
          tab_label: Microsoft Edge
          detected_label: Microsoft Edge
          tab_accent: violet
          title: Lad Edge bruge den højtydende grafikchip
          steps:
