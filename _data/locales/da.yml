overview:
  title: Hvad er Vocal Remover?
  paragraphs:
    - Med Vocal Remover kan du fjerne vokal fra en sang på enhver hjemmeside og skille stemme fra musik på computeren uden kompliceret lydsoftware. Den er lavet til virkelige behov som karaoke, remixes, øvning, undervisning og indholdsproduktion.
    - "Du kan:"
  bullets:
    - Fjerne vokal fra en sang og få en ren instrumental version.
    - Isolere stemmen for at studere frasering, harmonier og lag.
    - Forberede karaokespor, backing tracks og undervisningsmateriale.
    - Rydde op i podcasts og videoer ved at fjerne baggrundsmusik.
  versions_intro: "Vocal Remover findes i to versioner:"
  online_link_label: Vocal Remover Online
  online_link_suffix: en browserudvidelse til hjemmesider, og
  offline_link_label: Vocal Remover Offline
  offline_link_suffix: en iPhone-, iPad- og Mac-app til filer.
online:
  title: Vocal Remover Online
  paragraphs:
    - Brug Vocal Remover til at rydde dit spor op online og fjerne vokal fra en sang med AI-baseret stemmeseparation.
    - Med Vocal Remover Online lægger du en smart udvidelse direkte ind i browseren. Fjern vokal fra YouTube-videoer og mange andre lydhjemmesider med få klik.
  bullets:
    - Fjern vokal online direkte på enhver hjemmeside.
    - Fungerer som YouTube-vokalfjerner og også på andre musikplatforme.
    - Få rene instrumentaler uden at downloade eller uploade filer.
    - AI-teknologi til vokalseparation i høj kvalitet.
    - Perfekt til karaoke, covers, remixes og backing tracks.
  perfect_for_label: "Perfekt til:"
  perfect_for_text: karaokeelskere, sangere, vokalcoaches, lærere, indholdsskabere og alle der øver med videoer online.
  pricing_template: "Efter gratisperioden: WEEKLY_PRICE, YEARLY_PRICE abonnementer eller LIFETIME_PRICE."
  offer_templates:
    weekly: "US$PRICE_VALUE pr. uge"
    yearly: "US$PRICE_VALUE pr. år"
    lifetime: "engangsbetaling på US$PRICE_VALUE"
  cta: Tilføj Vocal Remover til din browser
  image_alt: Installer Vocal Remover-udvidelsen og tilføj den til Chrome på få sekunder.
offline:
  title: Vocal Remover Offline
  paragraphs:
    - Hurtige Vocal Remover fjerner vokal fra sange og skiller stemme fra musik på få sekunder. Batchbehandl flere filer med ét klik og få rene instrumentaler.
    - Slip ét spor eller en hel mappe ind, så deler Vocal Remover til iPhone, iPad og Mac hver sang i vokal- og instrumentalstems. Bygget til fart, præcision og et smidigt offline workflow.
  bullets:
    - AI-vokalfjerning til præcis separation, også i tætte mix.
    - Batchtilstand til at behandle hundredvis af sange mens du arbejder videre.
    - Fungerer med WAV, AIFF, MP3, FLAC, M4A og flere formater.
    - Offlinebehandling uden konti og uden ventetid på upload.
  perfect_for_label: "Perfekt til:"
  perfect_for_text: producere, DJ's, podcastere, lærere og musikere der arbejder med lokale lydfiler.
  pricing_template: "Efter gratisperioden: WEEKLY_PRICE eller YEARLY_PRICE abonnementer."
  offer_templates:
    weekly: "US$PRICE_VALUE pr. uge"
    yearly: "US$PRICE_VALUE pr. år"
  cta: Tilføj Vocal Remover til din iPhone, iPad eller Mac
  image_alt: Download i dag og se hvorfor så mange musikere bruger Vocal Remover til hurtigt at få de stems de har brug for.
use_cases:
  title: Hvem bruger Vocal Remover?
  items:
    - title: Sangere og karaokeelskere
      body: Gør enhver sang til en karaokeversion med det samme. Øv i din egen toneart, forbered setlister og repeter uden at lede efter separate instrumentaler.
    - title: Producere og DJ's
      body: Udtræk rene instrumentaler og vokaler til remixes, edits og mashups. Klargør stems til din DAW eller dit livesæt med få klik.
    - title: Lærere og elever
      body: Lav enkle spor til undervisning, gehørtræning og transskription. Isolér vokalen for at studere frasering, eller fjern den så elever kan synge eller spille ovenpå.
    - title: Podcastere og indholdsskabere
      body: Fjern baggrundsmusik under tale, ryd op i intro og outro, og klargør tydelige stems til redigering og genbrug.
faq:
  title: Ofte stillede spørgsmål
  items:
    - question: Vocal Remover-udvidelsen er langsom eller hakker. Hvad kan jeg gøre?
      answers:
        - På nogle Windows-computere, især bærbare, kan Windows vælge det strømbesparende grafikchip til din browser i stedet for det hurtige. Fordi Vocal Remover-udvidelsen behandler lyd i realtid, kan det give forsinkelser, hakkende lyd eller helt forhindre den i at virke.
      answer_html: 'Du kan få Windows til at bruge den højtydende grafikchip til browseren. Vi har en trinvis guide med skærmbilleder her: <a href="/da/blog/set-high-performance-gpu-for-chrome-edge-on-windows/" class="underline">Vælg den højtydende grafikchip til Chrome &amp; Edge på Windows</a>. Hvis det stadig ikke hjælper, kan din computer eller browser være for begrænset til realtidsbehandling. Prøv i så fald Vocal Remover på et kraftigere system, hvis du har mulighed for det.'
    - question: Hvad er forskellen på Vocal Remover Online og Vocal Remover Offline?
      answers:
        - Vocal Remover Online er en browserudvidelse der fjerner vokal direkte på hjemmesider som YouTube og andre lyd- eller videoplatforme.
        - Vocal Remover Offline er en selvstændig iPhone-, iPad- og Mac-app der fungerer helt offline med dine egne lydfiler og kan batchbehandle hele mapper.
    - question: Skal jeg uploade lydfiler?
      answers:
        - Nej, der er ingen upload nødvendig.
        - Udvidelsen behandler lyd direkte i browseren mens den spiller, og appen til iPhone, iPad og Mac arbejder lokalt med dine filer uden servere imellem.
    - question: Hvilke lydformater understøtter Vocal Remover Offline?
      answers:
        - Vocal Remover til iPhone, iPad og Mac virker med almindelige formater som WAV, AIFF, MP3, FLAC, M4A og flere, så du kan splitte de filer du allerede har uden først at konvertere dem. Du kan også slippe videoer, mapper eller regioner fra din DAW ind, og appen udtrækker lyden automatisk.
    - question: Påvirker det lydkvaliteten at fjerne vokal?
      answers:
        - Vocal Remover bruger AI-separation der er designet til at holde instrumentaler rene og musikalske.
        - Offlineversionen giver ofte bedre kvalitet fordi den ser hele sangen under behandlingen og har flere ressourcer at arbejde med.
        - Meget komplekse eller støjende mix kan stadig give artefakter, men normale sange separeres som regel meget godt.
    - question: Kan jeg også ændre tonearten på sange?
      linked_answers:
        - tool_key: pitch_changer
          template: Ja, brug TOOL_LINK til at flytte pitch og ændre toneart på sange online eller offline. Det fungerer rigtig godt sammen med Vocal Remover.
    - question: Hvordan kan jeg ændre tempoet på en sang?
      answers: []
      linked_answers:
        - tool_key: bpm_extension
          template: Hvis du vil sætte musik på en hjemmeside ned eller op i tempo mens den allerede spiller, så brug TOOL_LINK.
    - question: Er der en gratis prøveperiode? Hvordan fungerer priserne?
      answers:
        - Både udvidelsen og iPhone-, iPad- og Mac-appen har en gratis prøveperiode uden kort.
        - Efter prøveperioden tilbyder Vocal Remover Online ugentlige, årlige og engangskøb, mens Vocal Remover Offline tilbyder ugentlige og årlige abonnementer som vist ovenfor.
        - Alle betalinger håndteres sikkert via Paddle for udvidelsen eller Apple for appen.
    - question: Hvordan opsiger jeg mit abonnement?
      answers:
        - Klik på knappen Manage Subscription i appen eller udvidelsen og følg vejledningen der.
        - Processen er helt automatisk, så du behøver ikke ringe eller skrive e-mails.
    - question: Hvem er Vocal Remover lavet til?
      answers:
        - Vocal Remover er lavet til sangere, musikere, producere, DJ's, lærere, indholdsskabere og alle der har brug for at skille stemme og musik ad.
        - Uanset om du forbereder karaoke, underviser, rydder dialog eller bygger remixes, får du hurtigt rene stems frem.
