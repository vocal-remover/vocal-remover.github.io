overview:
  title: O que é o Removedor Vocal?
  paragraphs:
    - O Removedor Vocal permite remover vocais de uma música em qualquer site e separar voz da música no computador sem software de áudio complicado. Ele foi feito para tarefas musicais do mundo real, como karaokê, remixes, estudo, ensino e criação de conteúdo.
    - "Você pode:"
  bullets:
    - Remover vocais de uma música e obter uma versão instrumental limpa.
    - Isolar a voz para estudar fraseado, harmonias e camadas.
    - Preparar faixas de karaokê, backing tracks e material de aula.
    - Limpar podcasts e vídeos removendo a música de fundo.
  versions_intro: "O Removedor Vocal está disponível em duas versões:"
  online_link_label: Removedor Vocal Online
  online_link_suffix: uma extensão de navegador para sites, e
  offline_link_label: Removedor Vocal Offline
  offline_link_suffix: um app para iPhone, iPad e Mac voltado para arquivos.
online:
  title: Removedor Vocal Online
  paragraphs:
    - Use o Removedor Vocal para limpar sua faixa online e remover vocais de uma música com separação de voz baseada em IA.
    - O Removedor Vocal Online adiciona uma ferramenta inteligente diretamente ao navegador. Remova vocais de vídeos do YouTube e de muitos outros sites de áudio em apenas alguns cliques.
  bullets:
    - Remova vocais online diretamente em qualquer site.
    - Funciona como removedor vocal para YouTube e também em outras plataformas musicais.
    - Obtenha instrumentais limpos sem baixar nem enviar arquivos.
    - Separação vocal de alta qualidade com tecnologia de IA.
    - Perfeito para karaokê, covers, remixes e backing tracks.
  perfect_for_label: "Perfeito para:"
  perfect_for_text: amantes de karaokê, cantores, professores de canto, docentes, criadores de conteúdo e qualquer pessoa que pratique com vídeos online.
  pricing_template: "Depois do teste grátis: WEEKLY_PRICE, YEARLY_PRICE ou LIFETIME_PRICE."
  offer_templates:
    weekly: "US$PRICE_VALUE por semana"
    yearly: "US$PRICE_VALUE por ano"
    lifetime: "pagamento único de US$PRICE_VALUE"
  cta: Adicionar Removedor Vocal ao navegador
  image_alt: Instale a extensão Removedor Vocal e adicione ao navegador Chrome em segundos.
offline:
  title: Removedor Vocal Offline
  paragraphs:
    - O rápido Removedor Vocal remove vocais de músicas e separa voz da música em segundos. Processe vários arquivos em lote com um clique e obtenha instrumentais limpos rapidamente.
    - Solte uma faixa ou uma pasta inteira, e o Removedor Vocal para iPhone, iPad e Mac vai dividir cada música em stems vocais e instrumentais. Feito para velocidade, precisão e um fluxo de trabalho offline sem atrito.
  bullets:
    - Remoção vocal com IA para separação precisa mesmo em mixes densas.
    - Modo em lote para processar centenas de músicas enquanto você continua trabalhando.
    - Funciona com WAV, AIFF, MP3, FLAC, M4A e outros formatos.
    - Processamento offline sem contas e sem demora de upload.
  perfect_for_label: "Perfeito para:"
  perfect_for_text: produtores, DJs, podcasters, professores e músicos que trabalham com arquivos de áudio locais.
  pricing_template: "Depois do teste grátis: WEEKLY_PRICE ou YEARLY_PRICE."
  offer_templates:
    weekly: "US$PRICE_VALUE por semana"
    yearly: "US$PRICE_VALUE por ano"
  cta: Adicionar Removedor Vocal ao iPhone, iPad ou Mac
  image_alt: Baixe hoje e veja por que tantos músicos usam o Removedor Vocal para conseguir os stems certos com rapidez.
use_cases:
  title: Quem usa o Removedor Vocal?
  items:
    - title: Cantores e fãs de karaokê
      body: Transforme qualquer música em versão de karaokê na hora. Estude na sua tonalidade, monte repertórios e ensaie sem sair procurando versões instrumentais separadas.
    - title: Produtores e DJs
      body: Extraia instrumentais e vocais limpos para remixes, edits e mashups. Prepare stems para a sua DAW ou para sets ao vivo em poucos cliques.
    - title: Professores e alunos
      body: Crie faixas simplificadas para aulas, treino de ouvido e transcrição. Isole o vocal para estudar fraseado ou remova-o para deixar os alunos cantarem ou tocarem por cima.
    - title: Podcasters e criadores de conteúdo
      body: Remova música por baixo da fala, limpe intros e outros, e prepare stems claros para edição e reaproveitamento do conteúdo.
faq:
  title: Perguntas frequentes
  items:
    - question: A extensão Removedor Vocal está lenta ou falhando. O que eu posso fazer?
      answers:
        - Em alguns computadores com Windows, especialmente notebooks, o Windows pode escolher o chip gráfico econômico para o navegador em vez do mais rápido. Como a extensão Removedor Vocal processa áudio em tempo real, isso pode causar lentidão, áudio engasgando ou até impedir o funcionamento.
      answer_html: 'Você pode configurar o Windows para usar o chip gráfico de alto desempenho no navegador. Temos um guia passo a passo com capturas de tela aqui: <a href="/pt/blog/set-high-performance-gpu-for-chrome-edge-on-windows/" class="underline">Escolha o chip gráfico de alto desempenho para Chrome e Edge no Windows</a>. Se isso não resolver, o seu computador ou navegador pode ser limitado demais para processamento em tempo real. Nesse caso, tente usar o Removedor Vocal em um sistema mais potente, se tiver acesso a um.'
    - question: Qual é a diferença entre Removedor Vocal Online e Removedor Vocal Offline?
      answers:
        - O Removedor Vocal Online é uma extensão de navegador que remove vocais diretamente em sites como YouTube e outras plataformas de áudio ou vídeo.
        - O Removedor Vocal Offline é um app independente para iPhone, iPad e Mac que funciona totalmente offline com seus próprios arquivos de áudio e permite processar pastas inteiras em lote.
    - question: Eu preciso enviar arquivos de áudio?
      answers:
        - Não, não é necessário enviar nada.
        - A extensão processa o áudio diretamente no navegador enquanto ele toca, e o app para iPhone, iPad e Mac trabalha localmente com seus arquivos, sem envolver servidores.
    - question: Quais formatos de áudio o Removedor Vocal Offline suporta?
      answers:
        - O Removedor Vocal para iPhone, iPad e Mac funciona com formatos comuns como WAV, AIFF, MP3, FLAC, M4A e outros, então você pode separar os arquivos que já tem sem converter antes. Você também pode soltar vídeos, pastas ou regiões da sua DAW, e o app extrai o áudio automaticamente.
    - question: Remover vocais afeta a qualidade do áudio?
      answers:
        - O Removedor Vocal usa separação por IA projetada para manter os instrumentais limpos e musicais.
        - A versão offline costuma oferecer qualidade melhor porque analisa a música inteira durante o processamento e conta com mais recursos.
        - Mixes muito complexas ou ruidosas ainda podem gerar artefatos, mas músicas comuns normalmente se separam muito bem.
    - question: Eu também posso mudar a tonalidade das músicas?
      linked_answers:
        - tool_key: pitch_changer
          template: Sim, use TOOL_LINK para mudar o pitch e a tonalidade das músicas online ou offline. Ele funciona muito bem junto com o Removedor Vocal.
    - question: Como posso mudar o tempo de uma música?
      answers: []
      linked_answers:
        - tool_key: bpm_extension
          template: Se você quer desacelerar ou acelerar a música em um site enquanto ela já está tocando, use TOOL_LINK.
        - tool_key: speed_tool
          template: Se você quer mudar o tempo do seu próprio arquivo mantendo o pitch estável, use TOOL_LINK.
    - question: Existe teste grátis? Como funciona o preço?
      answers:
        - Tanto a extensão quanto o app para iPhone, iPad e Mac incluem um período de teste grátis sem cartão.
        - Depois do teste, o Removedor Vocal Online oferece opções semanais, anuais e compra única, enquanto o Removedor Vocal Offline oferece assinaturas semanais e anuais, como mostrado acima.
        - Todos os pagamentos são processados com segurança via Paddle para a extensão ou Apple para o app.
    - question: Como cancelo minha assinatura?
      answers:
        - Clique no botão Manage Subscription dentro do app ou da extensão e siga as instruções.
        - O processo é totalmente automático, então não é preciso telefonar nem mandar e-mails.
    - question: Para quem o Removedor Vocal foi feito?
      answers:
        - O Removedor Vocal foi feito para cantores, músicos, produtores, DJs, professores, criadores de conteúdo e qualquer pessoa que precise separar voz e música.
        - Seja para preparar karaokê, dar aula, limpar diálogo ou montar remixes, ele entrega stems limpos rapidamente.
