      summary: Use este guia quando a extensão do navegador engasgar ou tiver dificuldade em tempo real no Windows, especialmente em notebooks que usam por padrão o chip gráfico econômico.
pages:
  gpu_guide:
    meta:
      title: "Escolha o chip gráfico de alto desempenho para Chrome e Edge (Windows)"
      description: "Se o Removedor Vocal estiver lento ou instável no Windows, configure o Chrome ou o Edge para usar o chip gráfico de alto desempenho com este guia passo a passo."
      og_title: "Escolha o chip gráfico de alto desempenho para Chrome e Edge (Windows)"
      og_description: "Se o Removedor Vocal estiver lento ou instável no Windows, configure o Chrome ou o Edge para usar o chip gráfico de alto desempenho com este guia passo a passo."
      og_type: article
      og_image: /blog/set-high-performance-gpu-for-chrome-edge-on-windows/graphics-settings-chrome-3.png
    guide:
      extension_link_label: Extensão Removedor Vocal
      page_title: Faça o Windows usar o chip gráfico rápido no navegador
      intro_html:
        - EXTENSION_LINK faz cálculos pesados em tempo real, por isso precisa de um chip gráfico rápido para funcionar de forma fluida. Mesmo sendo um assunto de áudio, os navegadores modernos usam o chip gráfico nos bastidores para acelerar o processamento pesado, e o Removedor Vocal também precisa desse desempenho.
        - Em alguns computadores, especialmente notebooks, o Windows pode escolher o chip gráfico econômico para o navegador. Isso pode causar lentidão, áudio engasgando ou até impedir completamente o funcionamento da extensão Removedor Vocal. Este guia faz o Windows usar o chip gráfico de alto desempenho no navegador.
      detected_browser_label: Navegador detectado
      unknown_browser_label: Desconhecido
      back_home_label: Voltar para a página inicial
      copy_button:
        idle: Copiar
        success: Copiado!
      browsers:
        chrome:
          tab_label: Google Chrome
          detected_label: Google Chrome
          tab_accent: blue
          title: Configure o Chrome para usar o chip gráfico de alto desempenho
          steps:
            - number: 1
              title: Abra as configurações de Gráficos
              paragraphs_html:
                - 'Abra as configurações <a href="ms-settings:display-advancedgraphics" class="underline">clicando aqui</a>, ou vá em <span class="font-medium">Configurações → Sistema → Tela → Gráficos</span>.'
                - 'Na lista, procure por <span class="font-medium">Google Chrome</span> (talvez seja preciso rolar). Se ele já estiver lá, vá direto para a <a href="#step3-chrome" class="underline">etapa 3</a>.'
              images:
                - src: graphics-settings.png
                  alt: Tela Configurações → Sistema → Tela → Gráficos
            - number: 2
              title: Adicione o Chrome se ele não aparecer
              paragraphs_html:
                - 'Se o Chrome não estiver na lista, clique em <span class="font-medium">Adicionar aplicativo da área de trabalho</span> e selecione <span class="font-medium">Google Chrome</span>.'
                - 'Se precisar, cole este caminho e pressione <span class="font-medium">Enter</span>:'
              copy_value: "%ProgramFiles%\\Google\\Chrome\\Application\\chrome.exe"
              images:
                - src: graphics-settings-chrome-1.png
                  alt: Adicionando o Google Chrome nas configurações de gráficos do Windows
            - number: 3
              id: step3-chrome
              title: Abra as Opções do Chrome
              paragraphs_html:
                - 'Clique em <span class="font-medium">Google Chrome</span> na lista e depois em <span class="font-medium">Opções</span>.'
              images:
                - src: graphics-settings-chrome-2.png
                  alt: Botão Opções do Google Chrome nas configurações de gráficos do Windows
            - number: 4
              title: Escolha Alto desempenho
              paragraphs_html:
                - 'Selecione <span class="font-medium">Alto desempenho</span> e depois clique em <span class="font-medium">Salvar</span>.'
                - 'Se você vir mais de um chip gráfico, a opção de alto desempenho normalmente mostra o chip dedicado mais forte. Deve aparecer a indicação <span class="font-medium">Current: High performance</span>.'
              images:
                - src: graphics-settings-chrome-3.png
                  alt: Escolhendo Alto desempenho para o Google Chrome no Windows
        edge:
          tab_label: Microsoft Edge
          detected_label: Microsoft Edge
          tab_accent: cyan
          title: Configure o Edge para usar o chip gráfico de alto desempenho
          steps:
            - number: 1
              title: Abra as configurações de Gráficos
              paragraphs_html:
                - 'Abra as configurações <a href="ms-settings:display-advancedgraphics" class="underline">clicando aqui</a>, ou vá em <span class="font-medium">Configurações → Sistema → Tela → Gráficos</span>.'
                - 'Na lista, procure por <span class="font-medium">Microsoft Edge</span> (talvez seja preciso rolar). Se ele já estiver lá, vá direto para a <a href="#step3-edge" class="underline">etapa 3</a>.'
              images:
                - src: graphics-settings.png
                  alt: Tela Configurações → Sistema → Tela → Gráficos
            - number: 2
              title: Adicione o Edge se ele não aparecer
              paragraphs_html:
                - 'Se o Edge não estiver na lista, clique em <span class="font-medium">Adicionar aplicativo da área de trabalho</span> e selecione <span class="font-medium">Microsoft Edge</span>.'
                - 'Se precisar, cole este caminho e pressione <span class="font-medium">Enter</span>:'
              copy_value: "%ProgramFiles(x86)%\\Microsoft\\Edge\\Application\\msedge.exe"
              images:
                - src: graphics-settings-edge-1.png
                  alt: Adicionando o Microsoft Edge nas configurações de gráficos do Windows
            - number: 3
              id: step3-edge
              title: Abra as Opções do Edge
              paragraphs_html:
                - 'Clique em <span class="font-medium">Microsoft Edge</span> na lista e depois em <span class="font-medium">Opções</span>.'
              images:
                - src: graphics-settings-edge-2.png
                  alt: Botão Opções do Microsoft Edge nas configurações de gráficos do Windows
            - number: 4
              title: Escolha Alto desempenho
              paragraphs_html:
                - 'Selecione <span class="font-medium">Alto desempenho</span> e depois clique em <span class="font-medium">Salvar</span>.'
                - 'Se você vir mais de um chip gráfico, a opção de alto desempenho normalmente mostra o chip dedicado mais forte. Deve aparecer a indicação <span class="font-medium">Current: High performance</span>.'
              images:
                - src: graphics-settings-edge-3.png
                  alt: Escolhendo Alto desempenho para o Microsoft Edge no Windows
