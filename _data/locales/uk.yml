overview:
  title: Що таке Vocal Remover?
  paragraphs:
    - "Vocal Remover дає змогу прибирати вокал з пісні на будь-якому сайті та відокремлювати голос від музики на комп'ютері без складних аудіоредакторів. Його створено для реальних задач: караоке, реміксів, занять, уроків і створення контенту."
    - "За допомогою Vocal Remover можна:"
  bullets:
    - Прибирати вокал з пісні й отримувати чистий інструментал.
    - Ізолювати голос, щоб розбирати фразування, гармонії та шари.
    - Готувати караоке-версії, мінусовки та навчальні матеріали.
    - Очищати подкасти й відео, прибираючи фонову музику.
  versions_intro: "Vocal Remover доступний у двох версіях:"
  online_link_label: Vocal Remover Online
  online_link_suffix: як розширення для сайтів, і
  offline_link_label: Vocal Remover Offline
  offline_link_suffix: як застосунок для iPhone, iPad і Mac для роботи з файлами.
online:
  title: Vocal Remover Online
  paragraphs:
    - Скористайтеся Vocal Remover, щоб очищати трек онлайн і прибирати вокал з пісні за допомогою AI-розділення.
    - Vocal Remover Online додає розумний інструмент прямо в браузер. Прибирайте вокал з відео на YouTube та багатьох інших аудіосайтах усього за кілька кліків.
  bullets:
    - Прибирайте вокал з пісні онлайн прямо на будь-якому сайті.
    - Працює як розширення для видалення вокалу на YouTube та інших музичних платформах.
    - Дозволяє отримувати чисті інструментали без завантаження та вивантаження файлів.
    - AI-розділення для якісного результату.
    - Добре підходить для караоке, каверів, реміксів і фонограм.
  perfect_for_label: "Чудово підходить для:"
  perfect_for_text: любителів караоке, співаків, вокальних педагогів, викладачів, творців контенту та всіх, хто займається під онлайн-відео.
  pricing_template: "Після безкоштовного пробного періоду: WEEKLY_PRICE, YEARLY_PRICE або LIFETIME_PRICE."
  offer_templates:
    weekly: "$PRICE_VALUE на тиждень"
