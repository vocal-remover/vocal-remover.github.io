use_cases:
  title: Хто використовує Vocal Remover?
  items:
    - title: Співаки й любителі караоке
      body: Миттєво перетворюйте будь-який трек на караоке-версію. Займайтеся у зручній тональності, готуйте сет-листи й репетируйте без пошуку окремих інструменталів.
    - title: Продюсери й діджеї
      body: Діставайте чисті інструментали та вокал для реміксів, едітів і мешапів. Готуйте стеми для DAW або лайв-сетів у кілька кліків.
    - title: Викладачі й учні
      body: Створюйте полегшені треки для уроків, тренування слуху та розшифрування. Ізолюйте голос, щоб розбирати фразування, або прибирайте його, щоб співати чи грати поверх.
    - title: Подкастери й творці контенту
      body: Прибирайте музику під мовленням, очищайте інтро та аутро й готуйте зрозумілі стеми для монтажу та повторного використання.
faq:
  title: Часті запитання
  items:
    - question: Розширення Vocal Remover працює повільно або з перебоями. Що робити?
      answers:
        - На деяких комп'ютерах Windows, особливо на ноутбуках, система може вибирати для браузера енергоощадний графічний процесор замість швидкого. Оскільки Vocal Remover обробляє звук у реальному часі, це може спричиняти зависання, заїкання звуку або повну нестабільність роботи.
      answer_html: 'Ви можете вказати Windows використовувати для браузера високопродуктивний графічний процесор. Ось покрокова інструкція зі скриншотами: <a href="/uk/blog/обрати-високопродуктивний-графічний-процесор-для-chrome-edge-на-windows/" class="underline">Обрати високопродуктивний графічний процесор для Chrome та Edge на Windows</a>. Якщо після цього проблема не зникне, можливо, ваш комп''ютер або браузер просто замалі для обробки в реальному часі. У такому разі спробуйте Vocal Remover на потужнішій системі, якщо маєте до неї доступ.'
    - question: У чому різниця між Vocal Remover Online і Vocal Remover Offline?
      answers:
        - Vocal Remover Online — це розширення для браузера, яке прибирає вокал прямо на сайтах на кшталт YouTube та інших аудіо- чи відеоплатформах.
        - Vocal Remover Offline — це окремий застосунок для iPhone, iPad і Mac, який повністю офлайн працює з вашими аудіофайлами та дає змогу пакетно обробляти цілі теки.
    - question: Чи потрібно завантажувати аудіофайли?
      answers:
        - Ні, завантаження не потрібне.
        - Розширення обробляє звук прямо в браузері під час відтворення, а застосунок для iPhone, iPad і Mac працює локально з файлами на вашому комп'ютері, без серверів.
    - question: Які аудіоформати підтримує Vocal Remover Offline?
      answers:
        - Vocal Remover для iPhone, iPad і Mac підтримує популярні формати на кшталт WAV, AIFF, MP3, FLAC, M4A та інші, тож ви можете розділяти наявні файли без попереднього перетворення. Також можна додавати відео, теки або регіони з DAW, і застосунок автоматично витягне звук.
    - question: Чи впливає прибирання вокалу на якість аудіо?
      answers:
        - Vocal Remover використовує AI-розділення, яке намагається зберігати інструментал чистим і музичним.
        - Офлайн-версія зазвичай дає кращу якість, бо бачить увесь трек під час обробки й має більше обчислювальних ресурсів.
        - Дуже складні або шумні мікси все ще можуть давати артефакти, але звичайні пісні розділяються дуже добре.
    - question: Чи можна також змінювати тональність пісень?
      linked_answers:
        - tool_key: pitch_changer
          template: Так, використовуйте TOOL_LINK, щоб змінювати висоту й тональність пісень онлайн або офлайн. Разом із Vocal Remover це працює особливо зручно.
    - question: Як змінити темп пісні?
      answers: []
      linked_answers:
        - tool_key: bpm_extension
          template: Якщо хочете сповільнити або пришвидшити музику на сайті, поки вона вже грає, використовуйте TOOL_LINK.
        - tool_key: speed_tool
          template: Якщо хочете змінити темп власного файлу та зберегти висоту, використовуйте TOOL_LINK.
    - question: Чи є безкоштовний пробний період? Як працює ціна?
      answers:
        - І розширення, і застосунок для iPhone, iPad і Mac мають безкоштовний пробний період. Картка не потрібна.
        - Після пробного періоду Vocal Remover Online пропонує тижневі, річні та разові варіанти, а Vocal Remover Offline — тижневі й річні підписки, як зазначено вище.
        - Усі платежі безпечно обробляються через Paddle для розширення або Apple для застосунку.
    - question: Як скасувати підписку?
      answers:
        - Просто натисніть кнопку «Manage Subscription» у застосунку або розширенні й дотримуйтеся інструкцій.
        - Процес повністю автоматичний, тож телефонувати чи писати листи не потрібно.
    - question: Для кого створено Vocal Remover?
      answers:
        - Vocal Remover створено для співаків, музикантів, продюсерів, діджеїв, викладачів, творців контенту й усіх, кому потрібно відокремити голос від музики.
        - Чи то караоке, чи уроки, чи монтаж діалогів, чи ремікси — інструмент швидко дає чисті стеми.
