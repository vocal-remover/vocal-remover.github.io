    lifetime: "разова покупка за $PRICE_VALUE"
  cta: Додати Vocal Remover у браузер
  image_alt: Установіть розширення Vocal Remover і додайте його до Chrome за кілька секунд.
offline:
  title: Vocal Remover Offline
  paragraphs:
    - Vocal Remover прибирає вокал з пісень і відокремлює голос від музики за секунди. Ви можете обробляти кілька файлів за раз і швидко готувати чисті інструментали.
    - Додайте один трек або цілу теку, і Vocal Remover для iPhone, iPad чи Mac розкладе кожну пісню на вокальний та інструментальний стем. Усе побудовано навколо швидкості, точності й офлайн-роботи з вашими файлами.
  bullets:
    - Точне AI-розділення навіть на щільних аранжуваннях.
    - Пакетний режим для обробки десятків і сотень треків, поки ви працюєте далі.
    - Підтримка WAV, AIFF, MP3, FLAC, M4A та інших форматів.
    - Офлайн-обробка без акаунтів і без очікування вивантаження.
  perfect_for_label: "Чудово підходить для:"
  perfect_for_text: продюсерів, діджеїв, подкастерів, викладачів і музикантів, які працюють із локальними аудіофайлами.
  pricing_template: "Після безкоштовного пробного періоду: WEEKLY_PRICE або YEARLY_PRICE."
