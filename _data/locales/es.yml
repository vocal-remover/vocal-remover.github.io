overview:
  title: ¿Qué es Vocal Remover?
  paragraphs:
    - "Vocal Remover te permite quitar voces de una canción en cualquier sitio y separar voz y música en tu computadora sin software de audio complicado. Está hecho para usos reales: karaoke, remixes, práctica, enseñanza y creación de contenido."
    - "Con Vocal Remover puedes:"
  bullets:
    - Quitar voces de una canción para obtener una base limpia.
    - Aislar la voz para estudiar fraseo, armonías y capas.
    - Preparar pistas karaoke, backing tracks y material didáctico.
    - Limpiar podcasts y videos quitando música de fondo.
  versions_intro: "Vocal Remover está disponible en dos versiones:"
  online_link_label: Vocal Remover Online
  online_link_suffix: como extensión para sitios, y
  offline_link_label: Vocal Remover Offline
  offline_link_suffix: como app para iPhone, iPad y Mac para trabajar con archivos.
online:
  title: Vocal Remover Online
  paragraphs:
    - Usa Vocal Remover para limpiar tu pista online y quitar voces de una canción con este separador vocal con AI.
    - Vocal Remover Online agrega una herramienta inteligente directamente en tu navegador. Quita voces de videos de YouTube y de muchos otros sitios de audio en pocos clics.
  bullets:
    - Quita voces de una canción online directamente en cualquier sitio.
    - Funciona como extensión para quitar voces en YouTube y en otras plataformas musicales.
    - Obtén bases limpias sin descargar ni subir archivos.
    - Tecnología AI para una separación de alta calidad.
    - Ideal para karaoke, covers, remixes y pistas de acompañamiento.
  perfect_for_label: "Ideal para:"
  perfect_for_text: amantes del karaoke, cantantes, coaches vocales, docentes, creadores y cualquiera que practique con videos online.
  pricing_template: "Después de la prueba gratuita: suscripciones WEEKLY_PRICE, YEARLY_PRICE o LIFETIME_PRICE."
  offer_templates:
    weekly: "$PRICE_VALUE por semana"
    yearly: "$PRICE_VALUE por año"
    lifetime: "pago único de $PRICE_VALUE"
  cta: Agregar Vocal Remover a tu navegador
  image_alt: Instala la extensión Vocal Remover y agrégala a Chrome en segundos.
offline:
  title: Vocal Remover Offline
  paragraphs:
    - Vocal Remover quita voces de canciones y separa voz y música en segundos. Procesa varios archivos de una sola vez para obtener bases limpias.
    - Arrastra una sola pista o una carpeta completa, y Vocal Remover para iPhone, iPad o Mac dividirá cada canción en stems vocales e instrumentales. Está pensado para velocidad, precisión y trabajo offline con tus archivos.
  bullets:
    - Separación AI precisa incluso en mezclas densas.
    - Modo batch para procesar decenas o cientos de canciones mientras sigues trabajando.
    - Funciona con WAV, AIFF, MP3, FLAC, M4A y más.
    - Procesamiento offline sin cuentas ni demoras de subida.
  perfect_for_label: "Ideal para:"
  perfect_for_text: productores, DJ, podcasters, docentes y músicos que trabajan con archivos de audio locales.
  pricing_template: "Después de la prueba gratuita: suscripciones WEEKLY_PRICE o YEARLY_PRICE."
  offer_templates:
    weekly: "$PRICE_VALUE por semana"
    yearly: "$PRICE_VALUE por año"
  cta: Agregar Vocal Remover a tu iPhone, iPad o Mac
  image_alt: Descarga Vocal Remover y prepara bases y stems vocales con un flujo de trabajo rápido.
use_cases:
  title: ¿Quién usa Vocal Remover?
  items:
    - title: Cantantes y amantes del karaoke
      body: Convierte al instante cualquier canción en una versión karaoke. Practica en tu tonalidad, arma repertorios y ensaya sin buscar bases por separado.
    - title: Productores y DJ
      body: Extrae bases limpias y voces para remixes, edits y mashups. Prepara stems para tu DAW o para tus sets en pocos clics.
    - title: Docentes y estudiantes
      body: Crea pistas más limpias para clases, entrenamiento auditivo y transcripción. Aísla la voz para estudiar el fraseo o quítala para que el alumnado toque o cante encima.
    - title: Podcasters y creadores
      body: Quita la música debajo de la voz, limpia intros y outros y prepara stems claros para edición y reutilización de contenido.
faq:
  title: Preguntas frecuentes
  items:
    - question: La extensión Vocal Remover va lenta o falla. ¿Qué puedo hacer?
      answers:
        - En algunas computadoras con Windows, especialmente portátiles, Windows puede elegir para tu navegador la gráfica de ahorro de energía en lugar de la más rápida. Como Vocal Remover procesa audio en tiempo real, esto puede causar lentitud, audio entrecortado o incluso impedir que funcione bien.
      answer_html: 'Puedes indicarle a Windows que use la gráfica de alto rendimiento para tu navegador. Aquí tienes una guía paso a paso con capturas: <a href="/es/blog/set-high-performance-gpu-for-chrome-edge-on-windows/" class="underline">Elige la gráfica de alto rendimiento para Chrome y Edge en Windows</a>. Si después de seguir la guía el problema continúa, puede que tu computadora o tu navegador simplemente no sean suficientes para el procesamiento en tiempo real. En ese caso, prueba Vocal Remover en un sistema más potente si tienes acceso a uno.'
    - question: ¿Cuál es la diferencia entre Vocal Remover Online y Vocal Remover Offline?
      answers:
        - Vocal Remover Online es una extensión de navegador que quita voces directamente en sitios como YouTube y otras plataformas de audio o video.
        - Vocal Remover Offline es una app independiente para iPhone, iPad y Mac que funciona completamente offline con tus archivos de audio y te deja procesar carpetas completas en batch.
    - question: ¿Necesito subir archivos de audio?
      answers:
        - No necesitas subir nada.
        - La extensión procesa el audio directamente en tu navegador mientras suena, y la app para iPhone, iPad o Mac trabaja localmente con archivos en tu computadora, sin servidores de por medio.
    - question: ¿Qué formatos de audio soporta Vocal Remover Offline?
      answers:
        - Vocal Remover para iPhone, iPad o Mac funciona con formatos comunes como WAV, AIFF, MP3, FLAC, M4A y más, así que puedes separar los archivos que ya tienes sin convertirlos antes. También puedes arrastrar videos, carpetas o regiones desde tu DAW, y la app extraerá el audio automáticamente.
    - question: ¿Quitar voces afecta la calidad del audio?
      answers:
        - Vocal Remover usa separación AI pensada para mantener las bases limpias y musicales.
        - La versión offline ofrece mejor calidad porque ve la canción completa durante el procesamiento y tiene más recursos de cómputo.
        - Mezclas muy complejas o ruidosas todavía pueden mostrar artefactos, pero en canciones normales la separación suele salir muy bien.
    - question: ¿También puedo cambiar la tonalidad de canciones?
      linked_answers:
        - tool_key: pitch_changer
          template: Sí, usa TOOL_LINK para mover la afinación y cambiar la tonalidad de canciones online u offline. Funciona muy bien junto a Vocal Remover.
    - question: ¿Cómo puedo cambiar el tempo de una canción?
      answers: []
      linked_answers:
        - tool_key: bpm_extension
          template: Si quieres ralentizar o acelerar música en un sitio mientras ya está sonando, usa TOOL_LINK.
        - tool_key: speed_tool
          template: Si quieres cambiar el tempo de tu propio archivo manteniendo estable la afinación, usa TOOL_LINK.
    - question: ¿Hay prueba gratuita? ¿Cómo funciona el precio?
      answers:
        - Tanto la extensión como la app para iPhone, iPad y Mac incluyen un período de prueba gratuito. Sin tarjeta.
        - Después de la prueba, Vocal Remover Online ofrece planes semanales, anuales y compra única, mientras que Vocal Remover Offline ofrece suscripciones semanales y anuales, como se indica arriba.
        - Todos los pagos se gestionan de forma segura mediante Paddle para la extensión o Apple para la app.
    - question: ¿Cómo cancelo mi suscripción?
      answers:
        - Solo haz clic en el botón “Manage Subscription” dentro de la app o la extensión y sigue las instrucciones.
        - El proceso es completamente automático, así que no hace falta llamar ni enviar correos.
    - question: ¿Para quién está hecho Vocal Remover?
      answers:
        - Vocal Remover está hecho para cantantes, músicos, productores, DJ, docentes, creadores y cualquiera que necesite separar voz y música.
        - Ya sea que estés preparando karaoke, clases, diálogos o remixes, te da stems limpios en muy poco tiempo.
