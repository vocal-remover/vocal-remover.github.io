pages:
  gpu_guide:
    meta:
      title: "Elige la gráfica de alto rendimiento para Chrome y Edge (Windows)"
      description: "Si Vocal Remover se siente lento o inestable en Windows, configura Chrome o Edge para usar la gráfica de alto rendimiento con esta guía paso a paso."
      og_title: "Elige la gráfica de alto rendimiento para Chrome y Edge (Windows)"
      og_description: "Si Vocal Remover se siente lento o inestable en Windows, configura Chrome o Edge para usar la gráfica de alto rendimiento con esta guía paso a paso."
      og_type: article
      og_image: /blog/set-high-performance-gpu-for-chrome-edge-on-windows/graphics-settings-chrome-3.png
    guide:
      extension_link_label: Extensión Vocal Remover
      page_title: Haz que Windows use la gráfica rápida para tu navegador
      intro_html:
        - "EXTENSION_LINK hace cálculos pesados en tiempo real, así que necesita una gráfica rápida para funcionar con fluidez. Aunque esto va de audio, los navegadores modernos usan la gráfica por detrás para acelerar los cálculos, y Vocal Remover la necesita."
        - "En algunas computadoras, especialmente portátiles, Windows puede elegir la gráfica de ahorro de energía para tu navegador. Eso puede causar lentitud, audio entrecortado o incluso impedir que Vocal Remover funcione bien. Esta guía le indica a Windows que use la gráfica de alto rendimiento para tu navegador."
      detected_browser_label: Navegador detectado
      unknown_browser_label: Desconocido
      back_home_label: Volver al inicio
      copy_button:
        idle: Copiar
        success: ¡Copiado!
      browsers:
        chrome:
          tab_label: Google Chrome
          detected_label: Google Chrome
          tab_accent: blue
          title: Configura Chrome para usar la gráfica de alto rendimiento
          steps:
            - number: 1
              title: Abre la configuración de Gráficos
              paragraphs_html:
                - 'Abre la configuración <a href="ms-settings:display-advancedgraphics" class="underline">desde este enlace</a> o ve a <span class="font-medium">Configuración → Sistema → Pantalla → Gráficos</span>.'
                - 'En la lista busca <span class="font-medium">Google Chrome</span> (puede que necesites desplazarte). Si ya aparece, ve al <a href="#step3-chrome" class="underline">Paso 3</a>.'
              images:
                - src: graphics-settings.png
                  alt: Pantalla Configuración → Sistema → Pantalla → Gráficos
            - number: 2
              title: Agrega Chrome a la lista si no aparece
              paragraphs_html:
                - "Si no ves Chrome allí:"
              instructions_html:
                - 'Haz clic en <span class="font-medium">Agregar aplicación de escritorio</span>.'
                - 'Abajo, en el campo <span class="font-medium">Nombre de archivo</span>, <span class="font-medium">pega una de las rutas</span> de abajo.'
                - 'Pulsa <span class="font-medium">Enter</span> o haz clic en <span class="font-medium">Agregar</span>.'
              note_html: Si la primera ruta da error, prueba la siguiente.
              copy_paths:
                - '%LocalAppData%\Google\Chrome\Application\chrome.exe'
                - 'C:\Program Files (x86)\Google\Chrome\Application\chrome.exe'
                - 'C:\Program Files\Google\Chrome\Application\chrome.exe'
              images:
                - src: graphics-settings-2.png
                  alt: Pantalla de Gráficos con el botón Agregar aplicación de escritorio resaltado
                - src: file-picker-2.png
                  alt: Ventana para elegir archivo con el campo del nombre resaltado
            - number: 3
              anchor_id: step3-chrome
              title_html: 'Elige <em>Alto rendimiento</em> para Chrome'
              paragraphs_html:
                - 'Encuentra <span class="font-medium">Google Chrome</span> en la lista, abre las <span class="font-medium">Opciones</span> de la app y configura <span class="font-medium whitespace-nowrap">Preferencia de GPU</span> en <span class="font-medium whitespace-nowrap">Alto rendimiento</span>.'
              images:
                - src: graphics-settings-chrome-3.png
                  alt: Pantalla de Gráficos con Google Chrome resaltado
            - number: 4
              title: Reinicia el navegador y, si hace falta, la computadora
              paragraphs_html:
                - "Cierra Chrome y vuelve a abrirlo. Si no ayuda, prueba reiniciando la computadora."
              images: []
          troubleshooting:
            title: Si no notas diferencia
            items:
              - label: "¿Portátil con batería?"
                body_html: En algunos portátiles Windows sigue prefiriendo la gráfica de ahorro de energía cuando no está conectado. Prueba enchufándolo&nbsp;a la corriente.
              - label: Actualiza los drivers gráficos
                body_html: desde la app del fabricante de la GPU (NVIDIA / AMD / Intel) o con Windows Update.
              - label: Restablece
                body_html: 'En la configuración de Gráficos vuelve a poner Chrome en <em>Dejar que Windows decida</em> y repite los pasos.'
        edge:
          tab_label: Microsoft Edge
          detected_label: Microsoft Edge
          tab_accent: violet
          title: Configura Edge para usar la gráfica de alto rendimiento
          steps:
            - number: 1
              title: Abre la configuración de Gráficos
              paragraphs_html:
                - 'Abre la configuración <a href="ms-settings:display-advancedgraphics" class="underline">desde este enlace</a> o ve a <span class="font-medium">Configuración → Sistema → Pantalla → Gráficos</span>.'
                - 'En la lista busca <span class="font-medium">Microsoft Edge</span> (puede que necesites desplazarte). Si ya aparece, ve al <a href="#step3-edge" class="underline">Paso 3</a>.'
              images:
                - src: graphics-settings.png
                  alt: Pantalla Configuración → Sistema → Pantalla → Gráficos
            - number: 2
              title: Agrega Edge a la lista si no aparece
              paragraphs_html:
                - "Si no ves Edge allí:"
              instructions_html:
                - 'Haz clic en <span class="font-medium">Agregar aplicación de escritorio</span>.'
                - 'Abajo, en el campo <span class="font-medium">Nombre de archivo</span>, <span class="font-medium">pega una de las rutas</span> de abajo.'
                - 'Pulsa <span class="font-medium">Enter</span> o haz clic en <span class="font-medium">Agregar</span>.'
              note_html: Si la primera ruta da error, prueba la siguiente.
              copy_paths:
                - 'C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe'
                - 'C:\Program Files\Microsoft\Edge\Application\msedge.exe'
              images:
                - src: graphics-settings-2.png
                  alt: Pantalla de Gráficos con el botón Agregar aplicación de escritorio resaltado
                - src: file-picker-2.png
                  alt: Ventana para elegir archivo con el campo del nombre resaltado
            - number: 3
              anchor_id: step3-edge
              title_html: 'Elige <em>Alto rendimiento</em> para Edge'
              paragraphs_html:
                - 'Encuentra <span class="font-medium">Microsoft Edge</span> en la lista, abre las <span class="font-medium">Opciones</span> de la app y configura <span class="font-medium whitespace-nowrap">Preferencia de GPU</span> en <span class="font-medium whitespace-nowrap">Alto rendimiento</span>.'
              images:
                - src: graphics-settings-edge-3.png
                  alt: Pantalla de Gráficos con Microsoft Edge resaltado
            - number: 4
              title: Reinicia el navegador y, si hace falta, la computadora
              paragraphs_html:
                - "Cierra Edge y vuelve a abrirlo. Si no ayuda, prueba reiniciando la computadora."
              images: []
          troubleshooting:
            title: Si no notas diferencia
            items:
              - label: "¿Portátil con batería?"
                body_html: En algunos portátiles Windows sigue prefiriendo la gráfica de ahorro de energía cuando no está conectado. Prueba enchufándolo&nbsp;a la corriente.
              - label: Actualiza los drivers gráficos
                body_html: desde la app del fabricante de la GPU (NVIDIA / AMD / Intel) o con Windows Update.
              - label: Restablece
                body_html: 'En la configuración de Gráficos vuelve a poner Edge en <em>Dejar que Windows decida</em> y repite los pasos.'
