llms:
  languages_heading: 対応言語
  home_link_label: ホーム
  link_label: LLMS
  lead: ボーカル リムーバーは、シンガー、プロデューサー、先生、ポッドキャスター、カラオケ好きが、サイト上でも手元のファイルでも声と伴奏を分けられるようにします。
  intro: このリファレンスでは、この言語で利用できるボーカル リムーバーのページをまとめ、音楽用途、ファイルの扱い、サイト向け拡張機能とファイル向けオフラインアプリの選び方に絞って案内します。
  versions_heading: 自分に合うバージョンを選ぶ
  sections:
    site: サイト
    guides: ガイド
  pages:
    home:
      title: ボーカル リムーバー
      summary: ここから始めれば、ボーカル リムーバーで伴奏を作る方法、ボーカルを分離する方法、ブラウザー拡張機能とオフラインアプリの違い、サイト向けかファイル向けかの選び方がわかります。
    gpu_guide:
      title: Windows で Chrome と Edge に高性能 GPU を選ぶ
      summary: Windows でブラウザー拡張機能がカクついたり、リアルタイム処理が重かったりするときに読むガイドです。特に省電力 GPU が既定になっているノート PC で役立ちます。
pages:
  gpu_guide:
    meta:
      title: "Windows で Chrome と Edge に高性能 GPU を選ぶ"
      description: "Windows でボーカル リムーバーが遅い、または不安定なときは、この手順で Chrome または Edge に高性能 GPU を割り当ててください。"
      og_title: "Windows で Chrome と Edge に高性能 GPU を選ぶ"
      og_description: "Windows でボーカル リムーバーが遅い、または不安定なときは、この手順で Chrome または Edge に高性能 GPU を割り当ててください。"
      og_type: article
      og_image: /blog/set-high-performance-gpu-for-chrome-edge-on-windows/graphics-settings-chrome-3.png
    guide:
      extension_link_label: ボーカル リムーバー拡張機能
      page_title: Windows でブラウザーに高速 GPU を使わせる
      intro_html:
        - "EXTENSION_LINK は重い計算をリアルタイムで行うため、快適に動くには高速 GPU が必要です。音声の処理でも、最近のブラウザーは重い計算を速くするために GPU を使うので、ボーカル リムーバーにも重要です。"
        - "一部のパソコン、とくにノート PC では、ブラウザーに省電力 GPU が割り当てられることがあります。そのままだと重くなったり音が途切れたり、ボーカル リムーバーが正しく動かなくなったりします。このガイドでは、ブラウザーに高性能 GPU を使わせる設定を行います。"
      detected_browser_label: 検出されたブラウザー
      unknown_browser_label: 不明
      back_home_label: ホームへ戻る
      copy_button:
        idle: コピー
        success: コピーしました
      browsers:
        chrome:
          tab_label: Google Chrome
          detected_label: Google Chrome
          tab_accent: blue
          title: Chrome に高性能 GPU を使わせる
          steps:
            - number: 1
              title: グラフィック設定を開く
              paragraphs_html:
                - '<a href="ms-settings:display-advancedgraphics" class="underline">こちらのリンク</a>から開くか、<span class="font-medium">設定 → システム → ディスプレイ → グラフィック</span> に進みます。'
                - '一覧の中から <span class="font-medium">Google Chrome</span> を探します（スクロールが必要な場合があります）。すでに見つかる場合は <a href="#step3-chrome" class="underline">手順 3</a> へ進んでください。'
              images:
                - src: graphics-settings.png
                  alt: 設定 → システム → ディスプレイ → グラフィック 画面
            - number: 2
              title: 見当たらない場合は Chrome を追加する
              paragraphs_html:
                - "Chrome が表示されない場合:"
              instructions_html:
                - '<span class="font-medium">デスクトップ アプリを追加</span> を押します。'
                - '下の <span class="font-medium">ファイル名</span> 欄に、<span class="font-medium">以下のいずれかのパス</span> を貼り付けます。'
                - '<span class="font-medium">Enter</span> を押すか、<span class="font-medium">追加</span> を押します。'
              note_html: 1 つ目のパスでエラーになる場合は次を試してください。
              copy_paths:
                - '%LocalAppData%\Google\Chrome\Application\chrome.exe'
                - 'C:\Program Files (x86)\Google\Chrome\Application\chrome.exe'
                - 'C:\Program Files\Google\Chrome\Application\chrome.exe'
              images:
                - src: graphics-settings-2.png
                  alt: グラフィック設定で デスクトップ アプリを追加 ボタンが強調された画面
                - src: file-picker-2.png
                  alt: ファイル名欄が強調されたファイル選択画面
            - number: 3
              anchor_id: step3-chrome
              title_html: 'Chrome で <em>高パフォーマンス</em> を選ぶ'
              paragraphs_html:
                - '一覧で <span class="font-medium">Google Chrome</span> を見つけて <span class="font-medium">オプション</span> を開き、<span class="font-medium whitespace-nowrap">GPU の設定</span> を <span class="font-medium whitespace-nowrap">高パフォーマンス</span> にします。'
              images:
                - src: graphics-settings-chrome-3.png
                  alt: Google Chrome が強調されたグラフィック設定画面
            - number: 4
              title: ブラウザーを再起動し、必要なら PC も再起動する
              paragraphs_html:
                - "Chrome を閉じて開き直してください。改善しない場合はパソコンを再起動します。"
              images: []
          troubleshooting:
            title: 変化がないとき
            items:
              - label: "バッテリー駆動中？"
                body_html: ノート PC によっては、バッテリー時に省電力 GPU を優先し続けることがあります。電源に接続して試してください。
              - label: GPU ドライバーを更新
                body_html: GPU メーカーのアプリ（NVIDIA / AMD / Intel）または Windows Update から更新します。
              - label: 設定を戻す
                body_html: 'グラフィック設定で Chrome を <em>Windows に任せる</em> に戻してから、もう一度手順を行ってください。'
        edge:
          tab_label: Microsoft Edge
          detected_label: Microsoft Edge
          tab_accent: violet
          title: Edge に高性能 GPU を使わせる
          steps:
            - number: 1
              title: グラフィック設定を開く
              paragraphs_html:
                - '<a href="ms-settings:display-advancedgraphics" class="underline">こちらのリンク</a>から開くか、<span class="font-medium">設定 → システム → ディスプレイ → グラフィック</span> に進みます。'
                - '一覧の中から <span class="font-medium">Microsoft Edge</span> を探します（スクロールが必要な場合があります）。すでに見つかる場合は <a href="#step3-edge" class="underline">手順 3</a> へ進んでください。'
              images:
                - src: graphics-settings.png
                  alt: 設定 → システム → ディスプレイ → グラフィック 画面
            - number: 2
              title: 見当たらない場合は Edge を追加する
              paragraphs_html:
                - "Edge が表示されない場合:"
              instructions_html:
                - '<span class="font-medium">デスクトップ アプリを追加</span> を押します。'
                - '下の <span class="font-medium">ファイル名</span> 欄に、<span class="font-medium">以下のいずれかのパス</span> を貼り付けます。'
                - '<span class="font-medium">Enter</span> を押すか、<span class="font-medium">追加</span> を押します。'
              note_html: 1 つ目のパスでエラーになる場合は次を試してください。
              copy_paths:
                - 'C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe'
                - 'C:\Program Files\Microsoft\Edge\Application\msedge.exe'
              images:
                - src: graphics-settings-2.png
                  alt: グラフィック設定で デスクトップ アプリを追加 ボタンが強調された画面
                - src: file-picker-2.png
                  alt: ファイル名欄が強調されたファイル選択画面
            - number: 3
              anchor_id: step3-edge
              title_html: 'Edge で <em>高パフォーマンス</em> を選ぶ'
              paragraphs_html:
                - '一覧で <span class="font-medium">Microsoft Edge</span> を見つけて <span class="font-medium">オプション</span> を開き、<span class="font-medium whitespace-nowrap">GPU の設定</span> を <span class="font-medium whitespace-nowrap">高パフォーマンス</span> にします。'
              images:
                - src: graphics-settings-edge-3.png
                  alt: Microsoft Edge が強調されたグラフィック設定画面
            - number: 4
              title: ブラウザーを再起動し、必要なら PC も再起動する
              paragraphs_html:
                - "Edge を閉じて開き直してください。改善しない場合はパソコンを再起動します。"
              images: []
          troubleshooting:
            title: 変化がないとき
            items:
              - label: "バッテリー駆動中？"
                body_html: ノート PC によっては、バッテリー時に省電力 GPU を優先し続けることがあります。電源に接続して試してください。
              - label: GPU ドライバーを更新
                body_html: GPU メーカーのアプリ（NVIDIA / AMD / Intel）または Windows Update から更新します。
              - label: 設定を戻す
                body_html: 'グラフィック設定で Edge を <em>Windows に任せる</em> に戻してから、もう一度手順を行ってください。'
