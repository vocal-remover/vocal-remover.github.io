overview:
  title: ボーカル リムーバーとは？
  paragraphs:
    - "ボーカル リムーバーを使えば、複雑な音声ソフトなしで、どんなサイトでも曲からボーカルを外し、パソコン上で声と伴奏を分離できます。カラオケ、リミックス、練習、レッスン、コンテンツ制作といった実践的な場面向けに作られています。"
    - "ボーカル リムーバーでできること:"
  bullets:
    - 曲からボーカルを外して、きれいな伴奏を作る。
    - 声を分離して、歌い回しやハーモニー、重なりを確認する。
    - カラオケ用トラックや伴奏、教材を用意する。
    - ポッドキャストや動画から背景音楽を取り除く。
  versions_intro: "ボーカル リムーバーには 2 つのバージョンがあります:"
  online_link_label: ボーカル リムーバー Online
  online_link_suffix: サイト向けブラウザー拡張機能と、
  offline_link_label: ボーカル リムーバー Offline
  offline_link_suffix: ファイル向けの iPhone、iPad、Mac アプリです。
online:
  title: ボーカル リムーバー Online
  paragraphs:
    - ボーカル リムーバーを使えば、AI ベースの分離でオンライン再生中のトラックからボーカルを手早く外せます。
    - ボーカル リムーバー Online はブラウザーにそのまま追加できます。YouTube の動画や多くの音声サイトで、数クリックでボーカルを外せます。
  bullets:
    - あらゆるサイトで再生中の曲からオンラインでボーカルを外せる。
    - YouTube でもほかの音楽プラットフォームでも使える。
    - ファイルをダウンロードしたりアップロードしたりせずに伴奏を作れる。
    - AI 分離で高品質な結果を得られる。
    - カラオケ、カバー、リミックス、練習用トラックに向いている。
  perfect_for_label: "おすすめ:"
  perfect_for_text: カラオケ好き、シンガー、ボーカルコーチ、先生、クリエイター、オンライン動画で練習する人。
  pricing_template: "無料トライアル後: WEEKLY_PRICE、YEARLY_PRICE、または LIFETIME_PRICE。"
  offer_templates:
    weekly: "週額 $PRICE_VALUE"
    yearly: "年額 $PRICE_VALUE"
    lifetime: "買い切り $PRICE_VALUE"
  cta: ボーカル リムーバーをブラウザーに追加
  image_alt: ボーカル リムーバー拡張機能をインストールして、Chrome に数秒で追加できます。
offline:
  title: ボーカル リムーバー Offline
  paragraphs:
    - ボーカル リムーバーは曲からボーカルを外し、声と伴奏を数秒で分離します。複数ファイルをまとめて処理して、きれいな伴奏を用意できます。
    - 1 曲でもフォルダーごとでもドラッグすると、iPhone、iPad、Mac 向けのボーカル リムーバーが各曲をボーカルとインストゥルメンタルのステムに分けます。速度、精度、オフライン処理を重視した設計です。
  bullets:
    - 密度の高いミックスでも精度の高い AI 分離。
    - 作業を続けながら数十曲、数百曲を処理できるバッチモード。
    - WAV、AIFF、MP3、FLAC、M4A などに対応。
    - アカウント不要、アップロード待ちなしのオフライン処理。
  perfect_for_label: "おすすめ:"
  perfect_for_text: プロデューサー、DJ、ポッドキャスター、先生、ローカル音声ファイルを扱う音楽家。
  pricing_template: "無料トライアル後: WEEKLY_PRICE または YEARLY_PRICE。"
  offer_templates:
    weekly: "週額 $PRICE_VALUE"
    yearly: "年額 $PRICE_VALUE"
  cta: ボーカル リムーバーを iPhone、iPad、Mac に追加
  image_alt: ボーカル リムーバーをダウンロードして、伴奏とボーカルステムをすばやく準備しましょう。
use_cases:
  title: ボーカル リムーバーを使うのは？
  items:
    - title: シンガーとカラオケ好き
      body: どんな曲でもすぐにカラオケ版にできます。自分に合うキーで練習し、セットリストを準備し、別の伴奏を探し回らずにリハーサルできます。
    - title: プロデューサーと DJ
      body: リミックス、エディット、マッシュアップ用に、きれいな伴奏とボーカルを取り出せます。DAW やライブセット向けのステムもすぐに用意できます。
    - title: 先生と学習者
      body: レッスン、耳コピ、採譜向けにシンプルなトラックを作れます。ボーカルを分離して歌い回しを確認したり、外して上から演奏や歌唱をしたりできます。
    - title: ポッドキャスターとクリエイター
      body: 話し声の下にある音楽を外し、イントロやアウトロを整え、編集や再利用に向けてわかりやすいステムを用意できます。
faq:
  title: よくある質問
  items:
    - question: ボーカル リムーバー拡張機能が遅い、または不安定です。どうすればいいですか？
      answers:
        - Windows の一部のパソコン、とくにノート PC では、ブラウザーに高速な GPU ではなく省電力 GPU が割り当てられることがあります。ボーカル リムーバーは音声をリアルタイム処理するため、動作が重くなったり、音が途切れたり、うまく動かなくなる原因になります。
      answer_html: 'Windows に対して、ブラウザーに高性能 GPU を使うよう指定できます。スクリーンショット付きの手順はこちらです: <a href="/ja/blog/set-high-performance-gpu-for-chrome-edge-on-windows/" class="underline">Windows で Chrome と Edge に高性能 GPU を選ぶ</a>。手順どおりにしても改善しない場合は、パソコンやブラウザーの性能がリアルタイム処理に足りない可能性があります。その場合は、より高性能な環境でボーカル リムーバーを試してください。'
    - question: ボーカル リムーバー Online と Offline の違いは？
      answers:
        - ボーカル リムーバー Online は、YouTube などのサイト上で再生中の音声や動画から直接ボーカルを外せるブラウザー拡張機能です。
        - ボーカル リムーバー Offline は、iPhone、iPad、Mac 向けの単体アプリで、自分の音声ファイルを完全オフラインで扱え、フォルダー単位でまとめて処理できます。
    - question: 音声ファイルをアップロードする必要はありますか？
      answers:
        - アップロードは不要です。
        - 拡張機能は再生中の音をブラウザー内でそのまま処理し、iPhone、iPad、Mac 向けアプリはパソコン上のファイルをローカルで扱います。サーバー経由ではありません。
    - question: ボーカル リムーバー Offline はどの音声形式に対応していますか？
      answers:
        - iPhone、iPad、Mac 向けのボーカル リムーバーは WAV、AIFF、MP3、FLAC、M4A などの一般的な形式に対応しています。変換しなくても手元のファイルをそのまま分離できます。動画、フォルダー、DAW のリージョンをドラッグすると、アプリが自動で音声を取り出します。
    - question: ボーカルを外すと音質は落ちますか？
      answers:
        - ボーカル リムーバーは、伴奏を自然で音楽的に保つことを目指した AI 分離を使っています。
        - Offline 版は曲全体を見ながら処理でき、計算資源も多いため、より高い品質を出しやすいです。
        - とても複雑だったりノイズの多いミックスではアーティファクトが出ることもありますが、通常の曲ならかなりきれいに分離できます。
    - question: 曲のキーも変えられますか？
      linked_answers:
        - tool_key: pitch_changer
          template: はい。TOOL_LINK を使えば、オンラインでもオフラインでも曲のピッチやキーを変更できます。ボーカル リムーバーと一緒に使うと便利です。
    - question: 曲のテンポを変えるには？
      answers: []
      linked_answers:
        - tool_key: bpm_extension
          template: サイトで再生中の音楽をそのまま遅くしたり速くしたりしたいなら、TOOL_LINK を使ってください。
        - tool_key: speed_tool
          template: 手元のファイルのテンポだけを変えてピッチを保ちたいなら、TOOL_LINK を使ってください。
    - question: 無料トライアルはありますか？ 料金はどうなりますか？
      answers:
        - 拡張機能にも iPhone、iPad、Mac 向けアプリにも無料トライアルがあります。カードは不要です。
        - トライアル後、ボーカル リムーバー Online では週額、年額、買い切り、Offline では週額と年額のプランが使えます。詳しくは上の料金表示をご覧ください。
        - 決済は拡張機能では Paddle、アプリでは Apple により安全に処理されます。
    - question: サブスクリプションはどうやって解約しますか？
      answers:
        - アプリまたは拡張機能内の「Manage Subscription」ボタンを押して案内に従ってください。
        - すべて自動化されているので、電話やメールは必要ありません。
    - question: ボーカル リムーバーはどんな人向けですか？
      answers:
        - ボーカル リムーバーは、シンガー、音楽家、プロデューサー、DJ、先生、クリエイターなど、声と音楽を分けたい人向けです。
        - カラオケの準備でも、授業でも、セリフ編集でも、リミックス制作でも、すばやく使いやすいステムを作れます。
