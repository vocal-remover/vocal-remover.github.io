overview:
  title: Was ist Vocal Remover?
  paragraphs:
    - "Mit Vocal Remover kannst du Gesang auf jeder Website aus einem Song entfernen und Stimme und Musik auf deinem Computer trennen, ohne komplizierte Audio-Software. Das Werkzeug ist für echte Alltagssituationen gedacht: Karaoke, Remixe, Üben, Unterrichten und Content-Arbeit."
    - "Mit Vocal Remover kannst du:"
  bullets:
    - Gesang aus einem Song entfernen und eine saubere Instrumentalspur erhalten.
    - Stimmen isolieren, um Phrasierung, Harmonien und Layer zu analysieren.
    - Karaoke-Tracks, Backing-Tracks und Unterrichtsmaterial vorbereiten.
    - Podcasts und Videos bereinigen, indem Hintergrundmusik entfernt wird.
  versions_intro: "Vocal Remover gibt es in zwei Versionen:"
  online_link_label: Vocal Remover Online
  online_link_suffix: als Erweiterung für Websites, und
  offline_link_label: Vocal Remover Offline
  offline_link_suffix: als App für iPhone, iPad und Mac für Dateien.
online:
  title: Vocal Remover Online
  paragraphs:
    - Nutze Vocal Remover, um deine Spur online zu bereinigen und Gesang aus einem Song mit diesem AI-basierten Vocal Remover zu entfernen.
    - Vocal Remover Online fügt die Gesangstrennung direkt in deinen Browser ein. Entferne Gesang aus YouTube-Videos und vielen anderen Audio-Websites mit nur wenigen Klicks.
  bullets:
    - Entferne Gesang aus einem Song online direkt auf jeder Website.
    - Funktioniert als YouTube-Vocal-Remover-Erweiterung und auf anderen Musikplattformen.
    - Erhalte saubere Instrumentalspuren ohne Download oder Upload von Dateien.
    - AI-Vocal-Remover-Technologie für hochwertige Trennung.
    - Ideal für Karaoke, Cover, Remixe und Begleitspuren.
  perfect_for_label: "Ideal für:"
  perfect_for_text: Karaoke-Fans, Sängerinnen und Sänger, Vocal Coaches, Lehrkräfte, Creator und alle, die mit Online-Videos üben.
  pricing_template: "Nach der kostenlosen Testphase: WEEKLY_PRICE, YEARLY_PRICE oder LIFETIME_PRICE."
  offer_templates:
    weekly: "$PRICE_VALUE pro Woche"
    yearly: "$PRICE_VALUE pro Jahr"
    lifetime: "einmalige Zahlung von $PRICE_VALUE"
  cta: Vocal Remover zum Browser hinzufügen
  image_alt: Installiere die Vocal-Remover-Erweiterung und füge sie in wenigen Sekunden zu Chrome hinzu.
offline:
  title: Vocal Remover Offline
  paragraphs:
    - Vocal Remover entfernt Gesang aus Songs und trennt Stimme und Musik in Sekunden. Verarbeite mehrere Dateien auf einmal und erhalte saubere Instrumentalspuren.
    - Ziehe einen einzelnen Song oder einen ganzen Ordner hinein, und Vocal Remover für iPhone, iPad oder Mac teilt jeden Track in Vocal- und Instrumental-Stems. Das Ganze ist auf Tempo, Präzision und Offline-Arbeit mit deinen Dateien ausgelegt.
  bullets:
    - Präzise AI-Trennung auch bei dichten Arrangements.
    - Batch-Modus für Dutzende oder Hunderte Songs, während du weiterarbeitest.
    - Unterstützt WAV, AIFF, MP3, FLAC, M4A und mehr.
    - Offline-Verarbeitung ohne Konto und ohne Upload-Wartezeiten.
  perfect_for_label: "Ideal für:"
  perfect_for_text: Produzentinnen und Produzenten, DJs, Podcaster, Lehrkräfte und Musikerinnen und Musiker mit lokalen Audiodateien.
  pricing_template: "Nach der kostenlosen Testphase: WEEKLY_PRICE oder YEARLY_PRICE."
  offer_templates:
    weekly: "$PRICE_VALUE pro Woche"
    yearly: "$PRICE_VALUE pro Jahr"
  cta: Vocal Remover zu iPhone, iPad oder Mac hinzufügen
  image_alt: Lade Vocal Remover herunter und bereite Instrumentals und Vocal-Stems in einem schnellen Workflow vor.
use_cases:
  title: Wer nutzt Vocal Remover?
  items:
    - title: Sängerinnen, Sänger und Karaoke-Fans
      body: Verwandle jeden Track sofort in eine Karaoke-Version. Übe in deiner Tonart, stelle Setlisten zusammen und probe ohne lange nach separaten Instrumentals zu suchen.
    - title: Produzentinnen, Produzenten und DJs
      body: Ziehe saubere Instrumentals und Vocals für Remixe, Edits und Mashups heraus. Bereite Stems für deine DAW oder für Live-Sets in wenigen Klicks vor.
    - title: Lehrkräfte und Lernende
      body: Erstelle reduzierte Tracks für Unterricht, Gehörbildung und Transkription. Isoliere Stimmen zum Analysieren oder nimm sie heraus, damit Schülerinnen und Schüler darüber singen oder spielen können.
    - title: Podcaster und Creator
      body: Entferne Musik unter Sprache, bereinige Intros und Outros und bereite klare Stems für Schnitt und Weiterverwendung vor.
faq:
  title: Häufige Fragen
  items:
    - question: Die Vocal-Remover-Erweiterung ist langsam oder ruckelt. Was kann ich tun?
      answers:
        - Auf manchen Windows-Computern, besonders auf Laptops, wählt Windows für deinen Browser die stromsparende Grafikeinheit statt der schnellen. Weil Vocal Remover Audio in Echtzeit verarbeitet, kann das zu Verzögerungen, stotterndem Ton oder kompletten Aussetzern führen.
      answer_html: 'Du kannst Windows anweisen, für deinen Browser die Hochleistungs-Grafikeinheit zu verwenden. Hier findest du eine Schritt-für-Schritt-Anleitung mit Screenshots: <a href="/de/blog/set-high-performance-gpu-for-chrome-edge-on-windows/" class="underline">Leistungsstarke Grafik für Chrome und Edge unter Windows auswählen</a>. Wenn es danach immer noch nicht besser wird, sind dein Computer oder Browser möglicherweise einfach zu schwach für Echtzeitverarbeitung. Dann probiere Vocal Remover nach Möglichkeit auf einem leistungsstärkeren System.'
    - question: Was ist der Unterschied zwischen Vocal Remover Online und Vocal Remover Offline?
      answers:
        - Vocal Remover Online ist eine Browser-Erweiterung, die Gesang direkt auf Websites wie YouTube und anderen Audio- oder Videoplattformen entfernt.
        - Vocal Remover Offline ist eine eigenständige App für iPhone, iPad und Mac, die vollständig offline mit deinen Audiodateien arbeitet und ganze Ordner im Batch verarbeiten kann.
    - question: Muss ich Audiodateien hochladen?
      answers:
        - Du musst nichts hochladen.
        - Die Erweiterung verarbeitet Audio direkt im Browser während der Wiedergabe, und die App für iPhone, iPad oder Mac arbeitet lokal mit Dateien auf deinem Computer, ganz ohne Server.
    - question: Welche Audioformate unterstützt Vocal Remover Offline?
      answers:
        - Vocal Remover für iPhone, iPad oder Mac unterstützt gängige Formate wie WAV, AIFF, MP3, FLAC, M4A und mehr, sodass du vorhandene Dateien direkt trennen kannst. Du kannst außerdem Videos, Ordner oder Regionen aus deiner DAW hineinziehen, und die App extrahiert den Ton automatisch.
    - question: Beeinflusst das Entfernen von Gesang die Audioqualität?
      answers:
        - Vocal Remover verwendet eine AI-Trennung, die Instrumentals sauber und musikalisch halten soll.
        - Die Offline-Version liefert bessere Qualität, weil sie den ganzen Song bei der Verarbeitung sieht und mehr Rechenressourcen hat.
        - Sehr komplexe oder verrauschte Mischungen können trotzdem Artefakte zeigen, aber typische Songs lassen sich sehr gut trennen.
    - question: Kann ich auch die Tonart von Songs ändern?
      linked_answers:
        - tool_key: pitch_changer
          template: Ja, nutze TOOL_LINK, um Tonhöhe und Tonart von Songs online oder offline zu ändern. Das passt sehr gut zu Vocal Remover.
    - question: Wie kann ich das Tempo eines Songs ändern?
      answers: []
      linked_answers:
        - tool_key: bpm_extension
          template: Wenn du Musik auf einer Website verlangsamen oder beschleunigen willst, während sie schon läuft, nutze TOOL_LINK.
        - tool_key: speed_tool
          template: Wenn du das Tempo deiner eigenen Datei ändern willst, ohne die Tonhöhe zu verschieben, nutze TOOL_LINK.
    - question: Gibt es eine kostenlose Testphase? Wie funktioniert die Preisgestaltung?
      answers:
        - Sowohl die Erweiterung als auch die App für iPhone, iPad und Mac enthalten eine kostenlose Testphase. Keine Karte nötig.
        - Nach der Testphase bietet Vocal Remover Online Wochen-, Jahres- und Einmal-Kaufoptionen, während Vocal Remover Offline Wochen- und Jahresabos bietet, wie oben aufgeführt.
        - Alle Zahlungen werden sicher über Paddle für die Erweiterung oder Apple für die App abgewickelt.
    - question: Wie kündige ich mein Abo?
      answers:
        - Klicke einfach in der App oder Erweiterung auf „Manage Subscription“ und folge den Schritten.
        - Der Ablauf ist vollständig automatisch, du musst also weder anrufen noch E-Mails schreiben.
    - question: Für wen ist Vocal Remover gedacht?
      answers:
        - Vocal Remover ist für Sängerinnen und Sänger, Musikerinnen und Musiker, Produzentinnen und Produzenten, DJs, Lehrkräfte, Creator und alle gedacht, die Stimme und Musik trennen müssen.
        - "Ob du Karaoke vorbereitest, Unterrichtsmaterial erstellst, Dialog bearbeitest oder Remixe baust: Du bekommst schnell saubere Stems."
