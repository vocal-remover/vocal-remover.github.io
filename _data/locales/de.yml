pages:
  gpu_guide:
    meta:
      title: "Leistungsstarke Grafik für Chrome und Edge unter Windows auswählen"
      description: "Wenn Vocal Remover unter Windows langsam oder instabil ist, weise Chrome oder Edge mit dieser Schritt-für-Schritt-Anleitung die leistungsstarke Grafikeinheit zu."
      og_title: "Leistungsstarke Grafik für Chrome und Edge unter Windows auswählen"
      og_description: "Wenn Vocal Remover unter Windows langsam oder instabil ist, weise Chrome oder Edge mit dieser Schritt-für-Schritt-Anleitung die leistungsstarke Grafikeinheit zu."
      og_type: article
      og_image: /blog/set-high-performance-gpu-for-chrome-edge-on-windows/graphics-settings-chrome-3.png
    guide:
      extension_link_label: Vocal-Remover-Erweiterung
      page_title: Lass Windows die schnelle Grafikeinheit für deinen Browser verwenden
      intro_html:
        - "EXTENSION_LINK führt rechenintensive Vorgänge in Echtzeit aus und braucht deshalb eine schnelle Grafikeinheit für flüssiges Arbeiten. Auch wenn es hier um Audio geht, nutzen moderne Browser die Grafikeinheit im Hintergrund, um schwere Berechnungen zu beschleunigen, und Vocal Remover braucht das."
        - "Auf manchen Computern, besonders auf Laptops, wählt Windows für deinen Browser die stromsparende Grafikeinheit. Das kann zu Verzögerungen, Aussetzern oder kompletten Problemen mit Vocal Remover führen. Diese Anleitung sagt Windows, dass es die leistungsstarke Grafikeinheit für deinen Browser verwenden soll."
      detected_browser_label: Erkannter Browser
      unknown_browser_label: Unbekannt
      back_home_label: Zurück zur Startseite
      copy_button:
        idle: Kopieren
        success: Kopiert!
      browsers:
        chrome:
          tab_label: Google Chrome
          detected_label: Google Chrome
          tab_accent: blue
          title: Chrome auf die leistungsstarke Grafikeinheit setzen
          steps:
            - number: 1
              title: Grafikeinstellungen öffnen
              paragraphs_html:
                - 'Öffne die Einstellungen <a href="ms-settings:display-advancedgraphics" class="underline">über diesen Link</a> oder gehe zu <span class="font-medium">Einstellungen → System → Anzeige → Grafik</span>.'
                - 'Suche in der Liste nach <span class="font-medium">Google Chrome</span> (du musst vielleicht scrollen). Wenn Chrome schon dort ist, gehe zu <a href="#step3-chrome" class="underline">Schritt 3</a>.'
              images:
                - src: graphics-settings.png
                  alt: Bildschirm Einstellungen → System → Anzeige → Grafik
            - number: 2
              title: Chrome zur Liste hinzufügen, falls es fehlt
              paragraphs_html:
                - "Wenn Chrome nicht in der Liste steht:"
              instructions_html:
                - 'Klicke auf <span class="font-medium">Desktop-App hinzufügen</span>.'
                - 'Unten im Feld <span class="font-medium">Dateiname</span> <span class="font-medium">füge eine der folgenden Zeilen ein</span>.'
                - 'Drücke <span class="font-medium">Enter</span> oder klicke auf <span class="font-medium">Hinzufügen</span>.'
              note_html: Wenn die erste Zeile einen Fehler zeigt, probiere die nächste.
              copy_paths:
                - '%LocalAppData%\Google\Chrome\Application\chrome.exe'
                - 'C:\Program Files (x86)\Google\Chrome\Application\chrome.exe'
                - 'C:\Program Files\Google\Chrome\Application\chrome.exe'
              images:
                - src: graphics-settings-2.png
                  alt: Grafik-Einstellungen mit hervorgehobener Schaltfläche Desktop-App hinzufügen
                - src: file-picker-2.png
                  alt: Dateiauswahl mit hervorgehobenem Feld Dateiname
            - number: 3
              anchor_id: step3-chrome
              title_html: 'Für Chrome <em>Hohe Leistung</em> wählen'
              paragraphs_html:
                - 'Suche <span class="font-medium">Google Chrome</span> in der Liste, öffne die <span class="font-medium">Optionen</span> der App und setze <span class="font-medium whitespace-nowrap">GPU-Präferenz</span> auf <span class="font-medium whitespace-nowrap">Hohe Leistung</span>.'
              images:
                - src: graphics-settings-chrome-3.png
                  alt: Grafik-Einstellungen mit hervorgehobenem Google Chrome
            - number: 4
              title: Browser neu starten und wenn nötig den Computer
              paragraphs_html:
                - "Schließe Chrome und öffne es erneut. Wenn das nicht hilft, starte den Computer neu."
              images: []
          troubleshooting:
            title: Wenn du keinen Unterschied merkst
            items:
              - label: "Laptop im Akkubetrieb?"
                body_html: Manche Laptops bevorzugen im Akkubetrieb weiterhin die stromsparende Grafikeinheit. Schließe ihn testweise&nbsp;an.
              - label: Grafiktreiber aktualisieren
                body_html: über die App des GPU-Herstellers (NVIDIA / AMD / Intel) oder über Windows Update.
              - label: Zurücksetzen
                body_html: 'Setze Chrome in den Grafikeinstellungen wieder auf <em>Windows entscheiden lassen</em> und wiederhole die Schritte.'
        edge:
          tab_label: Microsoft Edge
          detected_label: Microsoft Edge
          tab_accent: violet
          title: Edge auf die leistungsstarke Grafikeinheit setzen
          steps:
            - number: 1
              title: Grafikeinstellungen öffnen
              paragraphs_html:
                - 'Öffne die Einstellungen <a href="ms-settings:display-advancedgraphics" class="underline">über diesen Link</a> oder gehe zu <span class="font-medium">Einstellungen → System → Anzeige → Grafik</span>.'
                - 'Suche in der Liste nach <span class="font-medium">Microsoft Edge</span> (du musst vielleicht scrollen). Wenn Edge schon dort ist, gehe zu <a href="#step3-edge" class="underline">Schritt 3</a>.'
              images:
                - src: graphics-settings.png
                  alt: Bildschirm Einstellungen → System → Anzeige → Grafik
            - number: 2
              title: Edge zur Liste hinzufügen, falls es fehlt
              paragraphs_html:
                - "Wenn Edge nicht in der Liste steht:"
              instructions_html:
                - 'Klicke auf <span class="font-medium">Desktop-App hinzufügen</span>.'
                - 'Unten im Feld <span class="font-medium">Dateiname</span> <span class="font-medium">füge eine der folgenden Zeilen ein</span>.'
                - 'Drücke <span class="font-medium">Enter</span> oder klicke auf <span class="font-medium">Hinzufügen</span>.'
              note_html: Wenn die erste Zeile einen Fehler zeigt, probiere die nächste.
              copy_paths:
                - 'C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe'
                - 'C:\Program Files\Microsoft\Edge\Application\msedge.exe'
              images:
                - src: graphics-settings-2.png
                  alt: Grafik-Einstellungen mit hervorgehobener Schaltfläche Desktop-App hinzufügen
                - src: file-picker-2.png
                  alt: Dateiauswahl mit hervorgehobenem Feld Dateiname
            - number: 3
              anchor_id: step3-edge
              title_html: 'Für Edge <em>Hohe Leistung</em> wählen'
              paragraphs_html:
                - 'Suche <span class="font-medium">Microsoft Edge</span> in der Liste, öffne die <span class="font-medium">Optionen</span> der App und setze <span class="font-medium whitespace-nowrap">GPU-Präferenz</span> auf <span class="font-medium whitespace-nowrap">Hohe Leistung</span>.'
              images:
                - src: graphics-settings-edge-3.png
                  alt: Grafik-Einstellungen mit hervorgehobenem Microsoft Edge
            - number: 4
              title: Browser neu starten und wenn nötig den Computer
              paragraphs_html:
                - "Schließe Edge und öffne es erneut. Wenn das nicht hilft, starte den Computer neu."
              images: []
