pages:
  gpu_guide:
    meta:
      title: "Windows에서 Chrome과 Edge에 고성능 그래픽 칩 선택하기"
      description: "Windows에서 Vocal Remover가 느리거나 버벅인다면, 단계별 가이드를 따라 Chrome 또는 Edge가 고성능 그래픽 칩을 사용하도록 설정해 보세요."
      og_title: "Windows에서 Chrome과 Edge에 고성능 그래픽 칩 선택하기"
      og_description: "Windows에서 Vocal Remover가 느리거나 버벅인다면, 단계별 가이드를 따라 Chrome 또는 Edge가 고성능 그래픽 칩을 사용하도록 설정해 보세요."
      og_type: article
      og_image: /blog/set-high-performance-gpu-for-chrome-edge-on-windows/graphics-settings-chrome-3.png
    guide:
      extension_link_label: Vocal Remover 확장 프로그램
      page_title: Windows에서 브라우저가 더 빠른 그래픽 칩을 사용하게 만들기
      intro_html:
        - EXTENSION_LINK는 실시간으로 많은 계산을 수행하기 때문에 부드럽게 작동하려면 빠른 그래픽 칩이 필요합니다. 오디오 처리처럼 보여도 최신 브라우저는 무거운 계산을 가속하기 위해 뒤에서 그래픽 칩을 활용하며, Vocal Remover도 그 성능이 필요합니다.
        - 일부 컴퓨터, 특히 노트북에서는 Windows가 브라우저에 절전용 그래픽 칩을 할당할 수 있습니다. 이 경우 속도 저하, 소리 끊김, 또는 Vocal Remover 확장 프로그램의 완전한 오작동이 생길 수 있습니다. 이 가이드는 브라우저가 고성능 그래픽 칩을 사용하도록 설정하는 방법을 설명합니다.
      detected_browser_label: 감지된 브라우저
      unknown_browser_label: 알 수 없음
      back_home_label: 홈으로 돌아가기
      copy_button:
        idle: 복사
        success: 복사됨!
      browsers:
        chrome:
          tab_label: Google Chrome
          detected_label: Google Chrome
          tab_accent: blue
          title: Chrome이 고성능 그래픽 칩을 사용하도록 설정하기
          steps:
            - number: 1
              title: Graphics 설정 열기
              paragraphs_html:
                - '<a href="ms-settings:display-advancedgraphics" class="underline">여기를 클릭</a>해 설정을 열거나, <span class="font-medium">Settings → System → Display → Graphics</span>로 이동하세요.'
                - '목록에서 <span class="font-medium">Google Chrome</span>를 찾으세요(스크롤이 필요할 수 있습니다). 보이면 <a href="#step3-chrome" class="underline">3단계</a>로 바로 이동하세요.'
              images:
                - src: graphics-settings.png
                  alt: Settings → System → Display → Graphics 화면
            - number: 2
              title: 목록에 Chrome 추가하기(없을 때만)
              paragraphs_html:
                - "목록에 Chrome이 없다면:"
              instructions_html:
                - '<span class="font-medium">Add desktop app</span>을 클릭하세요.'
                - '하단 <span class="font-medium">File name</span> 입력란에 아래 줄 중 하나를 붙여 넣으세요.'
                - '<span class="font-medium">Enter</span>를 누르거나 <span class="font-medium">Add</span>를 클릭하세요.'
              note_html: 첫 번째 줄에서 오류가 나오면 다음 줄을 시도하세요.
              copy_paths:
                - '%LocalAppData%\Google\Chrome\Application\chrome.exe'
                - 'C:\Program Files (x86)\Google\Chrome\Application\chrome.exe'
                - 'C:\Program Files\Google\Chrome\Application\chrome.exe'
              images:
                - src: graphics-settings-2.png
                  alt: Add desktop app 버튼이 강조된 Settings → System → Display → Graphics 화면
                - src: file-picker-2.png
                  alt: 파일 이름 입력란과 버튼이 강조된 파일 선택 창
            - number: 3
              anchor_id: step3-chrome
              title_html: Chrome에 <em>High Performance</em> 선택하기
              paragraphs_html:
                - '목록에서 <span class="font-medium">Google Chrome</span>를 찾으세요(스크롤이 필요할 수 있습니다). 항목을 클릭한 뒤 <span class="font-medium whitespace-nowrap">GPU preference</span>를 <span class="font-medium whitespace-nowrap">High Performance</span>로 설정하세요.'
              images:
                - src: graphics-settings-chrome-3.png
                  alt: Chrome이 강조된 Settings → System → Display → Graphics 화면
            - number: 4
              title: 브라우저를 다시 시작하고, 필요하면 컴퓨터도 재부팅하기
              paragraphs_html:
                - Chrome을 닫았다가 다시 열어 보세요. 그래도 해결되지 않으면 컴퓨터를 재시작해 보세요.
              images: []
          troubleshooting:
            title: 차이가 없다면
            items:
              - label: 배터리 모드의 노트북인가요?
                body_html: 일부 노트북은 배터리 사용 중 여전히 절전용 그래픽 칩을 우선합니다. 전원을 연결해 보세요.
              - label: 그래픽 드라이버 업데이트
                body_html: 그래픽 칩 제조사 앱(NVIDIA / AMD / Intel) 또는 Windows Update를 통해 업데이트해 보세요.
              - label: 재설정
                body_html: 'Graphics 설정에서 Chrome을 다시 <em>Let Windows decide</em>로 돌린 다음, 위 단계를 다시 따라 해 보세요.'
        edge:
          tab_label: Microsoft Edge
          detected_label: Microsoft Edge
          tab_accent: violet
          title: Edge가 고성능 그래픽 칩을 사용하도록 설정하기
          steps:
            - number: 1
              title: Graphics 설정 열기
              paragraphs_html:
                - '<a href="ms-settings:display-advancedgraphics" class="underline">여기를 클릭</a>해 설정을 열거나, <span class="font-medium">Settings → System → Display → Graphics</span>로 이동하세요.'
                - '목록에서 <span class="font-medium">Microsoft Edge</span>를 찾으세요(스크롤이 필요할 수 있습니다). 보이면 <a href="#step3-edge" class="underline">3단계</a>로 바로 이동하세요.'
              images:
                - src: graphics-settings.png
                  alt: Settings → System → Display → Graphics 화면
            - number: 2
              title: 목록에 Edge 추가하기(없을 때만)
              paragraphs_html:
                - "목록에 Edge가 없다면:"
              instructions_html:
                - '<span class="font-medium">Add desktop app</span>을 클릭하세요.'
                - '하단 <span class="font-medium">File name</span> 입력란에 아래 줄 중 하나를 붙여 넣으세요.'
                - '<span class="font-medium">Enter</span>를 누르거나 <span class="font-medium">Add</span>를 클릭하세요.'
              note_html: 첫 번째 줄에서 오류가 나오면 다음 줄을 시도하세요.
              copy_paths:
                - 'C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe'
                - 'C:\Program Files\Microsoft\Edge\Application\msedge.exe'
              images:
                - src: graphics-settings-2.png
                  alt: Add desktop app 버튼이 강조된 Settings → System → Display → Graphics 화면
                - src: file-picker-2.png
                  alt: 파일 이름 입력란과 버튼이 강조된 파일 선택 창
            - number: 3
              anchor_id: step3-edge
              title_html: Edge에 <em>High Performance</em> 선택하기
              paragraphs_html:
                - '목록에서 <span class="font-medium">Microsoft Edge</span>를 찾으세요(스크롤이 필요할 수 있습니다). 항목을 클릭한 뒤 <span class="font-medium whitespace-nowrap">GPU preference</span>를 <span class="font-medium whitespace-nowrap">High Performance</span>로 설정하세요.'
              images:
                - src: graphics-settings-edge-3.png
                  alt: Edge가 강조된 Settings → System → Display → Graphics 화면
            - number: 4
              title: 브라우저를 다시 시작하고, 필요하면 컴퓨터도 재부팅하기
              paragraphs_html:
                - Edge를 닫았다가 다시 열어 보세요. 그래도 해결되지 않으면 컴퓨터를 재시작해 보세요.
              images: []
          troubleshooting:
            title: 차이가 없다면
            items:
              - label: 배터리 모드의 노트북인가요?
                body_html: 일부 노트북은 배터리 사용 중 여전히 절전용 그래픽 칩을 우선합니다. 전원을 연결해 보세요.
              - label: 그래픽 드라이버 업데이트
                body_html: 그래픽 칩 제조사 앱(NVIDIA / AMD / Intel) 또는 Windows Update를 통해 업데이트해 보세요.
              - label: 재설정
                body_html: 'Graphics 설정에서 Edge를 다시 <em>Let Windows decide</em>로 돌린 다음, 위 단계를 다시 따라 해 보세요.'
