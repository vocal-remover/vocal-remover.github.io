pages:
  gpu_guide:
    meta:
      title: "Scegli la scheda grafica ad alte prestazioni per Chrome ed Edge (Windows)"
      description: "Se Vocal Remover su Windows e lento o instabile, assegna a Chrome o Edge la scheda grafica ad alte prestazioni con questa guida passo passo."
      og_title: "Scegli la scheda grafica ad alte prestazioni per Chrome ed Edge (Windows)"
      og_description: "Se Vocal Remover su Windows e lento o instabile, assegna a Chrome o Edge la scheda grafica ad alte prestazioni con questa guida passo passo."
      og_type: article
      og_image: /blog/set-high-performance-gpu-for-chrome-edge-on-windows/graphics-settings-chrome-3.png
    guide:
      extension_link_label: estensione Vocal Remover
      page_title: Fai usare a Windows la scheda grafica veloce per il browser
      intro_html:
        - "EXTENSION_LINK esegue calcoli pesanti in tempo reale, quindi ha bisogno di una scheda grafica veloce per lavorare in modo fluido. Anche se si parla di audio, i browser moderni usano la grafica dietro le quinte per accelerare i calcoli, e per Vocal Remover e importante."
        - "Su alcuni computer, soprattutto portatili, Windows puo scegliere per il browser la scheda grafica a risparmio energetico. Questo puo causare rallentamenti, audio che scatta o perfino impedire il corretto funzionamento di Vocal Remover. Questa guida dice a Windows di usare la scheda grafica ad alte prestazioni per il browser."
      detected_browser_label: Browser rilevato
      unknown_browser_label: Sconosciuto
      back_home_label: Torna alla home
      copy_button:
        idle: Copia
        success: Copiato!
      browsers:
        chrome:
          tab_label: Google Chrome
          detected_label: Google Chrome
          tab_accent: blue
          title: Imposta Chrome sulla scheda grafica ad alte prestazioni
          steps:
            - number: 1
              title: Apri le impostazioni Grafiche
              paragraphs_html:
                - 'Apri le impostazioni <a href="ms-settings:display-advancedgraphics" class="underline">da questo link</a> oppure vai in <span class="font-medium">Impostazioni → Sistema → Schermo → Grafica</span>.'
                - 'Nell''elenco cerca <span class="font-medium">Google Chrome</span> (potresti dover scorrere). Se lo vedi gia, passa al <a href="#step3-chrome" class="underline">Passo 3</a>.'
              images:
                - src: graphics-settings.png
                  alt: Schermata Impostazioni → Sistema → Schermo → Grafica
            - number: 2
              title: Aggiungi Chrome all'elenco se non c'e
              paragraphs_html:
                - "Se non trovi Chrome:"
              instructions_html:
                - 'Fai clic su <span class="font-medium">Aggiungi app desktop</span>.'
                - 'In basso, nel campo <span class="font-medium">Nome file</span>, <span class="font-medium">incolla una delle righe</span> qui sotto.'
                - 'Premi <span class="font-medium">Invio</span> oppure fai clic su <span class="font-medium">Aggiungi</span>.'
              note_html: Se la prima riga restituisce un errore, prova la successiva.
              copy_paths:
                - '%LocalAppData%\Google\Chrome\Application\chrome.exe'
                - 'C:\Program Files (x86)\Google\Chrome\Application\chrome.exe'
                - 'C:\Program Files\Google\Chrome\Application\chrome.exe'
              images:
                - src: graphics-settings-2.png
                  alt: Schermata Grafica con il pulsante Aggiungi app desktop evidenziato
                - src: file-picker-2.png
                  alt: Finestra di selezione file con il campo del nome file evidenziato
            - number: 3
              anchor_id: step3-chrome
              title_html: 'Scegli <em>Prestazioni elevate</em> per Chrome'
              paragraphs_html:
                - 'Trova <span class="font-medium">Google Chrome</span> nell''elenco, apri le <span class="font-medium">Opzioni</span> dell''app e imposta <span class="font-medium whitespace-nowrap">Preferenza GPU</span> su <span class="font-medium whitespace-nowrap">Prestazioni elevate</span>.'
              images:
                - src: graphics-settings-chrome-3.png
                  alt: Schermata Grafica con Google Chrome evidenziato
            - number: 4
              title: Riavvia il browser e, se serve, il computer
              paragraphs_html:
                - "Chiudi Chrome e riaprilo. Se non basta, prova a riavviare il computer."
              images: []
          troubleshooting:
            title: Se non noti differenze
            items:
              - label: "Portatile a batteria?"
                body_html: Su alcuni portatili Windows continua a preferire la grafica a risparmio energetico quando non sono collegati alla corrente. Prova a collegarlo&nbsp;all'alimentazione.
              - label: Aggiorna i driver grafici
                body_html: tramite l'app del produttore della GPU (NVIDIA / AMD / Intel) oppure con Windows Update.
              - label: Reimposta
                body_html: 'Nelle impostazioni Grafiche rimetti Chrome su <em>Lascia decidere a Windows</em>, poi ripeti i passaggi.'
        edge:
          tab_label: Microsoft Edge
          detected_label: Microsoft Edge
          tab_accent: violet
          title: Imposta Edge sulla scheda grafica ad alte prestazioni
          steps:
            - number: 1
              title: Apri le impostazioni Grafiche
              paragraphs_html:
                - 'Apri le impostazioni <a href="ms-settings:display-advancedgraphics" class="underline">da questo link</a> oppure vai in <span class="font-medium">Impostazioni → Sistema → Schermo → Grafica</span>.'
                - 'Nell''elenco cerca <span class="font-medium">Microsoft Edge</span> (potresti dover scorrere). Se lo vedi gia, passa al <a href="#step3-edge" class="underline">Passo 3</a>.'
              images:
                - src: graphics-settings.png
                  alt: Schermata Impostazioni → Sistema → Schermo → Grafica
            - number: 2
              title: Aggiungi Edge all'elenco se non c'e
              paragraphs_html:
                - "Se non trovi Edge:"
              instructions_html:
                - 'Fai clic su <span class="font-medium">Aggiungi app desktop</span>.'
                - 'In basso, nel campo <span class="font-medium">Nome file</span>, <span class="font-medium">incolla una delle righe</span> qui sotto.'
                - 'Premi <span class="font-medium">Invio</span> oppure fai clic su <span class="font-medium">Aggiungi</span>.'
              note_html: Se la prima riga restituisce un errore, prova la successiva.
              copy_paths:
                - 'C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe'
                - 'C:\Program Files\Microsoft\Edge\Application\msedge.exe'
              images:
                - src: graphics-settings-2.png
                  alt: Schermata Grafica con il pulsante Aggiungi app desktop evidenziato
                - src: file-picker-2.png
                  alt: Finestra di selezione file con il campo del nome file evidenziato
            - number: 3
              anchor_id: step3-edge
              title_html: 'Scegli <em>Prestazioni elevate</em> per Edge'
              paragraphs_html:
                - 'Trova <span class="font-medium">Microsoft Edge</span> nell''elenco, apri le <span class="font-medium">Opzioni</span> dell''app e imposta <span class="font-medium whitespace-nowrap">Preferenza GPU</span> su <span class="font-medium whitespace-nowrap">Prestazioni elevate</span>.'
              images:
                - src: graphics-settings-edge-3.png
                  alt: Schermata Grafica con Microsoft Edge evidenziato
            - number: 4
              title: Riavvia il browser e, se serve, il computer
              paragraphs_html:
                - "Chiudi Edge e riaprilo. Se non basta, prova a riavviare il computer."
              images: []
          troubleshooting:
            title: Se non noti differenze
            items:
              - label: "Portatile a batteria?"
                body_html: Su alcuni portatili Windows continua a preferire la grafica a risparmio energetico quando non sono collegati alla corrente. Prova a collegarlo&nbsp;all'alimentazione.
              - label: Aggiorna i driver grafici
                body_html: tramite l'app del produttore della GPU (NVIDIA / AMD / Intel) oppure con Windows Update.
              - label: Reimposta
                body_html: 'Nelle impostazioni Grafiche rimetti Edge su <em>Lascia decidere a Windows</em>, poi ripeti i passaggi.'
