overview:
  title: Cos'e Vocal Remover?
  paragraphs:
    - "Vocal Remover ti permette di rimuovere la voce da una canzone su qualsiasi sito e di separare voce e musica sul computer senza software audio complicati. E pensato per usi reali: karaoke, remix, studio, lezioni e creazione di contenuti."
    - "Con Vocal Remover puoi:"
  bullets:
    - Rimuovere la voce da una canzone per ottenere una base pulita.
    - Isolare la voce per studiare fraseggio, armonie e stratificazioni.
    - Preparare tracce karaoke, basi e materiale didattico.
    - Pulire podcast e video togliendo la musica di sottofondo.
  versions_intro: "Vocal Remover e disponibile in due versioni:"
  online_link_label: Vocal Remover Online
  online_link_suffix: come estensione per i siti, e
  offline_link_label: Vocal Remover Offline
  offline_link_suffix: come app per iPhone, iPad e Mac per lavorare sui file.
online:
  title: Vocal Remover Online
  paragraphs:
    - Usa Vocal Remover per pulire una traccia online e rimuovere la voce da una canzone con questo separatore vocale basato su AI.
    - Vocal Remover Online aggiunge un controllo intelligente direttamente nel browser. Rimuovi la voce dai video di YouTube e da molti altri siti audio in pochi clic.
  bullets:
    - Rimuovi la voce da una canzone online direttamente su qualsiasi sito.
    - Funziona come estensione per togliere la voce su YouTube e su altre piattaforme musicali.
    - Ottieni basi pulite senza scaricare o caricare file.
    - Tecnologia AI per una separazione precisa e musicale.
    - Ideale per karaoke, cover, remix e basi di accompagnamento.
  perfect_for_label: "Ideale per:"
  perfect_for_text: amanti del karaoke, cantanti, vocal coach, insegnanti, creator e chiunque studi con video online.
  pricing_template: "Dopo la prova gratuita: WEEKLY_PRICE, YEARLY_PRICE oppure LIFETIME_PRICE."
  offer_templates:
    weekly: "$PRICE_VALUE a settimana"
    yearly: "$PRICE_VALUE all'anno"
    lifetime: "pagamento una tantum di $PRICE_VALUE"
  cta: Aggiungi Vocal Remover al browser
  image_alt: Installa l'estensione Vocal Remover e aggiungila al browser Chrome in pochi secondi.
offline:
  title: Vocal Remover Offline
  paragraphs:
    - Vocal Remover rimuove la voce dai brani e separa voce e musica in pochi secondi. Puoi elaborare piu file in un solo passaggio per ottenere basi pulite.
    - Trascina un singolo brano o un'intera cartella, e Vocal Remover per iPhone, iPad o Mac dividera ogni file in stem vocali e strumentali. E pensato per velocita, precisione e lavoro offline sui tuoi file.
  bullets:
    - Separazione AI precisa anche su mix densi.
    - Modalita batch per elaborare decine o centinaia di brani mentre continui a lavorare.
    - Compatibile con WAV, AIFF, MP3, FLAC, M4A e altri formati.
    - Elaborazione offline senza account e senza tempi di upload.
  perfect_for_label: "Ideale per:"
  perfect_for_text: producer, DJ, podcaster, insegnanti e musicisti che lavorano con file audio locali.
  pricing_template: "Dopo la prova gratuita: WEEKLY_PRICE oppure YEARLY_PRICE."
  offer_templates:
    weekly: "$PRICE_VALUE a settimana"
    yearly: "$PRICE_VALUE all'anno"
  cta: Aggiungi Vocal Remover su iPhone, iPad o Mac
  image_alt: Scarica oggi Vocal Remover e prepara basi e stem vocali con un flusso di lavoro rapido.
use_cases:
  title: Chi usa Vocal Remover?
  items:
    - title: Cantanti e amanti del karaoke
      body: Trasforma subito qualsiasi brano in una versione karaoke. Studia nella tonalita giusta per te, prepara scalette e prova senza cercare basi separate.
    - title: Producer e DJ
      body: Estrai basi pulite e tracce vocali per remix, edit e mashup. Prepara stem per la tua DAW o per i live set in pochi clic.
    - title: Insegnanti e studenti
      body: Crea tracce alleggerite per lezioni, ear training e trascrizione. Isola la voce per studiare il fraseggio oppure toglila per far cantare o suonare gli studenti sopra.
    - title: Podcaster e creator
      body: Togli la musica sotto la voce, pulisci intro e outro e prepara stem chiari per montaggio e riutilizzo dei contenuti.
faq:
  title: Domande frequenti
  items:
    - question: L'estensione Vocal Remover e lenta o instabile. Cosa posso fare?
      answers:
        - Su alcuni computer Windows, soprattutto portatili, Windows puo assegnare al browser la scheda grafica a risparmio energetico invece di quella piu veloce. Poiche Vocal Remover elabora l'audio in tempo reale, questo puo causare rallentamenti, audio che scatta o perfino impedire il funzionamento dell'estensione.
      answer_html: 'Puoi dire a Windows di usare la scheda grafica ad alte prestazioni per il browser. Qui trovi una guida passo passo con schermate: <a href="/it/blog/scegliere-la-scheda-grafica-ad-alte-prestazioni-per-chrome-edge-su-windows/" class="underline">Scegli la scheda grafica ad alte prestazioni per Chrome ed Edge su Windows</a>. Se dopo la guida il problema resta, il computer o il browser potrebbero semplicemente non essere adatti all''elaborazione in tempo reale. In quel caso prova Vocal Remover su un sistema piu potente, se ne hai uno a disposizione.'
    - question: Qual e la differenza tra Vocal Remover Online e Vocal Remover Offline?
      answers:
        - Vocal Remover Online e un'estensione per browser che rimuove la voce direttamente su siti come YouTube e altre piattaforme audio o video.
        - Vocal Remover Offline e un'app autonoma per iPhone, iPad e Mac che lavora completamente offline sui tuoi file audio e ti permette di elaborare cartelle intere in batch.
    - question: Devo caricare i file audio?
      answers:
        - Non serve caricare nulla.
        - L'estensione elabora l'audio direttamente nel browser mentre ascolti, e l'app per iPhone, iPad o Mac lavora localmente con i file sul computer, senza server in mezzo.
    - question: Quali formati audio supporta Vocal Remover Offline?
      answers:
        - Vocal Remover per iPhone, iPad o Mac supporta formati comuni come WAV, AIFF, MP3, FLAC, M4A e altri, cosi puoi separare i file che hai gia senza convertirli. Puoi anche trascinare video, cartelle o regioni dalla tua DAW, e l'app estrarra l'audio automaticamente.
    - question: Rimuovere la voce influisce sulla qualita audio?
      answers:
        - Vocal Remover usa una separazione AI pensata per mantenere le basi pulite e musicali.
        - La versione offline offre qualita migliore perche vede l'intero brano durante l'elaborazione e ha piu risorse di calcolo.
        - Mix molto complicati o rumorosi possono ancora mostrare artefatti, ma nella maggior parte dei casi i risultati sono molto buoni.
    - question: Posso anche cambiare la tonalita dei brani?
      linked_answers:
        - tool_key: pitch_changer
          template: Si, usa TOOL_LINK per spostare l'intonazione e cambiare la tonalita dei brani online o offline. Funziona molto bene insieme a Vocal Remover.
    - question: Come posso cambiare il tempo di una canzone?
      answers: []
      linked_answers:
        - tool_key: bpm_extension
          template: Se vuoi rallentare o accelerare la musica su un sito mentre sta gia suonando, usa TOOL_LINK.
        - tool_key: speed_tool
          template: Se vuoi cambiare il tempo di un tuo file mantenendo stabile l'intonazione, usa TOOL_LINK.
    - question: C'e una prova gratuita? Come funziona il prezzo?
      answers:
        - Sia l'estensione sia l'app per iPhone, iPad o Mac includono un periodo di prova gratuito. Nessuna carta richiesta.
        - Dopo la prova, Vocal Remover Online offre piani settimanali, annuali e acquisto una tantum, mentre Vocal Remover Offline offre abbonamenti settimanali e annuali, come indicato sopra.
        - Tutti i pagamenti sono gestiti in modo sicuro tramite Paddle per l'estensione oppure tramite Apple per l'app.
    - question: Come faccio a cancellare l'abbonamento?
      answers:
        - Basta fare clic sul pulsante “Manage Subscription” dentro l'app o l'estensione e seguire le istruzioni.
        - Il processo e completamente automatico, quindi non serve telefonare o scrivere email.
    - question: Per chi e pensato Vocal Remover?
      answers:
        - Vocal Remover e pensato per cantanti, musicisti, producer, DJ, insegnanti, creator e chiunque abbia bisogno di separare voce e musica.
        - Che tu stia preparando karaoke, lezioni, dialoghi o remix, ti aiuta a ottenere stem puliti in poco tempo.
