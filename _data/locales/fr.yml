              paragraphs_html:
                - 'Repérez <span class="font-medium">Microsoft Edge</span> dans la liste, ouvrez les <span class="font-medium">Options</span> de l''application et réglez <span class="font-medium whitespace-nowrap">Préférence GPU</span> sur <span class="font-medium whitespace-nowrap">Haute performance</span>.'
              images:
