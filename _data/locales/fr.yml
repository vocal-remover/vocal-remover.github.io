pages:
  gpu_guide:
    meta:
      title: "Choisir le GPU hautes performances pour Chrome et Edge sous Windows"
      description: "Si Vocal Remover est lent ou instable sous Windows, attribuez à Chrome ou Edge le GPU hautes performances avec ce guide pas à pas."
      og_title: "Choisir le GPU hautes performances pour Chrome et Edge sous Windows"
      og_description: "Si Vocal Remover est lent ou instable sous Windows, attribuez à Chrome ou Edge le GPU hautes performances avec ce guide pas à pas."
      og_type: article
      og_image: /blog/set-high-performance-gpu-for-chrome-edge-on-windows/graphics-settings-chrome-3.png
    guide:
      extension_link_label: extension Vocal Remover
      page_title: Faites utiliser à Windows le GPU rapide pour votre navigateur
      intro_html:
        - "EXTENSION_LINK effectue des calculs lourds en temps réel et a donc besoin d'un GPU rapide pour fonctionner de manière fluide. Même si l'on parle ici d'audio, les navigateurs modernes utilisent le GPU en arrière-plan pour accélérer les calculs, et Vocal Remover en a besoin."
        - "Sur certains ordinateurs, surtout les portables, Windows peut choisir pour votre navigateur le GPU économe en énergie. Cela peut provoquer des ralentissements, des coupures ou empêcher Vocal Remover de fonctionner correctement. Ce guide indique à Windows d'utiliser le GPU hautes performances pour votre navigateur."
      detected_browser_label: Navigateur détecté
      unknown_browser_label: Inconnu
      back_home_label: Retour à l'accueil
      copy_button:
        idle: Copier
        success: Copié !
      browsers:
        chrome:
          tab_label: Google Chrome
          detected_label: Google Chrome
          tab_accent: blue
          title: Configurer Chrome avec le GPU hautes performances
          steps:
            - number: 1
              title: Ouvrez les paramètres Graphiques
              paragraphs_html:
                - 'Ouvrez les paramètres <a href="ms-settings:display-advancedgraphics" class="underline">via ce lien</a> ou allez dans <span class="font-medium">Paramètres → Système → Affichage → Graphiques</span>.'
                - 'Dans la liste, cherchez <span class="font-medium">Google Chrome</span> (vous devrez peut-être faire défiler). S''il est déjà présent, passez à <a href="#step3-chrome" class="underline">l''étape 3</a>.'
              images:
                - src: graphics-settings.png
                  alt: Écran Paramètres → Système → Affichage → Graphiques
            - number: 2
              title: Ajoutez Chrome à la liste s'il n'y est pas
              paragraphs_html:
                - "Si vous ne voyez pas Chrome :"
              instructions_html:
                - 'Cliquez sur <span class="font-medium">Ajouter une application de bureau</span>.'
                - 'En bas, dans le champ <span class="font-medium">Nom de fichier</span>, <span class="font-medium">collez l''une des lignes</span> ci-dessous.'
                - 'Appuyez sur <span class="font-medium">Entrée</span> ou cliquez sur <span class="font-medium">Ajouter</span>.'
              note_html: Si la première ligne renvoie une erreur, essayez la suivante.
              copy_paths:
                - '%LocalAppData%\Google\Chrome\Application\chrome.exe'
                - 'C:\Program Files (x86)\Google\Chrome\Application\chrome.exe'
                - 'C:\Program Files\Google\Chrome\Application\chrome.exe'
              images:
                - src: graphics-settings-2.png
                  alt: Paramètres Graphiques avec le bouton Ajouter une application de bureau mis en avant
                - src: file-picker-2.png
                  alt: Fenêtre de sélection de fichier avec le champ Nom de fichier mis en avant
            - number: 3
              anchor_id: step3-chrome
              title_html: 'Choisissez <em>Haute performance</em> pour Chrome'
              paragraphs_html:
                - 'Repérez <span class="font-medium">Google Chrome</span> dans la liste, ouvrez les <span class="font-medium">Options</span> de l''application et réglez <span class="font-medium whitespace-nowrap">Préférence GPU</span> sur <span class="font-medium whitespace-nowrap">Haute performance</span>.'
              images:
                - src: graphics-settings-chrome-3.png
                  alt: Paramètres Graphiques avec Google Chrome mis en avant
            - number: 4
              title: Redémarrez le navigateur et, si nécessaire, l'ordinateur
              paragraphs_html:
                - "Fermez Chrome puis ouvrez-le à nouveau. Si cela ne suffit pas, redémarrez l'ordinateur."
              images: []
          troubleshooting:
            title: Si vous ne voyez pas de différence
            items:
              - label: "Portable sur batterie ?"
                body_html: Certains portables préfèrent encore le GPU économe en énergie sur batterie. Essayez de le brancher&nbsp;au secteur.
              - label: Mettez à jour les pilotes graphiques
                body_html: via l'application du fabricant du GPU (NVIDIA / AMD / Intel) ou Windows Update.
              - label: Réinitialisez
                body_html: 'Dans les paramètres Graphiques, remettez Chrome sur <em>Laisser Windows décider</em>, puis recommencez.'
        edge:
          tab_label: Microsoft Edge
          detected_label: Microsoft Edge
          tab_accent: violet
          title: Configurer Edge avec le GPU hautes performances
          steps:
            - number: 1
              title: Ouvrez les paramètres Graphiques
              paragraphs_html:
                - 'Ouvrez les paramètres <a href="ms-settings:display-advancedgraphics" class="underline">via ce lien</a> ou allez dans <span class="font-medium">Paramètres → Système → Affichage → Graphiques</span>.'
                - 'Dans la liste, cherchez <span class="font-medium">Microsoft Edge</span> (vous devrez peut-être faire défiler). S''il est déjà présent, passez à <a href="#step3-edge" class="underline">l''étape 3</a>.'
