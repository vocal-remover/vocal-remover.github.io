overview:
  title: Qu'est-ce que Vocal Remover ?
  paragraphs:
    - "Vocal Remover vous permet de retirer les voix d'un morceau sur n'importe quel site et de séparer voix et musique sur votre ordinateur sans logiciel audio compliqué. L'outil est pensé pour des usages concrets : karaoké, remixes, travail, cours et création de contenu."
    - "Avec Vocal Remover, vous pouvez :"
  bullets:
    - Retirer les voix d'un morceau pour obtenir un instrumental propre.
    - Isoler la voix pour étudier le phrasé, les harmonies et les couches.
    - Préparer des pistes karaoké, des playbacks et du matériel pédagogique.
    - Nettoyer des podcasts et des vidéos en retirant la musique de fond.
  versions_intro: "Vocal Remover existe en deux versions :"
  online_link_label: Vocal Remover Online
  online_link_suffix: comme extension pour les sites, et
  offline_link_label: Vocal Remover Offline
  offline_link_suffix: comme application iPhone, iPad et Mac pour travailler sur des fichiers.
online:
  title: Vocal Remover Online
  paragraphs:
    - Utilisez Vocal Remover pour nettoyer votre piste en ligne et retirer les voix d'un morceau avec cet outil de séparation vocale basé sur l'AI.
    - Vocal Remover Online ajoute la séparation directement dans votre navigateur. Retirez les voix de vidéos YouTube et de nombreux autres sites audio en quelques clics.
  bullets:
    - Retirez les voix d'un morceau en ligne directement sur n'importe quel site.
    - Fonctionne comme extension pour retirer les voix sur YouTube et sur d'autres plateformes musicales.
    - Obtenez des instrumentaux propres sans télécharger ni envoyer de fichiers.
    - Technologie AI de séparation vocale pour un résultat de haute qualité.
    - Très utile pour le karaoké, les reprises, les remixes et les pistes d'accompagnement.
  perfect_for_label: "Idéal pour :"
  perfect_for_text: chanteuses et chanteurs, professeurs de chant, enseignants, créateurs, fans de karaoké et toutes les personnes qui travaillent avec des vidéos en ligne.
  pricing_template: "Après l'essai gratuit : WEEKLY_PRICE, YEARLY_PRICE ou LIFETIME_PRICE."
  offer_templates:
    weekly: "$PRICE_VALUE par semaine"
    yearly: "$PRICE_VALUE par an"
    lifetime: "paiement unique de $PRICE_VALUE"
  cta: Ajouter Vocal Remover au navigateur
  image_alt: Installez l'extension Vocal Remover et ajoutez-la à Chrome en quelques secondes.
offline:
  title: Vocal Remover Offline
  paragraphs:
    - Vocal Remover retire les voix des morceaux et sépare voix et musique en quelques secondes. Traitez plusieurs fichiers d'un coup pour obtenir des instrumentaux propres.
    - Déposez un seul morceau ou un dossier entier, et Vocal Remover pour iPhone, iPad ou Mac séparera chaque titre en stems vocaux et instrumentaux. L'application est pensée pour la vitesse, la précision et le travail hors ligne sur vos fichiers.
  bullets:
    - Séparation AI précise, même sur des mixes chargés.
    - Mode batch pour traiter des dizaines ou des centaines de morceaux pendant que vous continuez à travailler.
    - Prend en charge WAV, AIFF, MP3, FLAC, M4A et d'autres formats.
    - Traitement hors ligne sans compte ni attente d'envoi.
  perfect_for_label: "Idéal pour :"
  perfect_for_text: producteurs, DJ, podcasters, enseignants et musiciens qui travaillent avec des fichiers audio locaux.
  pricing_template: "Après l'essai gratuit : WEEKLY_PRICE ou YEARLY_PRICE."
  offer_templates:
    weekly: "$PRICE_VALUE par semaine"
    yearly: "$PRICE_VALUE par an"
  cta: Ajouter Vocal Remover sur iPhone, iPad ou Mac
  image_alt: Téléchargez Vocal Remover et préparez vos instrumentaux et stems vocaux dans un flux de travail rapide.
use_cases:
  title: Qui utilise Vocal Remover ?
  items:
    - title: Chanteuses, chanteurs et fans de karaoké
      body: Transformez immédiatement n'importe quel morceau en version karaoké. Travaillez dans votre tonalité, préparez des setlists et répétez sans courir après des instrumentaux séparés.
    - title: Producteurs et DJ
      body: Récupérez des instrumentaux propres et des voix pour des remixes, des edits et des mashups. Préparez des stems pour votre DAW ou pour vos sets live en quelques clics.
    - title: Enseignants et élèves
      body: Créez des pistes allégées pour les cours, l'oreille et la transcription. Isolez la voix pour l'étudier ou retirez-la pour laisser les élèves chanter ou jouer par-dessus.
    - title: Podcasters et créateurs
      body: Retirez la musique sous la parole, nettoyez intros et outros, et préparez des stems clairs pour le montage et la réutilisation.
faq:
  title: Questions fréquentes
  items:
    - question: L'extension Vocal Remover est lente ou instable. Que puis-je faire ?
      answers:
        - Sur certains ordinateurs Windows, surtout les portables, Windows peut choisir pour votre navigateur la puce graphique économe en énergie au lieu de la plus rapide. Comme Vocal Remover traite l'audio en temps réel, cela peut provoquer des ralentissements, des coupures ou empêcher l'extension de fonctionner correctement.
      answer_html: 'Vous pouvez demander à Windows d''utiliser la puce graphique hautes performances pour votre navigateur. Voici un guide pas à pas avec captures : <a href="/fr/blog/set-high-performance-gpu-for-chrome-edge-on-windows/" class="underline">Choisir le GPU hautes performances pour Chrome et Edge sous Windows</a>. Si cela ne suffit pas, votre ordinateur ou votre navigateur est peut-être simplement trop limité pour le traitement en temps réel. Dans ce cas, essayez Vocal Remover sur une machine plus puissante si vous en avez une à disposition.'
    - question: Quelle est la différence entre Vocal Remover Online et Vocal Remover Offline ?
      answers:
        - Vocal Remover Online est une extension de navigateur qui retire les voix directement sur des sites comme YouTube et d'autres plateformes audio ou vidéo.
        - Vocal Remover Offline est une application autonome pour iPhone, iPad et Mac qui fonctionne entièrement hors ligne avec vos fichiers audio et permet de traiter des dossiers entiers en batch.
    - question: Dois-je envoyer mes fichiers audio ?
      answers:
        - Aucun envoi n'est nécessaire.
        - L'extension traite l'audio directement dans votre navigateur pendant la lecture, et l'application pour iPhone, iPad ou Mac travaille localement avec les fichiers sur votre ordinateur, sans serveur intermédiaire.
    - question: Quels formats audio sont pris en charge par Vocal Remover Offline ?
      answers:
        - Vocal Remover pour iPhone, iPad ou Mac prend en charge des formats courants comme WAV, AIFF, MP3, FLAC, M4A et d'autres, ce qui vous permet de séparer les fichiers que vous avez déjà sans conversion préalable. Vous pouvez aussi déposer des vidéos, des dossiers ou des régions depuis votre DAW, et l'application extraira l'audio automatiquement.
    - question: Le retrait des voix affecte-t-il la qualité audio ?
      answers:
        - Vocal Remover utilise une séparation AI conçue pour garder des instrumentaux propres et musicaux.
        - La version hors ligne offre une meilleure qualité parce qu'elle voit l'ensemble du morceau pendant le traitement et dispose de plus de ressources de calcul.
        - Des mixes très complexes ou très bruyants peuvent encore produire des artefacts, mais la plupart des morceaux se séparent très bien.
    - question: Puis-je aussi changer la tonalité des morceaux ?
      linked_answers:
        - tool_key: pitch_changer
          template: Oui, utilisez TOOL_LINK pour déplacer la hauteur et changer la tonalité des morceaux en ligne ou hors ligne. L'outil fonctionne très bien avec Vocal Remover.
    - question: Comment puis-je changer le tempo d'un morceau ?
      answers: []
      linked_answers:
        - tool_key: bpm_extension
          template: Si vous voulez ralentir ou accélérer la musique sur un site pendant qu'elle joue déjà, utilisez TOOL_LINK.
        - tool_key: speed_tool
          template: Si vous voulez changer le tempo de votre propre fichier sans toucher à la hauteur, utilisez TOOL_LINK.
    - question: Y a-t-il un essai gratuit ? Comment fonctionne le prix ?
      answers:
        - L'extension comme l'application pour iPhone, iPad et Mac incluent une période d'essai gratuite. Aucune carte bancaire n'est requise.
        - Après l'essai, Vocal Remover Online propose des formules hebdomadaires, annuelles et un achat unique, tandis que Vocal Remover Offline propose des abonnements hebdomadaires et annuels, comme indiqué plus haut.
        - Tous les paiements sont traités de manière sécurisée via Paddle pour l'extension ou Apple pour l'application.
    - question: Comment résilier mon abonnement ?
      answers:
        - Cliquez simplement sur le bouton « Manage Subscription » dans l'application ou l'extension, puis suivez les instructions.
        - Le processus est entièrement automatique, vous n'avez donc ni appel ni e-mail à faire.
    - question: À qui s'adresse Vocal Remover ?
      answers:
        - Vocal Remover s'adresse aux chanteurs, musiciens, producteurs, DJ, enseignants, créateurs et à toutes les personnes qui doivent séparer voix et musique.
        - Que vous prépariez du karaoké, des cours, des dialogues ou des remixes, il vous donne rapidement des stems propres.
