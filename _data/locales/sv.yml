pages:
  gpu_guide:
    meta:
      title: "Välj det högpresterande grafikchipet för Chrome & Edge på Windows"
      description: "Om Vocal Remover känns långsam eller instabil på Windows kan du låta Chrome eller Edge använda det högpresterande grafikchipet med den här steg-för-steg-guiden."
      og_title: "Välj det högpresterande grafikchipet för Chrome & Edge på Windows"
      og_description: "Om Vocal Remover känns långsam eller instabil på Windows kan du låta Chrome eller Edge använda det högpresterande grafikchipet med den här steg-för-steg-guiden."
      og_type: article
      og_image: /blog/set-high-performance-gpu-for-chrome-edge-on-windows/graphics-settings-chrome-3.png
    guide:
      extension_link_label: Vocal Remover-tillägget
      page_title: Få Windows att använda det snabba grafikchipet för din webbläsare
      intro_html:
        - EXTENSION_LINK utför tunga beräkningar i realtid och behöver därför ett snabbt grafikchip för att fungera smidigt. Även om det handlar om ljud använder moderna webbläsare grafikchipet i bakgrunden för att snabba upp tung beräkning, och Vocal Remover behöver också den kraften.
        - På vissa datorer, särskilt bärbara, kan Windows välja det strömsnåla grafikchipet för din webbläsare. Det kan orsaka fördröjning, hackigt ljud eller att Vocal Remover-tillägget slutar fungera helt. Den här guiden får Windows att använda det högpresterande grafikchipet för webbläsaren.
      detected_browser_label: Upptäckt webbläsare
      unknown_browser_label: Okänd
      back_home_label: Tillbaka till startsidan
      copy_button:
        idle: Kopiera
        success: Kopierat!
      browsers:
        chrome:
          tab_label: Google Chrome
          detected_label: Google Chrome
          tab_accent: blue
          title: Låt Chrome använda det högpresterande grafikchipet
          steps:
            - number: 1
              title: Öppna Graphics-inställningar
              paragraphs_html:
                - 'Öppna inställningarna genom att <a href="ms-settings:display-advancedgraphics" class="underline">klicka här</a>, eller gå till <span class="font-medium">Settings → System → Display → Graphics</span>.'
                - 'Leta efter <span class="font-medium">Google Chrome</span> i listan (du kan behöva skrolla). Om du ser den, gå direkt till <a href="#step3-chrome" class="underline">steg 3</a>.'
              images:
                - src: graphics-settings.png
                  alt: Skärmen Settings → System → Display → Graphics
            - number: 2
              title: Lägg till Chrome i listan (bara om den saknas)
              paragraphs_html:
                - "Om du inte ser Chrome där:"
              instructions_html:
                - 'Klicka på <span class="font-medium">Add desktop app</span>.'
                - 'Klistra in en av raderna nedan i rutan <span class="font-medium">File name</span> längst ned.'
                - 'Tryck på <span class="font-medium">Enter</span> eller klicka på <span class="font-medium">Add</span>.'
              note_html: Om första raden ger ett fel, prova nästa.
              copy_paths:
                - '%LocalAppData%\Google\Chrome\Application\chrome.exe'
                - 'C:\Program Files (x86)\Google\Chrome\Application\chrome.exe'
                - 'C:\Program Files\Google\Chrome\Application\chrome.exe'
              images:
                - src: graphics-settings-2.png
                  alt: Skärmen Settings → System → Display → Graphics med markerad Add desktop app-knapp
                - src: file-picker-2.png
                  alt: Filväljare med markerad filnamnsruta och knapp
            - number: 3
              anchor_id: step3-chrome
              title_html: Välj <em>High Performance</em> för Chrome
              paragraphs_html:
                - 'Hitta <span class="font-medium">Google Chrome</span> i listan (du kan behöva skrolla). Klicka på den och sätt <span class="font-medium whitespace-nowrap">GPU preference</span> till <span class="font-medium whitespace-nowrap">High Performance</span>.'
              images:
                - src: graphics-settings-chrome-3.png
                  alt: Skärmen Settings → System → Display → Graphics med Chrome markerat
            - number: 4
              title: Starta om webbläsaren och vid behov även datorn
              paragraphs_html:
                - Stäng Chrome och öppna den igen. Hjälper inte det, prova att starta om datorn.
              images: []
          troubleshooting:
            title: Om du inte märker någon skillnad
            items:
              - label: Bärbar dator på batteri?
                body_html: Vissa bärbara datorer prioriterar fortfarande det strömsnåla grafikchipet när de kör på batteri. Prova att ansluta laddaren.
              - label: Uppdatera grafikdrivrutiner
                body_html: via appen från tillverkaren av ditt grafikchip (NVIDIA / AMD / Intel) eller via Windows Update.
              - label: Återställ
                body_html: 'Ställ tillbaka Chrome till <em>Let Windows decide</em> i Graphics-inställningar och gör sedan om stegen.'
        edge:
          tab_label: Microsoft Edge
          detected_label: Microsoft Edge
          tab_accent: violet
          title: Låt Edge använda det högpresterande grafikchipet
          steps:
            - number: 1
              title: Öppna Graphics-inställningar
              paragraphs_html:
                - 'Öppna inställningarna genom att <a href="ms-settings:display-advancedgraphics" class="underline">klicka här</a>, eller gå till <span class="font-medium">Settings → System → Display → Graphics</span>.'
                - 'Leta efter <span class="font-medium">Microsoft Edge</span> i listan (du kan behöva skrolla). Om du ser den, gå direkt till <a href="#step3-edge" class="underline">steg 3</a>.'
              images:
                - src: graphics-settings.png
                  alt: Skärmen Settings → System → Display → Graphics
            - number: 2
              title: Lägg till Edge i listan (bara om den saknas)
              paragraphs_html:
                - "Om du inte ser Edge där:"
              instructions_html:
                - 'Klicka på <span class="font-medium">Add desktop app</span>.'
                - 'Klistra in en av raderna nedan i rutan <span class="font-medium">File name</span> längst ned.'
                - 'Tryck på <span class="font-medium">Enter</span> eller klicka på <span class="font-medium">Add</span>.'
              note_html: Om första raden ger ett fel, prova nästa.
              copy_paths:
                - 'C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe'
                - 'C:\Program Files\Microsoft\Edge\Application\msedge.exe'
              images:
                - src: graphics-settings-2.png
                  alt: Skärmen Settings → System → Display → Graphics med markerad Add desktop app-knapp
                - src: file-picker-2.png
                  alt: Filväljare med markerad filnamnsruta och knapp
            - number: 3
              anchor_id: step3-edge
              title_html: Välj <em>High Performance</em> för Edge
              paragraphs_html:
                - 'Hitta <span class="font-medium">Microsoft Edge</span> i listan (du kan behöva skrolla). Klicka på den och sätt <span class="font-medium whitespace-nowrap">GPU preference</span> till <span class="font-medium whitespace-nowrap">High Performance</span>.'
              images:
                - src: graphics-settings-edge-3.png
                  alt: Skärmen Settings → System → Display → Graphics med Edge markerat
            - number: 4
              title: Starta om webbläsaren och vid behov även datorn
              paragraphs_html:
                - Stäng Edge och öppna den igen. Hjälper inte det, prova att starta om datorn.
              images: []
          troubleshooting:
            title: Om du inte märker någon skillnad
            items:
              - label: Bärbar dator på batteri?
                body_html: Vissa bärbara datorer prioriterar fortfarande det strömsnåla grafikchipet när de kör på batteri. Prova att ansluta laddaren.
              - label: Uppdatera grafikdrivrutiner
                body_html: via appen från tillverkaren av ditt grafikchip (NVIDIA / AMD / Intel) eller via Windows Update.
              - label: Återställ
