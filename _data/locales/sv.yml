overview:
  title: Vad är Vocal Remover?
  paragraphs:
    - Med Vocal Remover kan du ta bort sång från en låt på vilken webbplats som helst och separera röst från musik på datorn utan krånglig ljudprogramvara. Den är byggd för verkliga behov som karaoke, remixer, övning, undervisning och innehållsproduktion.
    - "Du kan:"
  bullets:
    - Ta bort sång från en låt och få en ren instrumental version.
    - Isolera rösten för att studera frasering, harmonier och lager.
    - Förbereda karaokespår, backing tracks och undervisningsmaterial.
    - Rensa upp poddar och videor genom att ta bort bakgrundsmusik.
  versions_intro: "Vocal Remover finns i två versioner:"
  online_link_label: Vocal Remover Online
  online_link_suffix: ett webbläsartillägg för webbplatser, och
  offline_link_label: Vocal Remover Offline
  offline_link_suffix: en app för iPhone, iPad och Mac för filer.
online:
  title: Vocal Remover Online
  paragraphs:
    - Använd Vocal Remover för att rensa upp ditt spår online och ta bort sång från en låt med AI-baserad röstsplittning.
    - Med Vocal Remover Online lägger du till ett smart tillägg direkt i webbläsaren. Ta bort sång från YouTube-videor och många andra ljudwebbplatser med bara några klick.
  bullets:
    - Ta bort sång online direkt på vilken webbplats som helst.
    - Fungerar som ett YouTube-tillägg för att ta bort sång och även på andra musikplattformar.
    - Få rena instrumentaler utan att ladda ner eller ladda upp filer.
    - AI-teknik för sångseparering med hög kvalitet.
    - Perfekt för karaoke, covers, remixer och backing tracks.
  perfect_for_label: "Perfekt för:"
  perfect_for_text: karaokeälskare, sångare, sångpedagoger, lärare, innehållsskapare och alla som övar med videor online.
  pricing_template: "Efter gratisperioden: WEEKLY_PRICE, YEARLY_PRICE abonnemang eller LIFETIME_PRICE."
  offer_templates:
    weekly: "US$PRICE_VALUE per vecka"
    yearly: "US$PRICE_VALUE per år"
    lifetime: "engångsbetalning på US$PRICE_VALUE"
  cta: Lägg till Vocal Remover i webbläsaren
  image_alt: Installera Vocal Remover-tillägget och lägg till det i Chrome på några sekunder.
offline:
  title: Vocal Remover Offline
  paragraphs:
    - Snabba Vocal Remover tar bort sång från låtar och separerar röst från musik på några sekunder. Batchbearbeta flera filer med ett klick och få rena instrumentaler.
    - Släpp in ett spår eller en hel mapp så delar Vocal Remover för iPhone, iPad och Mac upp varje låt i sång- och instrumentalstems. Byggd för snabbhet, precision och ett smidigt offlineflöde.
  bullets:
    - AI-baserad sångborttagning för exakt separering, även i täta mixar.
    - Batchläge för att bearbeta hundratals låtar medan du fortsätter jobba.
    - Fungerar med WAV, AIFF, MP3, FLAC, M4A och fler format.
    - Offlinebearbetning utan konton och utan väntan på uppladdningar.
  perfect_for_label: "Perfekt för:"
  perfect_for_text: producenter, DJ:er, poddare, lärare och musiker som arbetar med lokala ljudfiler.
  pricing_template: "Efter gratisperioden: WEEKLY_PRICE eller YEARLY_PRICE abonnemang."
  offer_templates:
    weekly: "US$PRICE_VALUE per vecka"
    yearly: "US$PRICE_VALUE per år"
  cta: Lägg till Vocal Remover på din iPhone, iPad eller Mac
  image_alt: Ladda ner idag och se varför så många musiker använder Vocal Remover för att snabbt få fram rätt stems.
use_cases:
  title: Vem använder Vocal Remover?
  items:
    - title: Sångare och karaokeälskare
      body: Förvandla direkt vilken låt som helst till en karaokeversion. Öva i din egen tonart, förbered setlistor och repetera utan att jaga separata instrumentaler.
    - title: Producenter och DJ:er
      body: Extrahera rena instrumentaler och vocals för remixer, edits och mashups. Förbered stems för din DAW eller liveset med bara några klick.
    - title: Lärare och elever
      body: Skapa avskalade spår för lektioner, gehörsträning och transkription. Isolera sången för att studera frasering eller ta bort den så att elever kan framföra ovanpå.
    - title: Poddare och innehållsskapare
      body: Ta bort bakgrundsmusik under tal, rensa intro och outro och förbered tydliga stems för redigering och återanvändning.
faq:
  title: Vanliga frågor
  items:
    - question: Vocal Remover-tillägget är långsamt eller hackar. Vad kan jag göra?
      answers:
        - På vissa Windows-datorer, särskilt bärbara, kan Windows välja det strömsnåla grafikchipet för webbläsaren i stället för det snabba. Eftersom Vocal Remover-tillägget bearbetar ljud i realtid kan det orsaka fördröjningar, hackigt ljud eller att det slutar fungera helt.
      answer_html: 'Du kan ställa in Windows så att webbläsaren använder det högpresterande grafikchipet. Vi har en steg-för-steg-guide med skärmbilder här: <a href="/sv/blog/set-high-performance-gpu-for-chrome-edge-on-windows/" class="underline">Välj det högpresterande grafikchipet för Chrome &amp; Edge på Windows</a>. Hjälper inte det, kan datorn eller webbläsaren helt enkelt vara för begränsad för realtidsbearbetning. Prova i så fall Vocal Remover på ett kraftfullare system om du kan.'
    - question: Vad är skillnaden mellan Vocal Remover Online och Vocal Remover Offline?
      answers:
        - Vocal Remover Online är ett webbläsartillägg som tar bort sång direkt på webbplatser som YouTube och andra ljud- eller videoplattformar.
        - Vocal Remover Offline är en fristående app för iPhone, iPad och Mac som fungerar helt offline med dina egna ljudfiler och kan batchbearbeta hela mappar.
    - question: Behöver jag ladda upp ljudfiler?
      answers:
        - Nej, inga uppladdningar behövs.
        - Tillägget bearbetar ljud direkt i webbläsaren medan det spelas upp, och appen för iPhone, iPad och Mac arbetar lokalt med dina filer utan inblandning av servrar.
    - question: Vilka ljudformat stöder Vocal Remover Offline?
      answers:
        - Vocal Remover för iPhone, iPad och Mac fungerar med vanliga format som WAV, AIFF, MP3, FLAC, M4A och fler, så du kan splitta de filer du redan har utan att konvertera dem först. Du kan också släppa in videor, mappar eller regioner från din DAW, så extraherar appen ljudet automatiskt.
    - question: Påverkar borttagning av sång ljudkvaliteten?
      answers:
        - Vocal Remover använder AI-separering som är utformad för att hålla instrumentaler rena och musikaliska.
        - Offlineversionen ger ofta bättre kvalitet eftersom den ser hela låten under bearbetningen och har mer resurser att arbeta med.
        - Mycket komplicerade eller brusiga mixar kan fortfarande ge artefakter, men vanliga låtar separeras oftast väldigt bra.
    - question: Kan jag också ändra tonarten på låtar?
      linked_answers:
        - tool_key: pitch_changer
          template: Ja, använd TOOL_LINK för att flytta pitch och ändra tonart på låtar online eller offline. Det fungerar väldigt bra tillsammans med Vocal Remover.
    - question: Hur kan jag ändra tempot på en låt?
      answers: []
      linked_answers:
        - tool_key: bpm_extension
          template: Om du vill sakta ner eller snabba upp musik på en webbplats medan den redan spelar, använd TOOL_LINK.
        - tool_key: speed_tool
          template: Om du vill ändra tempot på din egen fil men behålla samma pitch, använd TOOL_LINK.
    - question: Finns det en gratis provperiod? Hur fungerar priset?
      answers:
        - Både tillägget och appen för iPhone, iPad och Mac har en gratis provperiod utan kort.
        - Efter provperioden erbjuder Vocal Remover Online veckovisa, årliga och engångsköp, medan Vocal Remover Offline erbjuder veckovisa och årliga abonnemang, enligt ovan.
        - Alla betalningar hanteras säkert via Paddle för tillägget eller Apple för appen.
    - question: Hur säger jag upp min prenumeration?
      answers:
        - Klicka på knappen Manage Subscription i appen eller tillägget och följ instruktionerna där.
        - Processen är helt automatisk, så du behöver inte ringa eller skicka e-post.
    - question: Vem är Vocal Remover till för?
      answers:
        - Vocal Remover är gjort för sångare, musiker, producenter, DJ:er, lärare, innehållsskapare och alla som behöver separera röst och musik.
        - Oavsett om du förbereder karaoke, undervisar, städar dialog eller bygger remixer får du snabbt fram rena stems.
