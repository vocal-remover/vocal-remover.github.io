overview:
  title: Czym jest Usuwanie wokalu?
  paragraphs:
    - Usuwanie wokalu pozwala usuwać wokal z utworu na dowolnej stronie i oddzielać głos od muzyki na komputerze bez skomplikowanych programów audio. To narzędzie stworzone do realnych zadań muzycznych, takich jak karaoke, remiksy, ćwiczenia, nauczanie i tworzenie materiałów.
    - "Możesz:"
  bullets:
    - Usunąć wokal z utworu i otrzymać czysty podkład instrumentalny.
    - Wyizolować głos, aby analizować frazowanie, harmonie i warstwy.
    - Przygotować ścieżki karaoke, podkłady i materiały do lekcji.
    - Oczyścić podcasty i filmy przez usunięcie muzyki w tle.
  versions_intro: "Usuwanie wokalu jest dostępne w dwóch wersjach:"
  online_link_label: Usuwanie wokalu Online
  online_link_suffix: rozszerzenie przeglądarki do stron, oraz
  offline_link_label: Usuwanie wokalu Offline
  offline_link_suffix: aplikacja na iPhone'a, iPada i Maca do pracy z plikami.
online:
  title: Usuwanie wokalu Online
  paragraphs:
    - Używaj Usuwania wokalu, aby oczyścić utwór online i usunąć wokal dzięki separacji głosu opartej na AI.
    - Usuwanie wokalu Online dodaje inteligentne narzędzie bezpośrednio do przeglądarki. Usuwaj wokal z filmów na YouTube i z wielu innych stron audio w zaledwie kilka kliknięć.
  bullets:
    - Usuwaj wokal online bezpośrednio na dowolnej stronie.
    - Działa jako narzędzie do usuwania wokalu z YouTube i innych platform muzycznych.
    - Otrzymuj czyste instrumentale bez pobierania ani wysyłania plików.
    - Separacja wokalu wysokiej jakości wspierana przez AI.
    - Świetne do karaoke, coverów, remiksów i podkładów.
  perfect_for_label: "Idealne dla:"
  perfect_for_text: miłośników karaoke, wokalistów, trenerów wokalnych, nauczycieli, twórców treści i wszystkich, którzy ćwiczą z materiałami online.
  pricing_template: "Po darmowym okresie próbnym: WEEKLY_PRICE, YEARLY_PRICE lub LIFETIME_PRICE."
  offer_templates:
