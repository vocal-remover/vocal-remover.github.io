    guide:
      extension_link_label: Rozszerzenie Usuwanie wokalu
      page_title: Ustaw w Windowsie szybki układ graficzny dla przeglądarki
      intro_html:
        - EXTENSION_LINK wykonuje złożone obliczenia w czasie rzeczywistym, więc potrzebuje szybkiego układu graficznego, aby działać płynnie. Chociaż chodzi o dźwięk, nowoczesne przeglądarki wykorzystują układ graficzny w tle do przyspieszania ciężkich obliczeń i Usuwanie wokalu również tego potrzebuje.
        - Na niektórych komputerach, szczególnie laptopach, Windows może wybrać dla przeglądarki energooszczędny układ graficzny. To może powodować spowolnienia, zacinanie dźwięku albo całkowicie uniemożliwiać działanie rozszerzenia Usuwanie wokalu. Ten poradnik ustawia dla przeglądarki wysokowydajny układ graficzny.
      detected_browser_label: Wykryta przeglądarka
      unknown_browser_label: Nieznana
      back_home_label: Wróć do strony głównej
      copy_button:
        idle: Kopiuj
        success: Skopiowano!
      browsers:
        chrome:
          tab_label: Google Chrome
          detected_label: Google Chrome
          tab_accent: blue
          title: Ustaw Chrome tak, aby używał wysokowydajnego układu graficznego
          steps:
            - number: 1
              title: Otwórz ustawienia Grafika
              paragraphs_html:
                - 'Otwórz ustawienia, <a href="ms-settings:display-advancedgraphics" class="underline">klikając tutaj</a>, albo przejdź do <span class="font-medium">Ustawienia → System → Ekran → Grafika</span>.'
                - 'Na liście znajdź <span class="font-medium">Google Chrome</span> (może być potrzebne przewinięcie). Jeśli już go widzisz, przejdź od razu do <a href="#step3-chrome" class="underline">kroku 3</a>.'
              images:
                - src: graphics-settings.png
                  alt: Ekran Ustawienia → System → Ekran → Grafika
            - number: 2
              title: Dodaj Chrome, jeśli nie ma go na liście
              paragraphs_html:
                - 'Jeśli Chrome nie ma na liście, kliknij <span class="font-medium">Dodaj aplikację klasyczną</span> i wybierz <span class="font-medium">Google Chrome</span>.'
                - 'W razie potrzeby wklej tę ścieżkę i naciśnij <span class="font-medium">Enter</span>:'
              copy_value: "%ProgramFiles%\\Google\\Chrome\\Application\\chrome.exe"
              images:
                - src: graphics-settings-chrome-1.png
                  alt: Dodawanie Google Chrome w ustawieniach grafiki Windows
            - number: 3
              id: step3-chrome
              title: Otwórz Opcje dla Chrome
              paragraphs_html:
                - 'Kliknij <span class="font-medium">Google Chrome</span> na liście, a potem wybierz <span class="font-medium">Opcje</span>.'
              images:
                - src: graphics-settings-chrome-2.png
                  alt: Przycisk Opcje dla Google Chrome w ustawieniach grafiki Windows
            - number: 4
              title: Wybierz opcję Wysoka wydajność
              paragraphs_html:
                - 'Wybierz <span class="font-medium">Wysoka wydajność</span>, a potem kliknij <span class="font-medium">Zapisz</span>.'
                - 'Jeśli widzisz więcej niż jeden układ graficzny, opcja wysokiej wydajności zwykle pokazuje mocniejszy układ dedykowany. Powinno pojawić się oznaczenie <span class="font-medium">Current: High performance</span>.'
              images:
                - src: graphics-settings-chrome-3.png
                  alt: Wybór opcji Wysoka wydajność dla Google Chrome w Windows
        edge:
          tab_label: Microsoft Edge
          detected_label: Microsoft Edge
          tab_accent: cyan
          title: Ustaw Edge tak, aby używał wysokowydajnego układu graficznego
          steps:
            - number: 1
              title: Otwórz ustawienia Grafika
              paragraphs_html:
                - 'Otwórz ustawienia, <a href="ms-settings:display-advancedgraphics" class="underline">klikając tutaj</a>, albo przejdź do <span class="font-medium">Ustawienia → System → Ekran → Grafika</span>.'
                - 'Na liście znajdź <span class="font-medium">Microsoft Edge</span> (może być potrzebne przewinięcie). Jeśli już go widzisz, przejdź od razu do <a href="#step3-edge" class="underline">kroku 3</a>.'
              images:
                - src: graphics-settings.png
                  alt: Ekran Ustawienia → System → Ekran → Grafika
            - number: 2
              title: Dodaj Edge, jeśli nie ma go na liście
              paragraphs_html:
                - 'Jeśli Edge nie ma na liście, kliknij <span class="font-medium">Dodaj aplikację klasyczną</span> i wybierz <span class="font-medium">Microsoft Edge</span>.'
                - 'W razie potrzeby wklej tę ścieżkę i naciśnij <span class="font-medium">Enter</span>:'
              copy_value: "%ProgramFiles(x86)%\\Microsoft\\Edge\\Application\\msedge.exe"
              images:
                - src: graphics-settings-edge-1.png
                  alt: Dodawanie Microsoft Edge w ustawieniach grafiki Windows
            - number: 3
              id: step3-edge
              title: Otwórz Opcje dla Edge
              paragraphs_html:
                - 'Kliknij <span class="font-medium">Microsoft Edge</span> na liście, a potem wybierz <span class="font-medium">Opcje</span>.'
              images:
                - src: graphics-settings-edge-2.png
                  alt: Przycisk Opcje dla Microsoft Edge w ustawieniach grafiki Windows
            - number: 4
              title: Wybierz opcję Wysoka wydajność
              paragraphs_html:
                - 'Wybierz <span class="font-medium">Wysoka wydajność</span>, a potem kliknij <span class="font-medium">Zapisz</span>.'
                - 'Jeśli widzisz więcej niż jeden układ graficzny, opcja wysokiej wydajności zwykle pokazuje mocniejszy układ dedykowany. Powinno pojawić się oznaczenie <span class="font-medium">Current: High performance</span>.'
              images:
                - src: graphics-settings-edge-3.png
                  alt: Wybór opcji Wysoka wydajność dla Microsoft Edge w Windows
