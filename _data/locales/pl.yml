  image_alt: Zainstaluj rozszerzenie Usuwanie wokalu i dodaj je do przeglądarki Chrome w kilka sekund.
offline:
  title: Usuwanie wokalu Offline
  paragraphs:
    - Błyskawiczne Usuwanie wokalu usuwa wokal z utworów i oddziela głos od muzyki w kilka sekund. Przetwarzaj wsadowo wiele plików jednym kliknięciem i szybko przygotowuj czyste podkłady instrumentalne.
    - Upuść pojedynczy utwór albo cały folder, a Usuwanie wokalu na iPhone'a, iPada i Maca rozdzieli każdą piosenkę na ścieżkę wokalną i instrumentalną. Stworzone z myślą o szybkości, dokładności i wygodnej pracy offline.
  bullets:
    - Usuwanie wokalu z pomocą AI dla precyzyjnej separacji nawet w gęstych miksach.
    - Tryb wsadowy do przetwarzania setek utworów, gdy pracujesz dalej.
    - Obsługuje WAV, AIFF, MP3, FLAC, M4A i inne formaty.
    - Przetwarzanie offline bez kont i bez czekania na wysyłanie plików.
  perfect_for_label: "Idealne dla:"
  perfect_for_text: producentów, DJ-ów, podcasterów, nauczycieli i muzyków pracujących z lokalnymi plikami audio.
  pricing_template: "Po darmowym okresie próbnym: WEEKLY_PRICE lub YEARLY_PRICE."
  offer_templates:
    weekly: "US$PRICE_VALUE tygodniowo"
    yearly: "US$PRICE_VALUE rocznie"
  cta: Dodaj Usuwanie wokalu na iPhone'a, iPada lub Maca
  image_alt: Pobierz już dziś i zobacz, dlaczego tak wielu muzyków korzysta z Usuwania wokalu, aby szybko przygotować potrzebne stemsy.
use_cases:
  title: Kto korzysta z Usuwania wokalu?
  items:
    - title: Wokaliści i miłośnicy karaoke
      body: Natychmiast zamieniaj dowolny utwór w wersję karaoke. Ćwicz w swojej tonacji, przygotowuj setlisty i powtarzaj materiał bez szukania osobnych podkładów.
    - title: Producenci i DJ-e
      body: Wyciągaj czyste instrumentale i wokale do remiksów, editów i mashupów. Przygotowuj stemsy do DAW albo do występów na żywo w zaledwie kilka kliknięć.
    - title: Nauczyciele i uczniowie
      body: Twórz uproszczone ścieżki do lekcji, ćwiczenia słuchu i transkrypcji. Izoluj wokal do analizy frazowania albo usuwaj go, by uczniowie mogli śpiewać lub grać na podkładzie.
    - title: Podcasterzy i twórcy treści
      body: Usuwaj muzykę spod wypowiedzi, czyść intro i outro oraz przygotowuj przejrzyste stemsy do montażu i ponownego wykorzystania materiału.
faq:
  title: Najczęściej zadawane pytania
  items:
    - question: Rozszerzenie Usuwanie wokalu działa wolno albo zacina się. Co mogę zrobić?
      answers:
        - Na niektórych komputerach z Windows, szczególnie laptopach, system może wybrać dla przeglądarki energooszczędny układ graficzny zamiast wydajnego. Ponieważ rozszerzenie Usuwanie wokalu przetwarza dźwięk w czasie rzeczywistym, może to powodować spowolnienia, zacinanie dźwięku albo całkowicie uniemożliwiać działanie.
      answer_html: 'Możesz ustawić w Windowsie używanie wysokowydajnego układu graficznego dla przeglądarki. Mamy tutaj instrukcję krok po kroku ze zrzutami ekranu: <a href="/pl/blog/set-high-performance-gpu-for-chrome-edge-on-windows/" class="underline">Wybierz wysokowydajny układ graficzny dla Chrome i Edge w Windows</a>. Jeśli to nie pomoże, możliwe, że komputer albo przeglądarka są po prostu zbyt ograniczone do przetwarzania w czasie rzeczywistym. W takiej sytuacji spróbuj użyć Usuwania wokalu na mocniejszym sprzęcie, jeśli masz taką możliwość.'
    - question: Jaka jest różnica między Usuwaniem wokalu Online a Usuwaniem wokalu Offline?
      answers:
        - Usuwanie wokalu Online to rozszerzenie przeglądarki, które usuwa wokal bezpośrednio na stronach takich jak YouTube i innych platformach audio lub wideo.
        - Usuwanie wokalu Offline to samodzielna aplikacja na iPhone'a, iPada i Maca, która działa całkowicie offline na własnych plikach audio i pozwala wsadowo przetwarzać całe foldery.
    - question: Czy muszę wysyłać pliki audio?
      answers:
        - Nie, nie trzeba niczego wysyłać.
        - Rozszerzenie przetwarza dźwięk bezpośrednio w przeglądarce podczas odtwarzania, a aplikacja na iPhone'a, iPada i Maca pracuje lokalnie na plikach bez udziału serwerów.
    - question: Jakie formaty audio obsługuje Usuwanie wokalu Offline?
      answers:
        - Usuwanie wokalu na iPhone'a, iPada i Maca działa z popularnymi formatami, takimi jak WAV, AIFF, MP3, FLAC, M4A i inne, więc możesz rozdzielać pliki, które już masz, bez wcześniejszej konwersji. Możesz też przeciągać wideo, foldery lub regiony z DAW, a aplikacja automatycznie wyodrębni dźwięk.
    - question: Czy usuwanie wokalu wpływa na jakość dźwięku?
      answers:
        - Usuwanie wokalu wykorzystuje separację AI zaprojektowaną tak, aby zachować czyste i muzyczne podkłady instrumentalne.
        - Wersja offline często daje lepszą jakość, bo analizuje cały utwór podczas przetwarzania i ma do dyspozycji więcej zasobów.
        - Przy bardzo złożonych albo zaszumionych miksach mogą pojawić się artefakty, ale typowe utwory zwykle rozdzielają się bardzo dobrze.
    - question: Czy mogę też zmienić tonację utworów?
      linked_answers:
        - tool_key: pitch_changer
          template: Tak, użyj TOOL_LINK, aby przesuwać wysokość i zmieniać tonację utworów online albo offline. To świetnie uzupełnia Usuwanie wokalu.
    - question: Jak mogę zmienić tempo utworu?
      answers: []
      linked_answers:
        - tool_key: bpm_extension
          template: Jeśli chcesz zwolnić albo przyspieszyć muzykę na stronie już podczas odtwarzania, użyj TOOL_LINK.
        - tool_key: speed_tool
          template: Jeśli chcesz zmienić tempo własnego pliku i zachować wysokość dźwięku, użyj TOOL_LINK.
    - question: Czy jest darmowy okres próbny? Jak działają ceny?
      answers:
        - Zarówno rozszerzenie, jak i aplikacja na iPhone'a, iPada i Maca oferują darmowy okres próbny bez karty.
        - Po okresie próbnym Usuwanie wokalu Online oferuje subskrypcje tygodniowe, roczne i zakup jednorazowy, a Usuwanie wokalu Offline subskrypcje tygodniowe i roczne, jak pokazano wyżej.
        - Wszystkie płatności są bezpiecznie obsługiwane przez Paddle w przypadku rozszerzenia albo Apple w przypadku aplikacji.
    - question: Jak anulować subskrypcję?
      answers:
        - Kliknij przycisk Manage Subscription w aplikacji albo rozszerzeniu i postępuj zgodnie z instrukcjami.
        - Proces jest w pełni automatyczny, więc nie trzeba dzwonić ani pisać maili.
    - question: Dla kogo jest Usuwanie wokalu?
      answers:
        - Usuwanie wokalu jest stworzone dla wokalistów, muzyków, producentów, DJ-ów, nauczycieli, twórców treści i wszystkich, którzy potrzebują oddzielić głos od muzyki.
        - Niezależnie od tego, czy przygotowujesz karaoke, prowadzisz lekcję, czyścisz dialog czy budujesz remiksy, szybko dostajesz czyste stemsy.
