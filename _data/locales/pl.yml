pages:
  gpu_guide:
    meta:
      title: "Wybierz wysokowydajny układ graficzny dla Chrome i Edge (Windows)"
      description: "Jeśli Usuwanie wokalu działa wolno albo niestabilnie w Windows, ustaw Chrome lub Edge tak, aby używały wysokowydajnego układu graficznego, korzystając z tego poradnika krok po kroku."
      og_title: "Wybierz wysokowydajny układ graficzny dla Chrome i Edge (Windows)"
      og_description: "Jeśli Usuwanie wokalu działa wolno albo niestabilnie w Windows, ustaw Chrome lub Edge tak, aby używały wysokowydajnego układu graficznego, korzystając z tego poradnika krok po kroku."
      og_type: article
