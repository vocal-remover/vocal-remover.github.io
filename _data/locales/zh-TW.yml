overview:
  title: Vocal Remover 是什麼？
  paragraphs:
    - Vocal Remover 可讓你在任何網站上從歌曲移除人聲，也能在電腦上把人聲與伴奏分開，不需要複雜的音訊軟體。它是為真實場景打造的工具，像是卡拉 OK、混音、練習、教學與內容製作。
    - "你可以："
  bullets:
    - 從歌曲移除人聲，得到乾淨的伴奏版本。
    - 單獨聽人聲，研究咬字、和聲與層次。
    - 準備卡拉 OK 音軌、伴奏帶與教學素材。
    - 透過移除背景音樂，整理 Podcast 與影片聲音。
  versions_intro: "Vocal Remover 有兩個版本："
  online_link_label: Vocal Remover Online
  online_link_suffix: 是網站用的瀏覽器擴充功能，而
  offline_link_label: Vocal Remover Offline
  offline_link_suffix: 是 iPhone、iPad 和 Mac 的檔案處理 App。
online:
  title: Vocal Remover Online
  paragraphs:
    - 使用 Vocal Remover，你可以在線上快速整理音軌，透過 AI 人聲分離把歌曲裡的人聲拿掉。
    - Vocal Remover Online 會把智慧人聲移除工具直接加進瀏覽器。你可以在 YouTube 與許多音訊網站上，用幾下點擊就把人聲從歌曲裡分開。
  bullets:
    - 直接在任何網站上線上移除歌曲人聲。
    - 可作為 YouTube 人聲移除擴充功能，也支援其他音樂平台。
    - 不用下載或上傳檔案，就能得到乾淨伴奏。
    - 透過 AI 人聲分離技術提供高品質結果。
    - 很適合卡拉 OK、翻唱、混音與伴奏準備。
  perfect_for_label: "很適合："
  perfect_for_text: 卡拉 OK 愛好者、歌手、聲樂老師、教師、內容創作者，以及所有會跟著線上影片練習的人。
  pricing_template: "免費試用後：WEEKLY_PRICE、YEARLY_PRICE 訂閱，或 LIFETIME_PRICE。"
  offer_templates:
    weekly: "每週 US$PRICE_VALUE"
    yearly: "每年 US$PRICE_VALUE"
    lifetime: "一次付費 US$PRICE_VALUE"
  cta: 將 Vocal Remover 加入瀏覽器
  image_alt: 安裝 Vocal Remover 擴充功能，幾秒內就能加入 Chrome 瀏覽器。
offline:
  title: Vocal Remover Offline
  paragraphs:
    - 高速的 Vocal Remover 能在幾秒內把歌曲中的人聲與伴奏分開。你也可以一鍵批次處理多個檔案，快速得到乾淨伴奏。
    - 不論是一首歌還是一整個資料夾，只要拖進來，iPhone、iPad 或 Mac 版 Vocal Remover 就會把每首歌曲分成 vocal 與 instrumental stems，兼顧速度、準確度與離線處理的便利性。
  bullets:
    - AI 人聲移除技術，面對厚實編曲也能精準分離。
    - 批次模式可一次處理上百首歌，同時不耽誤你的其他工作。
    - 支援 WAV、AIFF、MP3、FLAC、M4A 等常見格式。
    - 離線處理，不需要帳號，也不用等待上傳。
  perfect_for_label: "很適合："
  perfect_for_text: 使用本機音訊檔的製作人、DJ、Podcaster、教師與音樂人。
  pricing_template: "免費試用後：WEEKLY_PRICE 或 YEARLY_PRICE 訂閱。"
  offer_templates:
    weekly: "每週 US$PRICE_VALUE"
    yearly: "每年 US$PRICE_VALUE"
  cta: 將 Vocal Remover 加入 iPhone、iPad 或 Mac
  image_alt: 立即下載，看看為什麼那麼多音樂人都靠 Vocal Remover 快速做出需要的音軌。
use_cases:
  title: 誰會使用 Vocal Remover？
  items:
    - title: 歌手與卡拉 OK 愛好者
      body: 立刻把任何歌曲變成卡拉 OK 版本。你可以依自己的音域練習、準備歌單，也能排練時不必再辛苦找伴奏版。
    - title: 製作人與 DJ
      body: 擷取乾淨的伴奏與人聲，拿來做混音、編輯與 mashup。幾下點擊就能替 DAW 或現場 set 準備 stems。
    - title: 教師與學習者
      body: 為課堂、聽寫與採譜準備更乾淨的音軌。你可以單獨研究人聲，也能把人聲拿掉，讓學生直接跟伴奏練習。
    - title: Podcaster 與內容創作者
      body: 去掉講話底下的背景音樂，整理片頭片尾，並為剪輯與二次利用準備更清楚的分軌素材。
faq:
  title: 常見問題
  items:
    - question: Vocal Remover 擴充功能很慢或常常卡頓，我該怎麼辦？
      answers:
        - 在某些 Windows 電腦上，尤其是筆電，Windows 可能會替瀏覽器選到省電的顯示晶片，而不是速度較快的那顆。因為 Vocal Remover 擴充功能需要即時處理聲音，這可能造成延遲、爆音，甚至完全無法運作。
      answer_html: '你可以把瀏覽器改成使用高效能顯示晶片。我們整理了一份附圖的步驟說明：<a href="/zh-TW/blog/set-high-performance-gpu-for-chrome-edge-on-windows/" class="underline">在 Windows 為 Chrome 與 Edge 選擇高效能顯示晶片</a>。如果照著做之後還是沒有改善，可能是你的電腦或瀏覽器本身不適合即時處理。若方便的話，可以改用效能更高的系統。'
    - question: Vocal Remover Online 和 Vocal Remover Offline 有什麼差別？
      answers:
        - Vocal Remover Online 是瀏覽器擴充功能，可直接在 YouTube 等網站以及其他音訊或影片平台上移除人聲。
        - Vocal Remover Offline 是 iPhone、iPad 和 Mac 的獨立 App，可完全離線搭配自己的音訊檔使用，也能一次批次處理整個資料夾。
    - question: 我需要上傳音訊檔嗎？
      answers:
        - 不需要上傳。
        - 擴充功能會直接在瀏覽器裡即時處理聲音，而 iPhone、iPad、Mac App 會直接處理你電腦上的檔案，不需要經過任何伺服器。
    - question: Vocal Remover Offline 支援哪些音訊格式？
      answers:
        - iPhone、iPad 和 Mac 版 Vocal Remover 支援 WAV、AIFF、MP3、FLAC、M4A 等常見格式，所以你可以直接分離現有檔案，不必先轉檔。你也可以拖入影片、資料夾或 DAW 區段，App 會自動擷取音訊。
    - question: 移除人聲會影響音質嗎？
      answers:
        - Vocal Remover 的 AI 分離演算法是以維持伴奏乾淨、自然與有音樂性為目標。
        - 離線版本通常品質更好，因為它能分析整首歌，也有更多計算資源可用。
        - 非常複雜或噪訊很多的混音仍可能出現些微殘留，但大多數歌曲都能得到很好的分離效果。
    - question: 我也可以改變歌曲的調性嗎？
      linked_answers:
        - tool_key: pitch_changer
          template: 可以，使用 TOOL_LINK 就能在線上或離線移動音高並改變歌曲調性。和 Vocal Remover 搭配使用也很方便。
    - question: 我要怎麼改變歌曲速度？
      answers: []
      linked_answers:
        - tool_key: bpm_extension
          template: 如果你想在網站上讓正在播放的音樂變慢或變快，請使用 TOOL_LINK。
        - tool_key: speed_tool
          template: 如果你想改變自己檔案的速度，同時保持音高穩定，請使用 TOOL_LINK。
    - question: 有免費試用嗎？價格怎麼算？
      answers:
        - 擴充功能和 iPhone、iPad、Mac App 都有免綁卡的免費試用期。
        - 試用之後，Vocal Remover Online 提供每週、每年與一次買斷方案，Vocal Remover Offline 則提供每週與每年的訂閱方案，如上所示。
        - 所有付款都會透過 Paddle（擴充功能）或 Apple（App）安全處理。
    - question: 我要怎麼取消訂閱？
      answers:
        - 在 App 或擴充功能裡點選「Manage Subscription」按鈕，然後依照步驟操作。
        - 整個流程都是自動化的，所以不需要打電話或寄信。
    - question: Vocal Remover 適合誰？
      answers:
        - Vocal Remover 是為歌手、音樂人、製作人、DJ、教師、內容創作者，以及所有需要把人聲與音樂分開的人打造的。
        - 不管你是在準備卡拉 OK、教學、整理對白，還是做混音，它都能讓你快速取得乾淨分軌。
