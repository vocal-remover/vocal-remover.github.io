pages:
  gpu_guide:
    meta:
      title: "在 Windows 為 Chrome 與 Edge 選擇高效能顯示晶片"
      description: "如果 Vocal Remover 在 Windows 上很慢或常常卡頓，按照這份逐步指南把 Chrome 或 Edge 改成使用高效能顯示晶片。"
      og_title: "在 Windows 為 Chrome 與 Edge 選擇高效能顯示晶片"
      og_description: "如果 Vocal Remover 在 Windows 上很慢或常常卡頓，按照這份逐步指南把 Chrome 或 Edge 改成使用高效能顯示晶片。"
      og_type: article
      og_image: /blog/set-high-performance-gpu-for-chrome-edge-on-windows/graphics-settings-chrome-3.png
    guide:
      extension_link_label: Vocal Remover 擴充功能
      page_title: 讓 Windows 替瀏覽器使用速度更快的顯示晶片
      intro_html:
        - EXTENSION_LINK 需要即時做大量運算，所以要靠效能較好的顯示晶片才會順暢。雖然這是音訊處理，但現代瀏覽器會在背後使用顯示晶片來加速重度運算，而 Vocal Remover 也需要這部分效能。
        - 在某些電腦上，尤其是筆電，Windows 可能會替瀏覽器選到省電顯示晶片。這會造成延遲、爆音，甚至讓 Vocal Remover 擴充功能完全無法運作。這份指南會帶你把瀏覽器改成使用高效能顯示晶片。
      detected_browser_label: 偵測到的瀏覽器
      unknown_browser_label: 未知
      back_home_label: 返回首頁
      copy_button:
        idle: 複製
        success: 已複製！
      browsers:
        chrome:
          tab_label: Google Chrome
          detected_label: Google Chrome
          tab_accent: blue
          title: 設定 Chrome 使用高效能顯示晶片
          steps:
            - number: 1
              title: 開啟 Graphics 設定
              paragraphs_html:
                - '可<a href="ms-settings:display-advancedgraphics" class="underline">按這裡直接開啟</a>，或依序進入 <span class="font-medium">Settings → System → Display → Graphics</span>。'
                - '在清單中找到 <span class="font-medium">Google Chrome</span>（可能需要往下捲動）。如果已經看得到，請直接跳到 <a href="#step3-chrome" class="underline">步驟 3</a>。'
              images:
                - src: graphics-settings.png
                  alt: Settings → System → Display → Graphics 畫面
            - number: 2
              title: 把 Chrome 加進清單（僅在找不到時）
              paragraphs_html:
                - 如果清單裡沒有 Chrome：
              instructions_html:
                - '點選 <span class="font-medium">Add desktop app</span>。'
                - '在底部的 <span class="font-medium">File name</span> 欄位中，貼上下面其中一行路徑。'
                - '按下 <span class="font-medium">Enter</span>，或點選 <span class="font-medium">Add</span>。'
              note_html: 如果第一行出現錯誤，就試下一行。
              copy_paths:
                - '%LocalAppData%\Google\Chrome\Application\chrome.exe'
                - 'C:\Program Files (x86)\Google\Chrome\Application\chrome.exe'
                - 'C:\Program Files\Google\Chrome\Application\chrome.exe'
              images:
                - src: graphics-settings-2.png
                  alt: Settings → System → Display → Graphics 畫面，已標出 Add desktop app 按鈕
                - src: file-picker-2.png
                  alt: 已標出檔名欄位與按鈕的檔案選擇視窗
            - number: 3
              anchor_id: step3-chrome
              title_html: 為 Chrome 選擇 <em>High Performance</em>
              paragraphs_html:
                - '在清單中找到 <span class="font-medium">Google Chrome</span>（可能需要往下捲動），點一下後把 <span class="font-medium whitespace-nowrap">GPU preference</span> 設成 <span class="font-medium whitespace-nowrap">High Performance</span>。'
              images:
                - src: graphics-settings-chrome-3.png
                  alt: Settings → System → Display → Graphics 畫面，已標出 Chrome
            - number: 4
              title: 重新啟動瀏覽器，必要時也重新開機
              paragraphs_html:
                - 關閉 Chrome 再重新開啟。如果還是沒改善，試著重新啟動電腦。
              images: []
          troubleshooting:
            title: 如果還是沒有改善
            items:
              - label: 筆電正在使用電池？
                body_html: 有些筆電在使用電池時仍會偏向省電顯示晶片。試著接上電源。
              - label: 更新顯示卡驅動程式
                body_html: 可透過顯示晶片廠商的 App（NVIDIA / AMD / Intel）或 Windows Update 進行更新。
              - label: 重設
                body_html: '在 Graphics 設定中把 Chrome 改回 <em>Let Windows decide</em>，然後重新照著步驟設定一次。'
        edge:
          tab_label: Microsoft Edge
          detected_label: Microsoft Edge
          tab_accent: violet
          title: 設定 Edge 使用高效能顯示晶片
          steps:
            - number: 1
              title: 開啟 Graphics 設定
              paragraphs_html:
                - '可<a href="ms-settings:display-advancedgraphics" class="underline">按這裡直接開啟</a>，或依序進入 <span class="font-medium">Settings → System → Display → Graphics</span>。'
                - '在清單中找到 <span class="font-medium">Microsoft Edge</span>（可能需要往下捲動）。如果已經看得到，請直接跳到 <a href="#step3-edge" class="underline">步驟 3</a>。'
              images:
                - src: graphics-settings.png
                  alt: Settings → System → Display → Graphics 畫面
            - number: 2
              title: 把 Edge 加進清單（僅在找不到時）
              paragraphs_html:
                - 如果清單裡沒有 Edge：
              instructions_html:
                - '點選 <span class="font-medium">Add desktop app</span>。'
                - '在底部的 <span class="font-medium">File name</span> 欄位中，貼上下面其中一行路徑。'
                - '按下 <span class="font-medium">Enter</span>，或點選 <span class="font-medium">Add</span>。'
              note_html: 如果第一行出現錯誤，就試下一行。
              copy_paths:
                - 'C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe'
                - 'C:\Program Files\Microsoft\Edge\Application\msedge.exe'
              images:
                - src: graphics-settings-2.png
                  alt: Settings → System → Display → Graphics 畫面，已標出 Add desktop app 按鈕
                - src: file-picker-2.png
                  alt: 已標出檔名欄位與按鈕的檔案選擇視窗
            - number: 3
              anchor_id: step3-edge
              title_html: 為 Edge 選擇 <em>High Performance</em>
              paragraphs_html:
                - '在清單中找到 <span class="font-medium">Microsoft Edge</span>（可能需要往下捲動），點一下後把 <span class="font-medium whitespace-nowrap">GPU preference</span> 設成 <span class="font-medium whitespace-nowrap">High Performance</span>。'
              images:
                - src: graphics-settings-edge-3.png
                  alt: Settings → System → Display → Graphics 畫面，已標出 Edge
            - number: 4
              title: 重新啟動瀏覽器，必要時也重新開機
              paragraphs_html:
                - 關閉 Edge 再重新開啟。如果還是沒改善，試著重新啟動電腦。
              images: []
          troubleshooting:
            title: 如果還是沒有改善
            items:
              - label: 筆電正在使用電池？
                body_html: 有些筆電在使用電池時仍會偏向省電顯示晶片。試著接上電源。
              - label: 更新顯示卡驅動程式
                body_html: 可透過顯示晶片廠商的 App（NVIDIA / AMD / Intel）或 Windows Update 進行更新。
              - label: 重設
                body_html: '在 Graphics 設定中把 Edge 改回 <em>Let Windows decide</em>，然後重新照著步驟設定一次。'
